<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f6f6f7;--ink:#111114;--mut:#5f6068;--line:#e5e5e8;--acc:#a3089a;--grad:linear-gradient(90deg,#0470dc,#6106c4 25%,#ad03a1 48%,#ce0d13 70%,#e6600d 86%,#f8a50a);--ok:#15803d;--red:#c4111f}
*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}header .in{max-width:640px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}header img{height:42px}
.bar{height:4px;background:var(--grad)}main{max-width:640px;margin:0 auto;padding:22px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.15;margin:0 0 4px}.sub{color:var(--mut);margin:0}
.hero{display:flex;gap:14px;align-items:center}.hero .ic{width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:28px;flex:none}
.st{font-size:22px;font-weight:800;margin:0}.st small{display:block;font-size:14px;font-weight:500;color:var(--mut)}
.tl{list-style:none;margin:6px 0 0;padding:0}.tl li{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}.tl li.ok:not(:last-child)::before{background:var(--acc)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px;color:#fff;font-weight:700}
.tl li.ok .dot{background:var(--acc);border-color:var(--acc)}.tl li.cur .dot{box-shadow:0 0 0 5px rgba(163,8,154,.18)}
.tl b{display:block}.tl span{color:var(--mut);font-size:14px}.tl li:not(.ok) b{color:#9a9aa3}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;background:#25d366;color:#fff;font-weight:700;text-decoration:none;font-size:16px}
.btn2{display:inline-flex;align-items:center;gap:6px;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 14px;color:var(--ink);text-decoration:none;font-weight:600;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.row:last-child{border:0}.mut{color:var(--mut)}.sm{font-size:13.5px}.tab{font-variant-numeric:tabular-nums}
.msg{padding:12px 14px;border-radius:12px;font-size:15px}.msg.err{background:#fdecee;color:var(--red)}.msg.ok{background:#e9f7ef;color:var(--ok)}
.av{margin:0}.av .card{display:flex;gap:14px;align-items:flex-start}.av .ic2{font-size:28px;line-height:1;flex:none;width:36px;text-align:center}.av .card{border-color:#e9c6e6;background:linear-gradient(180deg,#fff,#fdf7fd)}.av b{display:block;font-size:16.5px}.av p{margin:4px 0 0;color:var(--mut);font-size:14.5px}
.btn3{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:0;border-radius:12px;padding:0 18px;margin-top:12px;background:var(--ink);color:#fff;font:700 15.5px Inter,system-ui,sans-serif;cursor:pointer}.lnk{background:none;border:0;padding:0;margin:10px 14px 0 0;color:var(--acc);font:600 14px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:underline}
</style>
</head>

 else{h+=`<div class="card" style="margin-top:16px"><div class="hero"><div class="ic">${ICON[cur.k]||'📦'}</div><p class="st">${esc(cur.t)}<small>${esc(cur.d)}${cur.em?' · '+dh(cur.em):''}</small></p></div>

  ${cur.k==='retirada'&&o.endereco?`<p class="sm" style="margin:12px 0 0">📍 Retire em: <b>${esc(o.endereco)}</b>${o.horario?'<br>🕒 '+esc(o.horario):''}</p>`:''}</div>
  <div class="card"><ul class="tl">${o.passos.map((x,i)=>`<li class="${x.ok?'ok':''} ${i===o.atual?'cur':''}"><div class="dot">${x.ok?'✓':''}</div><div><b>${esc(x.t)}</b><span>${x.ok?esc(x.d)+(x.em?' · '+dh(x.em):''):''}</span></div></li>`).join('')}</ul></div>`}
 h+=`<div class="card"><b>Resumo do pedido</b><div style="margin-top:8px">${(o.itens||[]).map(i=>`<div class="row"><span>${esc(i.descricao)}</span><span class="tab">${num(i.qtd,3)} ${UN[i.unidade]||''}</span></div>`).join('')}
  ${o.total!=null?`<div class="row"><span>Total</span><b class="tab">${moeda(o.total)}</b></div>`:''}${o.numero&&o.total?`<div class="row"><span>Pagamento</span><span>${o.pago?'<b style="color:var(--ok)">Pago ✓</b>':o.saldo>0?'Falta '+moeda(o.saldo):'—'}</span></div>`:''}</div></div>`;
 if(wa)h+=`<a class="btn" href="${wa}" target="_blank" rel="noopener">💬 Ficou com alguma dúvida? Chame no WhatsApp</a>`;
 h+=`<p class="sm mut" style="text-align:center;margin-top:16px">Esta página se atualiza sozinha. Obrigado por escolher a ${esc(o.empresa)}!</p>`;
 const av=$('#avisos');if(av)av.remove();$('#app').innerHTML=h;if(av){const c1=$('#app .card');c1?c1.after(av):$('#app').append(av)}$('#upd').textContent='Atualizado '+dh(o.atualizado)}
let ETAPA=null;async function carregar(){try{const o=await api({});const k=o.cancelado?'cancelado':(o.passos[o.atual]||{}).k;if(ETAPA&&k!==ETAPA)somRiber();ETAPA=k;render(o)}catch(e){if(!$('#app').dataset.ok)$('#app').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
if(!P.t||(!P.p&&!P.s))$('#app').innerHTML='<div class="msg err">Link de acompanhamento inválido.</div>';else{carregar();setInterval(()=>{if(document.visibilityState==='visible')carregar()},45000)}

/* ---------- avisos no celular (Web Push) + som da RIBER PRINT ---------- */
const PUSH=SB+'/functions/v1/push';
async function papi(b){const r=await fetch(PUSH,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({...P,...b})});const j=await r.json().catch(()=>({erro:'Falha de conexão'}));if(!r.ok||j.erro)throw new Error(j.erro||'Erro');return j}
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const APP=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const TEM='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const CHV='rp_avisos_'+(P.p||P.s);
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
let AC=null,SOM=0;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){}return AC}
function somRiber(){if(Date.now()-SOM<8000)return;SOM=Date.now();const ac=audio();if(navigator.vibrate)navigator.vibrate([90,50,90,50,90,50,320]);if(!ac)return;
 const t=ac.currentTime+.02;[[783.99,0,.32],[1046.5,.12,.32],[1318.5,.24,.32],[1567.98,.38,1.1]].forEach(([f,d,dur])=>{const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;
  g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.22,t+d+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d+dur);const g2=ac.createGain();g2.gain.value=.18;o.connect(g);o2.connect(g2).connect(g);g.connect(ac.destination);o.start(t+d);o2.start(t+d);o.stop(t+d+dur+.05);o2.stop(t+d+dur+.05)})}
document.addEventListener('pointerdown',audio,{once:true});
function avisos(st,extra){const el=$('#avisos');if(st==='oculto'){el.hidden=true;return}el.hidden=false;let h='';
 if(st==='pode')h=`<div class="card"><div class="ic2">🔔</div><div><b>Receba cada etapa no seu celular</b><p>A gente te avisa na hora em que seu pedido for aprovado, começar a ser impresso, ficar pronto e sair para entrega. Sem precisar abrir esta página.</p><button class="btn3" id="avOn">🔔 Ativar avisos</button></div></div>`;
 else if(st==='ativo')h=`<div class="card"><div class="ic2">✅</div><div><b>Avisos ativados neste celular</b><p>Você vai receber uma notificação a cada movimentação do seu pedido.</p><button class="lnk" id="avSom">🔊 Ouvir o som</button><button class="lnk" id="avOff">Desativar</button></div></div>`;
 else if(st==='ios')h=`<div class="card"><div class="ic2">📲</div><div><b>Quer receber os avisos no iPhone?</b><p>1. Toque em <b style="display:inline">Compartilhar</b> (o quadrado com a seta ⬆️) aqui embaixo no Safari.<br>2. Escolha <b style="display:inline">“Adicionar à Tela de Início”</b>.<br>3. Abra a RIBER PRINT pelo ícone novo e toque em “Ativar avisos”.</p></div></div>`;
 else if(st==='negado')h=`<div class="card"><div class="ic2">🔕</div><div><b>Os avisos estão bloqueados</b><p>Para receber, toque no cadeado 🔒 ao lado do endereço do site → <b style="display:inline">Notificações</b> → <b style="display:inline">Permitir</b>. Depois recarregue a página.</p></div></div>`;
 else if(st==='erro')h=`<div class="card"><div class="ic2">⚠️</div><div><b>Não foi possível ativar agora</b><p>${esc(extra||'')} Tente de novo em instantes.</p><button class="btn3" id="avOn">Tentar de novo</button></div></div>`;
 el.innerHTML=h;const on=$('#avOn');if(on)on.onclick=ativar;const off=$('#avOff');if(off)off.onclick=desativar;const sm=$('#avSom');if(sm)sm.onclick=()=>{SOM=0;somRiber()}}
async function reg(){return navigator.serviceWorker.register('sw-acompanhar.js',{scope:'./'})}
async function ativar(){audio();const b=$('#avOn');if(b){b.disabled=true;b.textContent='Ativando…'}
 try{const perm=await Notification.requestPermission();if(perm!=='granted')return avisos(perm==='denied'?'negado':'pode');
  const r=await reg();await navigator.serviceWorker.ready;const {chave}=await papi({acao:'chave'});
  const sub=await r.pushManager.getSubscription()||await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(chave)});
  await papi({acao:'inscrever',sub:sub.toJSON()});try{localStorage.setItem(CHV,'1')}catch(_){}SOM=0;somRiber();avisos('ativo')}
 catch(e){avisos('erro',e.message)}}
async function desativar(){try{const r=await navigator.serviceWorker.getRegistration();const sub=r&&await r.pushManager.getSubscription();if(sub)await papi({acao:'cancelar',sub:sub.toJSON()});try{localStorage.removeItem(CHV)}catch(_){}}catch(_){}avisos('pode')}
async function iniciarAvisos(){if(!P.t||(!P.p&&!P.s))return;
 if(!TEM)return avisos(IOS&&!APP?'ios':'oculto');
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.tipo==='push'){somRiber();carregar()}});
 if(Notification.permission==='denied')return avisos('negado');
 if(Notification.permission==='granted'){try{const r=await reg();const sub=await r.pushManager.getSubscription();let ok=false;try{ok=!!localStorage.getItem(CHV)}catch(_){}if(sub&&ok)return avisos('ativo')}catch(_){}}
 avisos('pode')}
iniciarAvisos();
</script>
