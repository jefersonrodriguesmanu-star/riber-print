<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#111114;--mut:#5f6068;--line:#e5e5e8;--acc:#a3089a;--acc2:#86067f;--grad:linear-gradient(90deg,#0470dc,#6106c4 25%,#ad03a1 48%,#ce0d13 70%,#e6600d 86%,#f8a50a);--ok:#15803d;--warn:#b45309;--red:#c4111f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}header .in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}header img{height:44px}
.bar{height:4px;background:var(--grad)}
main{max-width:760px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0 0 6px;text-wrap:balance}.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.card+.card{margin-top:16px}
h2{font-size:17px;margin:0 0 12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.span{grid-column:1/-1}
label.f{display:grid;gap:5px;font-size:13.5px;font-weight:500;color:#3f3f46}.hint{font-size:12.5px;color:var(--mut);font-weight:400}
input,select{font:inherit;font-size:16px;color:var(--ink);border:1px solid #d4d4d8;border-radius:10px;padding:0 12px;min-height:46px;background:#fff;width:100%}input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
input.bad{border-color:#dc2626;background:#fff7f7}
.seg{display:flex;gap:10px}.seg button{flex:1;min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:600;cursor:pointer}.seg button.on{border-color:var(--acc);background:#fdf0fb;color:var(--acc2)}
.btn{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:16px}.btn:hover{background:var(--acc2)}.btn:disabled{opacity:.55;cursor:default}
.msg{font-size:14px;margin-top:10px;color:#b91c1c}.ok{text-align:center;padding:30px 20px}.ok .ic{font-size:46px}
.priv{font-size:12.5px;color:var(--mut);margin-top:10px;text-align:center}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
@media(max-width:600px){.g2,.g3{grid-template-columns:minmax(0,1fr)}header img{height:36px}}
</style>
</head>

const fmtCep=v=>dig(v).slice(0,8).replace(/(\d{5})(\d)/,'$1-$2');
async function buscaCep(){const c=dig(F.cep);if(c.length!==8)return;try{const r=await fetch('https://viacep.com.br/ws/'+c+'/json/').then(r=>r.json());if(r&&!r.erro){F.endereco=F.endereco||r.logradouro||'';F.bairro=F.bairro||r.bairro||'';F.cidade=r.localidade||F.cidade;F.uf=r.uf||F.uf;render();(F.endereco?$('[data-k=numero]'):$('[data-k=endereco]'))?.focus()}}catch(e){}}
async function buscaCnpj(){const c=dig(F.doc);if(c.length!==14||!cnpjOk(c))return;try{const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+c).then(r=>r.ok?r.json():null);if(r){F.nome=F.nome||r.razao_social||'';F.fantasia=F.fantasia||r.nome_fantasia||'';if(!F.cep&&r.cep){F.cep=String(r.cep);F.endereco=r.logradouro||'';F.numero=r.numero||'';F.complemento=r.complemento||'';F.bairro=r.bairro||'';F.cidade=r.municipio||'';F.uf=r.uf||''}render()}}catch(e){}}
const campo=(k,l,o={})=>`<label class="f ${o.cls||''}">${l}${o.req?' *':''}${o.hint?` <span class="hint">${o.hint}</span>`:''}<input data-k="${k}" value="${esc(o.fmt?o.fmt(F[k]):F[k])}" ${o.attrs||''}></label>`;
function erros(){const e={};if(F.nome.trim().length<3)e.nome=1;const d=dig(F.doc);if(F.tipo==='PF'?!cpfOk(d):!cnpjOk(d))e.doc=1;if(dig(F.whatsapp).length<10)e.whatsapp=1;if(dig(F.cep).length!==8)e.cep=1;for(const k of ['endereco','numero','bairro','cidade'])if(!F[k].trim())e[k]=1;if(F.uf.trim().length!==2)e.uf=1;if(F.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email))e.email=1;return e}
let tentou=false;
function render(){const app=$('#app');
 if(!INFO){app.innerHTML='<h1>Carregando…</h1>';return}
 if(INFO.erro){app.innerHTML=`<div class="card ok"><div class="ic">🔗</div><h1>Link inválido</h1><p class="sub">${esc(INFO.erro)}. Peça um novo link pelo WhatsApp.</p></div>`;return}
 if(feito||INFO.status==='concluido'){const w=dig(INFO.empresaWhats);app.innerHTML=`<div class="card ok"><div class="ic">✅</div><h1>${feito?'Cadastro feito, '+esc(feito.nome)+'!':'Cadastro já enviado'}</h1><p class="sub">${feito?'Recebemos seus dados. Já pode fazer seus pedidos com a gente.':'Este link já foi usado. Se precisar corrigir algum dado, fale com a gente.'}</p>${w?`<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://wa.me/55${w.replace(/^55/,'')}">Voltar para o WhatsApp</a>`:''}</div>`;return}
 const E=tentou?erros():{};const bad=k=>E[k]?'class="bad"':'';
 app.innerHTML=`<h1>Seu cadastro na ${esc(INFO.empresa)}</h1><p class="sub">Preencha uma vez e pronto: seus próximos pedidos já saem com seus dados e o endereço de entrega.</p>
 <div class="card"><h2>Seus dados</h2>
  <div class="seg" style="margin-bottom:12px"><button type="button" data-t="PF" class="${F.tipo==='PF'?'on':''}">Pessoa física (CPF)</button><button type="button" data-t="PJ" class="${F.tipo==='PJ'?'on':''}">Empresa (CNPJ)</button></div>
  <div class="g2">${campo('doc',F.tipo==='PF'?'CPF':'CNPJ',{req:1,fmt:fmtDoc,attrs:'inputmode="numeric" autocomplete="off" '+bad('doc'),hint:F.tipo==='PJ'?'preenchemos o resto pelo CNPJ':''})}
   ${campo('nome',F.tipo==='PF'?'Nome completo':'Razão social',{req:1,attrs:'autocomplete="name" '+bad('nome')})}
   ${F.tipo==='PJ'?campo('fantasia','Nome fantasia')+campo('ie','Inscrição estadual',{hint:'se tiver'}):''}
   ${campo('whatsapp','WhatsApp',{req:1,fmt:fmtFone,attrs:'inputmode="tel" autocomplete="tel" '+bad('whatsapp')})}
   ${campo('email','E-mail',{attrs:'type="email" autocomplete="email" '+bad('email')})}</div></div>
 <div class="card"><h2>Endereço de entrega</h2>
  <div class="g2">${campo('cep','CEP',{req:1,fmt:fmtCep,attrs:'inputmode="numeric" autocomplete="postal-code" '+bad('cep'),hint:'preenche o endereço sozinho'})}<div></div></div>
  <div class="g3" style="margin-top:12px">${campo('endereco','Rua / avenida',{req:1,attrs:'autocomplete="address-line1" '+bad('endereco')})}${campo('numero','Número',{req:1,attrs:bad('numero')})}${campo('complemento','Complemento')}</div>
  <div class="g3" style="margin-top:12px">${campo('bairro','Bairro',{req:1,attrs:bad('bairro')})}${campo('cidade','Cidade',{req:1,attrs:bad('cidade')})}${campo('uf','UF',{req:1,attrs:'maxlength="2" style="text-transform:uppercase" '+bad('uf')})}</div></div>
 <button class="btn" id="enviar" ${enviando?'disabled':''}>${enviando?'Enviando…':'Confirmar meu cadastro'}</button>
 ${msg?`<div class="msg">${esc(msg)}</div>`:''}<div class="priv">🔒 Usamos seus dados só para seus pedidos, notas e entregas.</div>`;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{F.tipo=b.dataset.t;render()});
 app.querySelectorAll('[data-k]').forEach(i=>{i.oninput=()=>{F[i.dataset.k]=i.value;if(tentou){const e=erros();i.classList.toggle('bad',!!e[i.dataset.k])}};
  i.onblur=()=>{const k=i.dataset.k;if(k==='cep'){i.value=fmtCep(F.cep);buscaCep()}if(k==='doc'){i.value=fmtDoc(F.doc);if(F.tipo==='PJ')buscaCnpj();else if(dig(F.doc).length===14){F.tipo='PJ';render();buscaCnpj()}}if(k==='whatsapp')i.value=fmtFone(F.whatsapp);if(k==='uf'){F.uf=F.uf.toUpperCase();i.value=F.uf}}});
 $('#enviar').onclick=enviar}
async function enviar(){tentou=true;const e=erros();if(Object.keys(e).length){msg=e.doc?'Confira o '+(F.tipo==='PF'?'CPF':'CNPJ')+'.':'Preencha os campos marcados em vermelho.';render();document.querySelector('input.bad')?.focus();return}
 enviando=true;msg='';render();try{const {data,error}=await sb.rpc('rp_convite_cadastrar',{p_id:ID,p_token:TK,p:{...F,doc:dig(F.doc),whatsapp:dig(F.whatsapp),cep:dig(F.cep)}});if(error)throw new Error(error.message);if(data&&data.erro)throw new Error(data.erro);feito=data;window.scrollTo(0,0)}catch(x){msg=x.message||'Não foi possível enviar. Tente de novo.'}enviando=false;render()}
(async()=>{try{const {data,error}=await sb.rpc('rp_convite_info',{p_id:ID,p_token:TK});INFO=error?{erro:'Não foi possível abrir o link'}:data;if(INFO&&!INFO.erro){F.nome=INFO.nome||'';F.whatsapp=INFO.whatsapp||''}}catch(e){INFO={erro:'Sem conexão'}}render()})();
}
</script>
</body>
</html>
