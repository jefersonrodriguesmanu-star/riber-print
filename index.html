<style>
/* VOICE: sistema de trabalho sério e rápido, como a mesa de produção de uma gráfica.
   IDEA: a ordem de serviço / ficha de produção DTF — cada pedido é um ticket com rolo, metros e status.
   PICTURE: o próprio trabalho (Kanban, pedido, dashboard) ocupa a tela.
   COLOUR and TYPE: preto, branco e grafite com vermelho RIBER como destaque; Geist.
   LAYOUT: menu lateral recolhível + área de trabalho; empilha abaixo de 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f4f5,#0b0b0d);--card:light-dark(#ffffff,#131316);--ink:light-dark(#0a0a0b,#f4f4f5);--mut:light-dark(#71717a,#a1a1aa);
--line:light-dark(#e4e4e7,#26262b);--soft:light-dark(#f4f4f5,#1b1b1f);--side:light-dark(#ffffff,#000000);--sidetx:light-dark(#52525b,#a1a1aa);--sidehv:light-dark(#f4f4f5,#18181b);--sideon:light-dark(#fbeefa,#1c1c20);--sidebd:light-dark(#e4e4e7,#1f1f23);--sidestrong:light-dark(#18181b,#ffffff);--acc:light-dark(#a3089a,#d23fc2);--acc2:light-dark(#86067f,#e35fd5);--grad:linear-gradient(90deg,#0470dc,#6106c4 25%,#ad03a1 48%,#ce0d13 70%,#e6600d 86%,#f8a50a);--red:#e11d2e;--red2:light-dark(#c4111f,#ff3b4c);
--ok:light-dark(#15803d,#4ade80);--warn:light-dark(#b45309,#fbbf24);--info:light-dark(#1d4ed8,#60a5fa);--vio:light-dark(#6d28d9,#a78bfa)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}:root[data-modo=light]{color-scheme:light}:root[data-modo=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.tab{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);color:var(--sidestrong);border-right:1px solid var(--sidebd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s}
.side.min{width:64px}.side .brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--sidebd)}
.logo{width:34px;height:34px;border-radius:9px;background:#000 center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.5px;color:#fff;flex:none}
.side nav{padding:10px 8px;overflow-y:auto;flex:1;min-height:0}.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#71717a;padding:12px 10px 4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--sidetx);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left;min-height:38px}
.nv:hover{background:var(--sidehv);color:var(--sidestrong)}.nv.on{background:var(--sideon);color:var(--sidestrong)}.nv.on svg{color:var(--acc)}.nv.on{box-shadow:inset 3px 0 0 #d23fc2}.nv svg{width:18px;height:18px;flex:none}
.side.min .lbl,.side.min .grp{display:none}.side.min .nv{justify-content:center}
.main{flex:1;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 20px;background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{padding:22px clamp(14px,2.5vw,32px);max-width:1440px;width:100%;margin:0 auto}
h1{font-size:24px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}h2{font-size:16px;margin:0}
.sub{color:var(--mut);font-size:13.5px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 14px;min-height:38px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:var(--acc2)}
.btn.d{color:var(--red2)}.btn.sm{min-height:32px;padding:0 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn svg{width:16px;height:16px}
.in{width:100%;min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in oklab,var(--acc) 20%,transparent)}textarea.in{min-height:70px;resize:vertical}
.lb{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin-bottom:5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.b-ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}.b-warn{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn)}
.b-red{background:color-mix(in oklab,var(--red) 14%,transparent);color:var(--red2)}.b-info{background:color-mix(in oklab,var(--info) 14%,transparent);color:var(--info)}.b-vio{background:color-mix(in oklab,var(--vio) 15%,transparent);color:var(--vio)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr.hov:hover td{background:var(--soft);cursor:pointer}.r{text-align:right}.nw{white-space:nowrap}
.scroll{overflow-x:auto}.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:600}
.kpi{padding:14px 16px}.kpi .v{font-size:clamp(20px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;margin-top:4px}.kpi .t{font-size:12.5px;color:var(--mut);font-weight:500}
.delta{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:6px}
.hero{background:#000;color:#fff;border-color:#1f1f23;position:relative;overflow:hidden}.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}.brandlogo{display:block;width:100%;max-width:190px;height:auto}.side.min .brandlogo{display:none}.side:not(.min) .logo{display:none}.hero .t,.hero .mut{color:#a1a1aa}
.bars{display:flex;align-items:flex-end;gap:3px;height:220px;padding-top:8px}.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bars span{display:block;background:var(--acc);border-radius:4px 4px 1px 1px;min-height:2px}.bars>div:hover span{filter:brightness(1.15)}
.hbar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.hbar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;min-height:calc(100vh - 210px);align-items:flex-start}
.col{width:282px;flex:none;background:var(--soft);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.over{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 6%,var(--soft))}.col .h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13.5px;font-weight:600}
.col .bd{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.tk{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;cursor:grab;position:relative}
.tk:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}.tk.urg{border-left:3px solid var(--red)}.tk.alta{border-left:3px solid var(--warn)}
.dot{width:9px;height:9px;border-radius:9px;flex:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal>.card{width:100%;max-width:760px;animation:up .2s ease-out}.modal>.card.lg{max-width:1100px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--side);color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.25)}.toast .e{background:#7f1d1d}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.itm{border:1px solid var(--line);border-radius:11px;padding:10px;display:grid;gap:8px;grid-template-columns:minmax(0,4fr) minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,1.2fr) auto;align-items:center}
.itm.err{border-color:var(--red2)}
.res{position:absolute;top:44px;left:0;right:0;z-index:30;max-height:360px;overflow-y:auto;padding:6px}
.res button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}.res button:hover{background:var(--soft)}
.empty{padding:48px 16px;text-align:center;color:var(--mut)}
.hide-s{}.burger{display:none}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.side{position:fixed;z-index:50;left:0;transform:translateX(-100%);transition:transform .2s;width:250px}.side.open{transform:none}.side.min{width:250px}
.side.min .lbl,.side.min .grp{display:revert}.burger{display:inline-flex}.g3,.g2{grid-template-columns:minmax(0,1fr)}
.itm{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.itm>:first-child{grid-column:1/-1}.hide-s{display:none}}
@media(max-width:600px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:13px}td,th{padding:9px 8px}}
@media print{.side,.top,.noprint{display:none!important}}
</style>

const TERMO_HTML=`<h2 style="margin:0 0 4px;font-size:20px">Termo de Confidencialidade e Uso do Sistema</h2><div style="color:#a1a1aa;font-size:13px;margin-bottom:12px">RIBER PRINT · versão de 21/11/2026</div>
<p>O <b>RIBER PRINT ERP</b> foi desenvolvido com muito profissionalismo, cuidado e investimento, exclusivamente para a RIBER PRINT. Ele reúne informações estratégicas da empresa e é uma ferramenta de trabalho de uso restrito.</p>
<p><b>1. Informações confidenciais.</b> São confidenciais todas as informações acessadas pelo sistema, incluindo: dados de clientes (nomes, telefones, endereços, documentos), preços, tabelas, promoções, custos, margens, fornecedores, pedidos, faturamento, artes e estampas, relatórios, processos de produção e o próprio sistema (telas, funcionamento e links).</p>
<p><b>2. Sigilo é de extrema importância.</b> Comprometo-me a não copiar, fotografar, tirar print, gravar a tela, exportar, encaminhar, publicar ou divulgar essas informações, por qualquer meio, a pessoas de fora da empresa, em especial a concorrentes, que poderiam ver e copiar nosso trabalho.</p>
<p><b>3. Uso correto.</b> Usarei o sistema somente para as minhas atividades na RIBER PRINT. Não usarei dados de clientes para fins pessoais e não compartilharei minha senha ou meu acesso com ninguém.</p>
<p><b>4. Vazamentos.</b> Se eu perceber ou suspeitar de qualquer vazamento, acesso indevido ou perda do meu celular/senha, avisarei a administração imediatamente.</p>
<p><b>5. Registro.</b> Estou ciente de que meus acessos e ações no sistema ficam registrados com nome, data e horário.</p>
<p><b>6. Vigência.</b> Este compromisso de sigilo vale durante todo o período em que eu trabalhar na RIBER PRINT e continua valendo após o fim do vínculo.</p>
<p><b>7. Descumprimento.</b> O descumprimento deste termo poderá resultar em medidas disciplinares e em responsabilização conforme a legislação, incluindo a Lei Geral de Proteção de Dados (Lei nº 13.709/2018).</p>`;

 d.innerHTML='<form style="width:min(680px,100%);max-height:94vh;display:grid;grid-template-rows:1fr auto;background:#141417;color:#fafafa;border:1px solid #27272a;border-radius:16px;overflow:hidden"><div style="overflow:auto;padding:22px 24px">'+TERMO_HTML+'</div><div style="border-top:1px solid #27272a;padding:16px 24px;display:grid;gap:10px;background:#0f0f12"><input name="nome" required minlength="5" placeholder="Seu nome completo" value="" style="min-height:44px;border-radius:10px;border:1px solid #3f3f46;background:#0b0b0d;color:#fafafa;padding:0 12px;font-size:16px"><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input name="ok" type="checkbox" required style="width:20px;height:20px;margin-top:2px"> <span>Li e aceito o Termo de Confidencialidade e Uso do Sistema da RIBER PRINT.</span></label><div style="display:flex;gap:10px;flex-wrap:wrap"><button style="flex:1;min-height:44px;border:0;border-radius:10px;background:#a3089a;color:#fff;font-weight:700;font-size:15px;cursor:pointer">Aceitar e entrar</button><button type="button" data-a="sair" style="min-height:44px;padding:0 16px;border:1px solid #3f3f46;border-radius:10px;background:transparent;color:#a1a1aa;cursor:pointer">Não aceito (sair)</button></div><div class="m" style="font-size:13px;color:#a1a1aa"></div></div></form>';
 document.body.appendChild(d);const f=d.querySelector('form');if(cur.nomeCompleto)f.nome.value=cur.nomeCompleto;
 f.querySelector('[data-a=sair]').onclick=()=>sb.auth.signOut();
 f.onsubmit=async e=>{e.preventDefault();const m=f.querySelector('.m');const nome=f.nome.value.trim();if(nome.split(/\s+/).length<2)return m.textContent='Digite o nome completo (nome e sobrenome).';m.textContent='Registrando aceite…';
  const termo={versao:TERMO_V,em:new Date().toISOString(),nome,email:u.email,dispositivo:navigator.userAgent.slice(0,160)};
  const base={desde:u.created_at,email:u.email,nome:(u.user_metadata&&u.user_metadata.nome)||u.email.split('@')[0],...cur};
  const {error}=await sb.from('rp_docs').upsert({path:'equipe/'+u.id,col:'equipe',data:{...base,nomeCompleto:nome,termo,termosAceitos:[...(cur.termosAceitos||[]),termo].slice(-10)}},{onConflict:'path'});
  if(error){m.textContent='Não foi possível registrar: '+error.message;return}d.remove();res()}})}
window.RP_TERMO={versao:TERMO_V,html:TERMO_HTML};
function novaSenha(){const d=document.createElement('div');d.id='rp-nova';d.style.cssText='position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:rgba(0,0,0,.85);font:16px Inter,system-ui,sans-serif;padding:16px';
 d.innerHTML='<form style="width:min(360px,100%);background:#141417;color:#fafafa;border:1px solid #27272a;border-radius:16px;padding:24px;display:grid;gap:12px"><b>Defina sua nova senha</b><input type="password" minlength="6" required autocomplete="new-password" placeholder="Nova senha" style="min-height:44px;border-radius:10px;border:1px solid #3f3f46;background:#0b0b0d;color:#fafafa;padding:0 12px;font-size:16px"><button style="min-height:44px;border:0;border-radius:10px;background:#a3089a;color:#fff;font-weight:700">Salvar senha</button><div style="font-size:13px;color:#a1a1aa"></div></form>';
 document.body.appendChild(d);const f=d.querySelector('form');f.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:f.querySelector('input').value});if(error)f.querySelector('div').textContent=error.message;else d.remove()}}
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setTimeout(novaSenha,0);if(s&&!sessao)entrou(s);if(ev==='SIGNED_OUT'){sessao=null;location.reload()}});
const iniciar=async()=>{const {data}=await sb.auth.getSession();if(data.session)entrou(data.session);else telaLogin()};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
const logado=()=>sessao?Promise.resolve():new Promise(r=>prontos.push(r));
window.RP_SAIR=()=>sb.auth.signOut();

/* ---- canais em tempo real: um por coleção / documento ---- */
const canais={};
function canal(chave,filtro,fn){
 let c=canais[chave];
 if(!c){c=canais[chave]={ouv:new Set(),rec:new Set(),ch:null};
  const abrir=()=>{c.ch=sb.channel('rp:'+chave+':'+Math.random().toString(36).slice(2,7)).on('postgres_changes',{event:'*',schema:'public',table:'rp_docs',filter:filtro},pl=>{for(const f of c.ouv)f(pl)})
   .subscribe(st=>{if(st==='SUBSCRIBED')for(const f of c.rec)f();if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){setTimeout(()=>{try{sb.removeChannel(c.ch)}catch(e){}if(c.ouv.size)abrir()},3000)}})};
  abrir();c.reabrir=abrir}
 c.ouv.add(fn.ev);c.rec.add(fn.rec);if(c.ch&&c.ch.state==='joined')setTimeout(fn.rec,0);
 return()=>{c.ouv.delete(fn.ev);c.rec.delete(fn.rec);if(!c.ouv.size){try{sb.removeChannel(c.ch)}catch(e){}delete canais[chave]}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)for(const c of Object.values(canais))for(const f of c.rec)f()});

/* ---- documentos ---- */
function docRef(path){return{id:idOf(path),path,
 async get(){await logado();const {data,error}=await sb.from('rp_docs').select('data').eq('path',path).maybeSingle();if(error)throw err(error);return snap(path,data?data.data:null)},
 async set(d){await logado();const {error}=await sb.from('rp_docs').upsert({path,col:colOf(path),data:clone(d)},{onConflict:'path'});if(error)throw err(error)},
 async update(d){await logado();const {error}=await sb.rpc('rp_update',{p_path:path,p_patch:clone(d)});if(error)throw err(error)},
 async delete(){await logado();const {error}=await sb.from('rp_docs').delete().eq('path',path);if(error)throw err(error)},
 async acquire(o){await logado();const {data,error}=await sb.rpc('rp_acquire',{p_path:path,p_holder:String(o&&o.holder||'x'),p_ttl:Number(o&&o.ttlMs||5000)});if(error)throw err(error);return{acquired:!!data}},
 onSnapshot(next,onErr){let vivo=true,un=null;
  const carregar=async()=>{try{const s=await this.get();if(vivo)next(s)}catch(e){onErr&&onErr(err(e))}};
  logado().then(()=>{if(!vivo)return;un=canal('d:'+path,'path=eq.'+path,{ev:pl=>{if(!vivo)return;next(snap(path,pl.eventType==='DELETE'?null:pl.new.data))},rec:carregar});carregar()});
  return()=>{vivo=false;un&&un()}}}}

/* ---- consultas ---- */
function consulta(col,ord,lim,wh){
 const q={path:col,
  orderBy:(f,d)=>consulta(col,[f,d||'asc'],lim,wh),limit:n=>consulta(col,ord,n,wh),where:(f,o,v)=>consulta(col,ord,lim,[...(wh||[]),[f,o,v]]),doc:id=>docRef(col+'/'+(id||Math.random().toString(36).slice(2,12))),
  async get(){await logado();const rows=await buscar();return{docs:rows.map(r=>snap(r.path,r.data)),size:rows.length,empty:!rows.length}},
  onSnapshot(next,onErr){let vivo=true,un=null;const m=new Map();
   const casa=d=>{for(const [f,o,v] of wh||[]){const x=d&&d[f];if(o==='<'&&!(x<v))return false;if(o==='<='&&!(x<=v))return false;if(o==='>'&&!(x>v))return false;if(o==='>='&&!(x>=v))return false;if(o==='=='&&x!==v)return false}return true};
   const emitir=()=>{let a=[...m.entries()].map(([p,d])=>({p,d}));if(ord){const [f,dir]=ord;a.sort((x,y)=>{const u=x.d[f]??'',w=y.d[f]??'';return(u<w?-1:u>w?1:0)*(dir==='desc'?-1:1)})}if(lim)a=a.slice(0,lim);
    const docs=a.map(x=>snap(x.p,x.d));next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},docChanges:()=>[]})};
   let seq=0;const carregar=async()=>{const s=++seq;try{const rows=await buscar();if(!vivo||s!==seq)return;m.clear();for(const r of rows)m.set(r.path,r.data);emitir()}catch(e){onErr&&onErr(err(e))}};
   let t=null;const agenda=()=>{clearTimeout(t);t=setTimeout(emitir,60)};
   logado().then(()=>{if(!vivo)return;un=canal('c:'+col,'col=eq.'+col,{ev:pl=>{if(!vivo)return;
     if(pl.eventType==='DELETE'){const p=pl.old&&pl.old.path;if(p&&m.delete(p)){if(lim&&m.size<lim)carregar();else agenda()}return}
     const r=pl.new;if(casa(r.data))m.set(r.path,r.data);else m.delete(r.path);agenda()},rec:carregar});carregar()});
   return()=>{vivo=false;clearTimeout(t);un&&un()}}};
 async function buscar(){const out=[];const max=lim||1e9;let de=0;
  while(out.length<max){const n=Math.min(1000,max-out.length);let r=sb.from('rp_docs').select('path,data').eq('col',col);
   for(const [f,o,v] of wh||[]){const k='data->>'+f;r=o==='<'?r.lt(k,v):o==='<='?r.lte(k,v):o==='>'?r.gt(k,v):o==='>='?r.gte(k,v):r.eq(k,v)}
   r=ord?r.order('data->>'+ord[0],{ascending:ord[1]!=='desc',nullsFirst:false}).order('path'):r.order('path');
   const {data,error}=await r.range(de,de+n-1);if(error)throw err(error);out.push(...data);if(data.length<n)break;de+=n}
  return out}
 return q}

const db={doc:docRef,collection:p=>consulta(p)};
const user={
 async isOwner(){await logado();const {data}=await sb.rpc('rp_is_owner');return!!data},
 async id(){await logado();return sessao.user.id},
 async profiles(ids){await logado();if(!ids||!ids.length)return{};const {data}=await sb.from('rp_docs').select('path,data').in('path',ids.map(i=>'equipe/'+i));
  const o={};for(const r of data||[])o[idOf(r.path)]={name:r.data.nome||r.data.email||''};return o}};
const downloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data],{type:/\.html?$/.test(filename)?'text/html':/\.csv$/.test(filename)?'text/csv':/\.json$/.test(filename)?'application/json':'application/octet-stream'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}};
window.claude={use:async n=>{if(n==='db'){await logado();return db}if(n==='user'){await logado();return user}if(n==='downloads')return downloads;return null}};
})();

 if(p.statusFin&&p.statusFin!==fin)hist.push({em:new Date().toISOString(),por:quem,tipo:'financeiro',de:p.statusFin,para:fin});
 let ordens={...(p.ordens||{})};let statusProd=p.statusProd||'aguardando';
 const liberado=!p.cancelado&&(fin==='pago'||p.autorizado);
 if(liberado){const setores=[...new Set((p.itens||[]).map(i=>i.setor).filter(s=>s&&SETORES[s]))];
  for(const s of setores)if(!ordens[s])ordens[s]='pendente';
  for(const s of Object.keys(ordens))if(!setores.includes(s)&&ordens[s]==='pendente')delete ordens[s];
  const vals=Object.values(ordens);
  if(vals.length&&vals.every(v=>v==='concluida')&&['aguardando','em_producao'].includes(statusProd))statusProd='pronto';
  else if(vals.some(v=>v==='em_andamento'||v==='concluida')&&statusProd==='aguardando')statusProd='em_producao'}
 if(p.cancelado){statusProd='cancelado';for(const s in ordens)if(ordens[s]!=='concluida')delete ordens[s]}
 const producaoEm=p.producaoEm||(EM_PROD.includes(statusProd)&&!EM_PROD.includes(p.statusProd||'aguardando')?new Date().toISOString():undefined);
 return{...p,...(producaoEm?{producaoEm}:{}),totais:t,total:t.total,pago,saldo:r2(t.total-pago),statusFin:fin,ordens,statusProd,historico:hist,dia:diaSP(p.criadoEm)}}
/* Reservas de vestuário: calculadas a partir dos pedidos em aberto (nunca duplicam). */
function reservas(pedidos,excetoId){const m={};for(const p of pedidos){if(p.cancelado||p.baixaEstoque||p.id===excetoId)continue;for(const i of p.itens||[])if(i.varianteId)m[i.varianteId]=(m[i.varianteId]||0)+i.qtd}return m}

/* ---------------- dados: assinatura das coleções ---------------- */
function useCol(db,path,ordem){
 const [st,setSt]=useState({rows:[],ok:false,err:null});
 useEffect(()=>{if(!db)return;let q=db.collection(path);if(ordem)q=q.orderBy(ordem[0],ordem[1]).limit(1000);
  const t=setTimeout(()=>setSt(s=>s.ok?s:{...s,err:'lento'}),10000);
  const un=q.onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(t);setSt({rows:s.docs.map(d=>({...d.data(),id:d.id})),ok:true,err:null})},e=>{clearTimeout(t);setSt(s=>({...s,ok:true,err:e.code}))});
  return()=>{clearTimeout(t);un()}},[db,path]);
 return st}
/* coleções grandes: páginas de 1000 encadeadas pelo campo de ordem */
function useColTudo(db,path,campo){
 const [pg,setPg]=useState([]);const [cur,setCur]=useState([null]);const [ok,setOk]=useState(false);const [err,setErr]=useState(null);const okR=useRef(false);
 useEffect(()=>{if(!db)return;setPg(a=>a.length>cur.length?a.slice(0,cur.length):a);const uns=cur.map((c,k)=>{let q=db.collection(path);if(c)q=q.where(campo,'<',c);q=q.orderBy(campo,'desc').limit(1000);
   return q.onSnapshot(s=>{const rows=s.docs.map(d=>({...d.data(),id:d.id}));setPg(a=>{const b=[...a];b[k]=rows;return b});
    if(k===0)setOk(true);if(rows.length===1000){const u=rows[rows.length-1][campo];if(u&&u!==c)setCur(x=>x[k+1]===u?x:[...x.slice(0,k+1),u])}},e=>{setOk(true);setErr(e.code)})});
  const t=setTimeout(()=>{if(!okR.current)setErr(x=>x||'lento')},10000);return()=>{clearTimeout(t);uns.forEach(u=>u())}},[db,path,cur.join('|')]);
 okR.current=ok;
 const rows=useMemo(()=>{const m=new Map();for(const a of pg)for(const r of a||[])m.set(r.id,r);return[...m.values()].sort((a,b)=>(b[campo]||'').localeCompare(a[campo]||''))},[pg]);
 return{rows,ok,err}}

async function proximoNumero(db,pedidos){
 const ref=db.doc('contadores/pedidos');const maxLocal=Math.max(1000,...pedidos.map(p=>p.numero||0));
 for(let t=0;t<6;t++){const r=await ref.acquire({holder:TAB,ttlMs:5000});
  if(r.acquired){const s=await ref.get();const n=Math.max(maxLocal,(s.exists&&s.data().ultimo)||1000)+1;await ref.set({ultimo:n});return n}
  await new Promise(k=>setTimeout(k,350+Math.random()*400))}
 return maxLocal+1}

async function moverPedido({db,p,etapa,me,pode,produtos,toast,abrir}){
 if(p.etapaId===etapa.id)return;
 if(!pode('mover'))return toast('Você não tem permissão para mover pedidos.',1);
 if(p.cancelado&&!etapa.cancela)return toast('Pedido #'+p.numero+' está cancelado.',1);
 if(etapa.exigePagamento&&p.statusFin!=='pago')return toast('Pedido #'+p.numero+' não está pago. Registre o pagamento antes de mover para "'+etapa.nome+'".',1);
 if(etapa.exigeLiberacao&&!(p.statusFin==='pago'||p.autorizado))return toast('Pedido #'+p.numero+' não liberado: registre o pagamento ou autorize a produção faturada.',1);
 const agora=new Date().toISOString();let np={...p,etapaId:etapa.id,etapaDesde:agora,historico:[...(p.historico||[]),{em:agora,por:me,tipo:'etapa',de:p.etapaId,para:etapa.id}]};
 if(etapa.cancela){if(!pode('cancelar'))return toast('Sem permissão para cancelar.',1);if(p.pago>0)return toast('Estorne os pagamentos antes de cancelar.',1);np.cancelado={em:agora,por:me,motivo:'Movido para '+etapa.nome}}
 if(etapa.status&&!etapa.cancela)np.statusProd=etapa.status;
 if(!p.producaoEm&&EM_PROD.includes(np.statusProd)&&!EM_PROD.includes(p.statusProd||'aguardando'))np.producaoEm=agora;
 try{
  if(np.statusProd==='entregue'&&!p.baixaEstoque){ // baixa definitiva do vestuário na entrega
   const porProd={};for(const i of p.itens)if(i.varianteId)(porProd[i.produtoId]=porProd[i.produtoId]||[]).push(i);
   for(const pid in porProd){const pr=produtos.find(x=>x.id===pid);if(!pr||!pr.controlaEstoque)continue;
    const variantes=(pr.variantes||[]).map(v=>{const q=sum(porProd[pid].filter(i=>i.varianteId===v.id),i=>i.qtd);return q?{...v,estoque:Number(v.estoque||0)-q}:v});
    const mov=[...(pr.movimentos||[]),...porProd[pid].map(i=>({em:agora,var:i.varianteId,q:-i.qtd,tipo:'venda',ref:'#'+p.numero}))].slice(-200);
    await db.doc('produtos/'+pid).update({variantes,movimentos:mov})}
   np.baixaEstoque=true;np.entregueEm=agora}
  const {id:_x,...c}=normalizar(np,me);await db.doc('pedidos/'+p.id).set(c);toast('#'+p.numero+' → '+etapa.nome);
  if(ONLINE()&&abrir&&np.entrega&&np.entrega!=='retirada'&&!np.cancelado&&['pronto','entregue'].includes(c.statusProd)&&!(p.etiqueta&&p.etiqueta.id))abrir('etiqueta',p.id)}
 catch(e){toast('Erro ao mover: '+(e.message||e.code),1)}}

 const [per,setPer]=useState(()=>{try{return localStorage.getItem('rp_kb_per')||'ativos'}catch(e){return 'ativos'}});const [de,setDe]=useState(addD(diaSP(),-6));const [ate,setAte]=useState(diaSP());
 useEffect(()=>{try{localStorage.setItem('rp_kb_per',per)}catch(e){}},[per]);
 const hoje=diaSP();const faixa=per==='hoje'?[hoje,hoje]:per==='ontem'?[addD(hoje,-1),addD(hoje,-1)]:per==='7'?[addD(hoje,-6),hoje]:per==='15'?[addD(hoje,-14),hoje]:per==='30'?[addD(hoje,-29),hoje]:per==='custom'?[de<=ate?de:ate,de<=ate?ate:de]:null;
 const limite=Date.now()-7*864e5;
 const ps=pedidos.filter(p=>(faixa?(p.dia>=faixa[0]&&p.dia<=faixa[1]):(!(p.cancelado||p.statusProd==='entregue')||new Date(p.etapaDesde)>limite))&&(!q||String(p.numero).includes(q)||norm(p.clienteNome).includes(norm(q))));
 let cols,cards;
 if(vis==='geral'){cols=cfg.etapas;cards=ps.map(p=>({k:p.id,col:p.etapaId,p}))}
 else if(vis==='financeiro'){cols=[{id:'pendente',nome:'Pendente',cor:'#f59e0b'},{id:'parcial',nome:'Parcial',cor:'#3b82f6'},{id:'faturado',nome:'Faturado (a cobrar)',cor:'#8b5cf6'},{id:'pago',nome:'Pago',cor:'#16a34a'}];cards=ps.filter(p=>!p.cancelado).map(p=>({k:p.id,col:p.statusFin,p}))}
 else{cols=[{id:'pendente',nome:'Pendente',cor:'#a1a1aa'},{id:'na_fila',nome:'Na fila',cor:'#3b82f6'},{id:'em_andamento',nome:'Em andamento',cor:'#6366f1'},{id:'concluida',nome:'Concluída',cor:'#16a34a'}];
  cards=ps.filter(p=>p.ordens&&p.ordens[vis]).map(p=>({k:p.id+vis,col:p.ordens[vis],p}))}
 const soltar=async(colId,card)=>{setOver(null);if(!card||card.col===colId)return;
  if(vis==='geral'){const e=cfg.etapas.find(x=>x.id===colId);return moverPedido({...ctx,p:card.p,etapa:e})}

/* ---------------- matéria-prima, máquinas e central de impressão ---------------- */
const GRUPOS={dtf_textil:'DTF Têxtil',dtf_uv:'DTF UV',geral:'Geral (ambos)'};
const UN_INS=['m','m2','ml','l','g','kg','un'];
const MOTIVOS=['Erro de impressão','Falha de tinta branca','Falha de cabeça de impressão','Problema no filme','Erro no arquivo','Erro operacional','Problema de cura','Problema de aplicação','Testes','Manutenção','Outros'];
const FINALIDADES={producao:'Produção',reimpressao:'Reimpressão',teste:'Teste',interna:'Interna',perda:'Perda'};

const espera=ms=>new Promise(k=>setTimeout(k,ms));
const grupoOk=(tipo,g)=>g==='geral'||(tipo==='textil'&&g==='dtf_textil')||(tipo==='uv'&&g==='dtf_uv');
/* Consumo que o registro DEVE ter lançado: ficha técnica × metros impressos (descartes incluídos); o consumo real informado substitui o estimado. */
/* Baixa pelos pedidos: quando ligada, cada pedido com a produção concluída abate a matéria-prima pela ficha;
   os registros da Central de impressão passam a abater só os metros descartados (perdas), para não contar duas vezes. */
const BAIXA_PADRAO={ativo:true,desde:'2026-11-20T22:44:00.000Z',desdeProducao:'2026-11-21T20:40:00.000Z',textil:'',uv:''};
const EM_PROD=['em_producao','pronto','entregue'];
let BAIXA=BAIXA_PADRAO;
function consumoDesejado(reg,maquinas,insumos){if(reg.cancelado)return{};const m=maquinas.find(x=>x.id===reg.maquinaId);const pf=(m&&m.perfis||[]).find(p=>p.id===reg.perfilId);const out={};
 const porPedido=BAIXA&&BAIXA.ativo&&reg.criadoEm>=BAIXA.desde;const base=porPedido?pn(reg.descartados):pn(reg.metros);
 for(const f of (pf&&pf.ficha)||[]){const ins=insumos.find(i=>i.id===f.insumoId);if(!ins||!grupoOk(reg.tipo,ins.grupo))continue;const q=r3(pn(f.qtd)*base);if(q)out[f.insumoId]=q}
 if(!porPedido)for(const [k,v] of Object.entries(reg.consumoReal||{}))if(v!==''&&v!=null){const ins=insumos.find(i=>i.id===k);if(ins&&grupoOk(reg.tipo,ins.grupo))out[k]=r3(pn(v))}
 return out}
function perfilBaixa(tipo,maquinas,cfgB){const sel=(cfgB||{})[tipo];if(sel){const [mi,pi]=sel.split('|');const m=maquinas.find(x=>x.id===mi);const pf=m&&(m.perfis||[]).find(x=>x.id===pi);if(pf)return pf}
 const ms=maquinas.filter(x=>(x.tipo||'textil')===tipo);const m=ms.find(x=>x.id==='mq-scalle')||ms[0];return m&&(m.perfis||[])[0]||null}
function consumoPedido(p,maquinas,insumos,cfgB){const B={...BAIXA_PADRAO,...(cfgB||{})};if(!B.ativo||p.cancelado||!EM_PROD.includes(p.statusProd)||!(p.producaoEm&&p.producaoEm>=(B.desdeProducao||B.desde)))return{};const out={};
 const mp=p.maquinaId&&maquinas.find(x=>x.id===p.maquinaId);const pfp=mp&&((mp.perfis||[]).find(x=>x.id===p.perfilId)||(mp.perfis||[])[0]);
 for(const [tipo,met] of [['textil',p.totais?.mt||0],['uv',p.totais?.mu||0]]){if(!(met>0))continue;const pf=pfp&&(mp.tipo||'textil')===tipo?pfp:perfilBaixa(tipo,maquinas,B);
  for(const f of (pf&&pf.ficha)||[]){const ins=insumos.find(i=>i.id===f.insumoId);if(!ins||!grupoOk(tipo,ins.grupo))continue;out[f.insumoId]=r3((out[f.insumoId]||0)+pn(f.qtd)*met)}}
 return out}
/* O que já foi impresso não volta ao estoque (o material impresso é descartado): só abate a mais, nunca devolve. */
function alvoPedido(p,ctx){if(p.cancelado&&p.estornoConsumo)return{};const des=consumoPedido(p,ctx.maquinas,ctx.insumos,ctx.cfgB);const l=p.consumoLancado||{};const out={...l};for(const [k,v] of Object.entries(des))out[k]=Math.max(Number(l[k]||0),v);return out}
async function aplicarConsumoPedido(db,p,ctx){const des=alvoPedido(p,ctx);const lanc={...(p.consumoLancado||{})};let mudou=false;

function Descartes({impressoes,maquinas,pode}){const [per,setPer]=useState('30d');const [ini,fim]=intervalo(per);const at=impressoes.filter(r=>!r.cancelado&&r.data>=ini&&r.data<=fim);const ds=at.filter(r=>r.descartados>0);
 const tot=sum(at,r=>r.metros),td=sum(ds,r=>r.descartados);const ag=(f)=>{const o={};for(const r of ds){const k=f(r)||'—';o[k]=o[k]||{m:0,c:0,n:0};o[k].m+=r.descartados;o[k].c+=r.custoDescarte||0;o[k].n++}return Object.entries(o).sort((a,b)=>b[1].m-a[1].m)};
 const mq=Object.fromEntries(maquinas.map(m=>[m.id,m.nome]));const Bloco=({t,d})=>{const mx=Math.max(1,...d.map(x=>x[1].m));return html`<div className="card pad"><h2>${t}</h2><div style=${{display:'grid',gap:9,marginTop:10}}>${d.length===0?html`<div className="sm mut">Sem descartes.</div>`:d.map(([k,v])=>html`<div key=${k}><div className="row between sm"><span>${k}</span><span className="tab"><b>${num(v.m)} m</b>${pode('custos')?' · '+moeda(v.c):''}</span></div><div className="hbar"><i style=${{width:(v.m/mx*100)+'%'}}></i></div></div>`)}</div></div>`};
 return html`<div><div className="row between" style=${{marginBottom:14}}><div><h1>Descartes e qualidade</h1><div className="sub">${pct(tot?td/tot*100:null)} de desperdício · ${num(td)} m de ${num(tot)} m impressos</div></div>

/* Encaixe otimizado no rolo (strip packing): skyline "mais baixo primeiro", com rotação, várias ordenações; fica com a menor metragem. */
function encaixar(itens,W,espaco,borda){
 // itens: [{w,h,qtd,girar,ref}] em cm. Cada peça ganha o espaço entre artes; a largura útil ganha o mesmo espaço (a última peça não precisa dele).
 const util=W-2*borda+espaco;const base=[];
 for(const it of itens){for(let k=0;k<Math.min(it.qtd,3000);k++)base.push({w:it.w+espaco,h:it.h+espaco,ow:it.w,oh:it.h,girar:it.girar!==false,ref:it.ref})}
 const grande=base.find(p=>p.w>util+1e-9&&(!p.girar||p.h>util+1e-9));if(grande)return{erro:grande.ref,comp:0,pecas:[]};
 const ordens=[(a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h,(a,b)=>b.h-a.h||b.w-a.w,(a,b)=>b.w-a.w||b.h-a.h,(a,b)=>b.w*b.h-a.w*a.h,(a,b)=>(b.w+b.h)-(a.w+a.h)];
 let melhor=null;
 for(const ord of ordens)for(const modo of ['livre','deitado','em_pe']){
  const ps=base.map(p=>({...p}));
  // orientação preferida por modo (livre = a que encaixa melhor em cada posição)
  ps.sort(ord);const sky=[{x:0,y:0,w:util}];const out=[];
  for(const p of ps){let best=null;const oris=[];const o1={w:p.w,h:p.h,r:false},o2={w:p.h,h:p.w,r:true};
   if(modo==='livre'){oris.push(o1);if(p.girar)oris.push(o2)}else{const deit=p.w>=p.h?o1:o2,pe=p.w>=p.h?o2:o1;const pref=modo==='deitado'?deit:pe;if(p.girar||pref===o1)oris.push(pref);if(!oris.includes(o1))oris.push(o1)}
   for(const o of oris){if(o.w>util+1e-9)continue;
    for(let i=0;i<sky.length;i++){const x=sky[i].x;if(x+o.w>util+1e-9)break;let y=0,j=i,rest=o.w;while(rest>1e-9&&j<sky.length){y=Math.max(y,sky[j].y);rest-=sky[j].w;j++}
     if(rest>1e-9)continue;const topo=y+o.h;
     // desperdício sob a peça (área entre o skyline e a base da peça)
     let perda=0;rest=o.w;j=i;while(rest>1e-9&&j<sky.length){const ww=Math.min(rest,sky[j].w);perda+=ww*(y-sky[j].y);rest-=ww;j++}
     const c={x,y,o,topo,perda};if(!best||c.topo<best.topo-1e-9||(Math.abs(c.topo-best.topo)<1e-9&&(c.perda<best.perda-1e-9||(Math.abs(c.perda-best.perda)<1e-9&&c.x<best.x))))best=c}}
   if(!best)return{erro:p.ref,comp:0,pecas:[]};
   const {x,y,o}=best;out.push({x,y,w:o.w-espaco,h:o.h-espaco,rot:o.r,ref:p.ref});
   // atualiza o skyline
   const nx=x+o.w,ns=[];for(const s of sky){const sx2=s.x+s.w;if(sx2<=x+1e-9||s.x>=nx-1e-9){ns.push(s);continue}if(s.x<x)ns.push({x:s.x,y:s.y,w:x-s.x});if(sx2>nx)ns.push({x:nx,y:s.y,w:sx2-nx})}
   ns.push({x,y:y+o.h,w:o.w});ns.sort((a,b)=>a.x-b.x);const m=[];for(const s of ns){const l=m[m.length-1];if(l&&Math.abs(l.y-s.y)<1e-9&&Math.abs(l.x+l.w-s.x)<1e-9)l.w+=s.w;else m.push({...s})}sky.length=0;sky.push(...m)}
  const comp=Math.max(0,...out.map(p=>p.y+p.h));if(!melhor||comp<melhor.comp-1e-9)melhor={comp,pecas:out}}
 // uma arte só (o mais comum): testa combinar fileiras em pé e deitadas e fica com a menor
 if(itens.length===1&&base.length>0){const it=itens[0],n=base.length;const A={w:it.w+espaco,h:it.h+espaco,r:false},B={w:it.h+espaco,h:it.w+espaco,r:true};const oris=it.girar===false?[A]:[A,B];

    if(comp<melhor.comp-1e-6){const out=[];let y=0,k=0;for(let r=0;r<ra&&k<n;r++){for(let c=0;c<pa&&k<n;c++,k++)out.push({x:c*P.w,y,w:P.w-espaco,h:P.h-espaco,rot:P.r,ref:it.ref});y+=P.h}
     for(let r=0;r<rb&&k<n;r++){for(let c=0;c<pb&&k<n;c++,k++)out.push({x:c*Q.w,y,w:Q.w-espaco,h:Q.h-espaco,rot:Q.r,ref:it.ref});y+=Q.h}melhor={comp,pecas:out}}}}}
 for(const p of melhor.pecas)p.x+=borda;melhor.comp+=borda*2;return melhor}

async function unzipTextos(buf,filtro=/\.xml$/i){const v=new DataView(buf);let e=buf.byteLength-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('ZIP inválido');

  if(met===0)bytes=data;else if(met===8)bytes=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else continue;out.push({nome,texto:td.decode(bytes)})}

  return{chave:(inf.getAttribute('Id')||'').replace(/^NFe/,'')||nomeArq,nota:tag(inf,'nNF'),pedido:ped,cliente:tag(inf.getElementsByTagName('dest')[0],'xNome'),itens:dets.map(x=>({sku:tag(x,'cProd'),desc:tag(x,'xProd'),qtd:Number(tag(x,'qCom'))||1})).filter(i=>i.sku)}});

function Entregas(ctx){const {db,pedidos,clientes,cfg,me,pode,toast,produtos,abrir,user}=ctx;const [aba,setAba]=useState('fila');const [conf,setConf]=useState(null);const [busca,setBusca]=useState('');

 const etEnt=cfg.etapas.find(e=>e.id==='entregue')||cfg.etapas.find(e=>e.status==='entregue'&&!e.cancela);
 const sair=async p=>{try{await db.doc('pedidos/'+p.id).update({emRota:{por:me,em:new Date().toISOString()},historico:[...(p.historico||[]),{em:new Date().toISOString(),por:me,tipo:'entrega',obs:'Saiu para entrega'}]});toast('#'+p.numero+' saiu para entrega')}catch(e){toast('Erro: '+e.message,1)}};
 const voltar=async p=>{try{await db.doc('pedidos/'+p.id).update({emRota:null});toast('#'+p.numero+' voltou para a fila')}catch(e){toast('Erro: '+e.message,1)}};
 const entregar=async(p,quem)=>{if(!etEnt)return toast('Crie a etapa "Entregue" no Kanban',1);await moverPedido({db,p:{...p,entregaInfo:{por:me,em:new Date().toISOString(),recebedor:quem||''}},etapa:etEnt,me,pode:k=>k==='mover'?podeEnt:pode(k),produtos,toast,abrir:null});setConf(null)};
 const msgSai=p=>'Olá'+(p.clienteNome?' '+p.clienteNome.split(' ')[0]:'')+'! Seu pedido #'+p.numero+' da '+(cfg.empresa?.nome||'RIBER PRINT')+' saiu para entrega e chega em breve.';
 const rotaMaps=lst=>{const ends=lst.slice(0,9).map(p=>{const e=endEntrega(p,cliDe(p));return e.lat&&e.lng?e.lat+','+e.lng:[e.linha,e.bairro,e.cidade].filter(Boolean).join(', ')});if(!ends.length)return '';const orig=cfg.empresa?.endereco?cfg.empresa.endereco+', '+((cfg.portal?.entrega?.cidades||['Franca'])[0]):'';return 'https://www.google.com/maps/dir/?api=1'+(orig?'&origin='+encodeURIComponent(orig):'')+'&destination='+encodeURIComponent(ends[ends.length-1])+(ends.length>1?'&waypoints='+encodeURIComponent(ends.slice(0,-1).join('|')):'')+'&travelmode=driving'};
 const Card=({p,modo})=>{const cli=cliDe(p);const e=endEntrega(p,cli);const tel=p.clienteWhats||cli?.whatsapp||'';const saldo=Number(p.saldo||0);
  return html`<div className="card pad" style=${{display:'grid',gap:8}}>

    <div style=${{textAlign:'right'}}>${saldo>0.009?html`<${Badge} c="b-red">Cobrar ${moeda(saldo)}<//>`:html`<${Badge} c="b-ok">Pago<//>`}${p.frete?html`<div className="sm mut">taxa entrega ${moeda(p.frete)}</div>`:''}</div></div>

   ${modo==='rota'&&html`<div className="sm" style=${{color:'var(--warn)'}}>Saiu ${haQuanto(p.emRota.em)}${p.emRota.por?' · '+String(p.emRota.por).slice(0,12):''}</div>`}

   <div className="row" style=${{flexWrap:'wrap',gap:6}}>
    ${e.linha&&html`<a className="btn" style=${{textDecoration:'none',color:'inherit'}} href=${mapaUrl(e)} target="_blank" rel="noopener">🗺️ Mapa</a><a className="btn" style=${{textDecoration:'none',color:'inherit'}} href=${wazeUrl(e)} target="_blank" rel="noopener">Waze</a>`}
    ${tel&&html`<a className="btn" style=${{textDecoration:'none',color:'inherit'}} href=${'tel:+'+(waNum(tel)||dig(tel))}>📞 Ligar</a>`}${tel&&waNum(tel)&&html`<a className="btn" style=${{textDecoration:'none',color:'inherit'}} href=${'https://wa.me/'+waNum(tel)+'?text='+encodeURIComponent(msgSai(p))} target="_blank" rel="noopener">WhatsApp</a>`}
    ${podeEnt&&modo==='fila'&&html`<button className="btn p" onClick=${()=>sair(p)}>🛵 Saí para entregar</button>`}

 const lista={fila,rota,producao,feito:entregues}[aba];
 return html`<div>

  ${lista.length===0?html`<div className="card"><${Empty} t=${aba==='fila'?'Nada para entregar agora':aba==='rota'?'Nenhuma entrega em andamento':aba==='producao'?'Nenhum pedido de entrega em produção':'Nenhuma entrega hoje'} s=${aba==='fila'?'Quando um pedido com entrega própria ficar pronto, ele aparece aqui.':''}/></div>`:

function ContagemEstoque({db,insumos,contagens=[],cfg,pode,me,toast}){const [grp,setGrp]=useState('todos');const [cont,setCont]=useState({});const [obs,setObs]=useState('');const [s,setS]=useState(false);const [conf,setConf]=useState(false);const [ver,setVer]=useState(null);

 const mudou=linhas.filter(l=>l.dif!=null&&Math.abs(l.dif)>0.0005),contados=linhas.filter(l=>l.c!=null);
 const perda=sum(mudou.filter(l=>l.dif<0),l=>l.valor),sobra=sum(mudou.filter(l=>l.dif>0),l=>l.valor);
 const aplicar=async()=>{setConf(false);if(!contados.length)return toast('Digite pelo menos uma contagem',1);setS(true);
  try{const n=Math.max(0,...contagens.map(c=>c.numero||0))+1;const id='ct'+uid();

function montagemSolic(x,cfg){const arqs=x.arquivos||[];if(!arqs.length)return null;
 if(x.montagem&&Array.isArray(x.montagem.pecas)&&x.montagem.pecas.length)return{W:Number(x.montagem.W)||Number(x.larguraRolo)||57.899,comp:Number(x.montagem.comp),igual:true,
  pecas:x.montagem.pecas.filter(q=>arqs[q[0]]).map(q=>({x:q[1],y:q[2],w:q[3],h:q[4],rot:!!q[5],ref:{arquivo:arqs[q[0]].path}}))};
 const W=Number(x.larguraRolo)||57.899,esp=Number(x.espaco??0.5),bor=Number((cfg.portal||{}).borda||0);
 const r=encaixar(arqs.map(a=>({w:Number(a.larguraCm),h:Number(a.alturaCm),qtd:Number(a.qtd)||1,girar:a.girar!==false,ref:{arquivo:a.path}})),W,esp,bor);if(r.erro)return null;
 return{W,comp:r.comp,pecas:r.pecas,igual:false}}
async function baixarMontagemSolic({x,cfg,maxCm=500,prog}){const M=montagemSolic(x,cfg);if(!M||!M.pecas.length)throw new Error('Este pedido não tem artes para montar');
 if(!window.RP_SB)throw new Error('Disponível no sistema online');if(typeof CompressionStream==='undefined')throw new Error('Este navegador não consegue gerar o PNG. Use o Chrome atualizado.');
 const dpi=300,px=cm=>Math.round(cm/2.54*dpi),Wpx=px(M.W),esp=Number(x.espaco??0.5);const segs=segmentosPecas(M.pecas,M.comp,Math.min(maxCm,500),esp);const n=segs.length;const bms={};

 try{for(let i=0;i<n;i++){const {y0,y1,pecas:ps}=segs[i];
   const blob=await pngEmFaixas({pecas:ps,y0,y1,Wpx,px,bm,dpi,prog:pc=>prog&&prog((n>1?'Parte '+(i+1)+' de '+n+': ':'Gerando PNG: ')+pc+'%')});

function MontagemOnline({x,cfg,urls,toast}){const M=useMemo(()=>montagemSolic(x,cfg),[x.id,x.montagem]);const ref=useRef(null);const [prog,setProg]=useState('');const [maxCm,setMaxCm]=useState('500');
 useEffect(()=>{const cv=ref.current;if(!cv||!M)return;let vivo=true;(async()=>{const cw=cv.clientWidth||600;const k=cw/M.W;const ch=Math.min(Math.max(M.comp*k,120),520);const kk=Math.min(k,ch/M.comp);const dpr=window.devicePixelRatio||1;cv.width=cw*dpr;cv.height=ch*dpr;cv.style.height=ch+'px';
  const g=cv.getContext('2d');if(!g)return;g.scale(dpr,dpr);const ox=(cw-M.W*kk)/2;g.fillStyle='rgba(127,127,127,.12)';g.fillRect(ox,0,M.W*kk,ch);const ims={};

const MSG_FECH='*FECHAMENTO {periodicidade} — {empresa}*\n\nOlá, {cliente}!\n\nSegue o demonstrativo referente ao período de {inicio} até {fim}.\n\n*Pedidos realizados:*\n\n{linhas}\n\n*Total: {metros} metros.*\n\n*Valor total: {valor}.*\n{saldo_linha}\nVencimento: {vencimento}.\n\nChave PIX: {pix}.\n\nAgradecemos pela parceria!\n\n*{empresa} — Impressão e Personalização.*';
const PERIODIC={diario:'DIÁRIO',semanal:'SEMANAL',quinzenal:'QUINZENAL',mensal:'MENSAL',personalizado:'',antecipado:'',na_retirada:''};
function fechAtivos(fechamentos){const s=new Set();for(const f of fechamentos)if(f.status!=='cancelado')for(const p of f.pedidos||[])s.add(p.id);return s}
function textoFechamento(f,cfg,pedidosM){const linhas=(f.pedidos||[]).map(x=>{const p=pedidosM[x.id];return ddmm(x.data)+' — Pedido #'+x.numero+' — '+num(x.metros)+' m — '+moeda(p?p.total:x.valor)}).join('\n\n')+((f.agrupou||[]).length?'\n\n_Este fechamento junta tudo que está em aberto e substitui o(s) fechamento(s) '+f.agrupou.map(x=>'#'+x.numero).join(', ')+'._':'');
 const saldo=sum(f.pedidos||[],x=>{const p=pedidosM[x.id];return p?p.saldo:x.valor});
 return preencher(cfg.msgFechamento||MSG_FECH,{periodicidade:PERIODIC[f.periodicidade]||'',empresa:cfg.empresa.nome,cliente:(f.clienteNome||'').split(' ')[0],inicio:dBR(f.inicio),fim:dBR(f.fim),linhas,metros:num(f.metros),valor:moeda(f.total),
  saldo_linha:saldo<f.total-0.009?'*Saldo em aberto: '+moeda(saldo)+'.*\n':'',vencimento:dBR(f.vencimento),pix:cfg.empresa.pix,pix_copia:pixCopiaCola(cfg.empresa,saldo,'FECH'+f.numero)})+((cfg.msgFechamento||MSG_FECH).includes('{pix_copia}')||!cfg.empresa.pix||saldo<=0?'':'\n\nPIX copia e cola ('+moeda(saldo)+'):\n'+pixCopiaCola(cfg.empresa,saldo,'FECH'+f.numero))}

/* ---- fechamentos automáticos: períodos já encerrados com pedidos em aberto ---- */
const PERIODICOS=['diario','semanal','quinzenal','mensal'];
function periodoDe(dia,cond){if(cond==='diario')return[dia,dia];
 if(cond==='semanal'){const d=new Date(dia+'T12:00:00Z');const w=(d.getUTCDay()+6)%7;const ini=addD(dia,-w);return[ini,addD(ini,6)]}
 const y=+dia.slice(0,4),m=+dia.slice(5,7),dd=+dia.slice(8,10);const ult=new Date(Date.UTC(y,m,0)).getUTCDate();const mm=dia.slice(0,8);
 if(cond==='quinzenal')return dd<=15?[mm+'01',mm+'15']:[mm+'16',mm+String(ult).padStart(2,'0')];
 return[mm+'01',mm+String(ult).padStart(2,'0')]}
function fechPendentes(clientes,pedidos,fechamentos,desde){const ativos=fechAtivos(fechamentos);const hoje=diaSP();const out={};
 const cm=Object.fromEntries(clientes.filter(c=>PERIODICOS.includes(c.condicao)&&c.ativo!==false).map(c=>[c.id,c]));
 for(const p of pedidos){const c=cm[p.clienteId];if(!c||p.cancelado||!(p.saldo>0.009)||ativos.has(p.id))continue;const [ini,fim]=periodoDe(p.dia,c.condicao);if(fim>=hoje||(desde&&fim<desde))continue;
  const k=c.id+'|'+ini;const o=out[k]||(out[k]={cliente:c,inicio:ini,fim,pedidos:[]});o.pedidos.push(p)}
 return Object.values(out).sort((a,b)=>a.fim.localeCompare(b.fim)||a.cliente.nome.localeCompare(b.cliente.nome))}
async function proximoFech(db,fechamentos){const ref=db.doc('contadores/fechamentos');const maxLocal=Math.max(0,...fechamentos.map(f=>f.numero||0));
 for(let t=0;t<6;t++){const r=await ref.acquire({holder:TAB,ttlMs:5000});if(r.acquired){const x=await ref.get();const n=Math.max(maxLocal,(x.exists&&x.data().ultimo)||0)+1;await ref.set({ultimo:n});return n}await espera(300+Math.random()*400)}
 return maxLocal+1}
async function gerarFechamento(db,{cliente,inicio,fim,pedidos:ps},fechamentos,cfg,me,auto){const n=await proximoFech(db,fechamentos);const prazo=Number(cfg.fechPrazo??3);
 const id='fa-'+cliente.id+'-'+inicio;const ex=await db.doc('fechamentos/'+id).get();if(ex.exists&&ex.data().status!=='cancelado')return null;
 const metros=sum(ps,p=>(p.totais?.mt||0)+(p.totais?.mu||0)),total=sum(ps,p=>p.saldo);
 await db.doc('fechamentos/'+id).set({numero:n,clienteId:cliente.id,clienteNome:cliente.nome,periodicidade:cliente.condicao,inicio,fim,vencimento:addD(fim,prazo),criadoEm:new Date().toISOString(),por:me,status:'aberto',auto:!!auto,
  pedidos:ps.sort((a,b)=>a.dia.localeCompare(b.dia)).map(p=>({id:p.id,numero:p.numero,data:p.dia,metros:r3((p.totais?.mt||0)+(p.totais?.mu||0)),valor:r2(p.saldo)})),metros:r3(metros),total:r2(total)});return n}
const MSG_COBRANCA='Olá, {cliente}! Tudo bem?\n\nConsta em aberto na {empresa} o valor de *{saldo}* referente a {pedidos} pedido(s) (o mais antigo de {desde}).\n\nChave PIX: {pix}\n\nPIX copia e cola (valor já preenchido):\n{pix_copia}\n\nSe já pagou, por favor desconsidere e nos envie o comprovante. Obrigado!';
function Cobranca({db,pedidos,clientes,cfg,pode,toast}){const [pix,setPix]=useState(null);const [min,setMin]=useState(0);const hoje=diaSP();
 const lista=useMemo(()=>{const m={};for(const p of pedidos){if(p.cancelado||!(p.saldo>0.009))continue;const o=m[p.clienteId]||(m[p.clienteId]={id:p.clienteId,nome:p.clienteNome,q:0,s:0,desde:p.dia});o.q++;o.s+=p.saldo;if(p.dia<o.desde)o.desde=p.dia}
  return Object.values(m).map(o=>({...o,cli:clientes.find(c=>c.id===o.id),dias:diasEntre(o.desde,hoje)-1})).filter(o=>o.dias>=min).sort((a,b)=>b.dias-a.dias||b.s-a.s)},[pedidos,clientes,min]);
 const msg=o=>preencher(cfg.msgCobranca||MSG_COBRANCA,{cliente:(o.nome||'').split(' ')[0],empresa:cfg.empresa.nome,saldo:moeda(o.s),pedidos:o.q,desde:dBR(o.desde),pix:cfg.empresa.pix||'',pix_copia:pixCopiaCola(cfg.empresa,o.s,'COB'+String(o.id).slice(-8))});
 const marcar=async o=>{try{await db.doc('clientes/'+o.id).update({ultimaCobranca:new Date().toISOString()})}catch(e){}};

  ${pix&&html`<${PixDlg} cfg=${cfg} valor=${pix.s} txid=${'COB'+String(pix.id).slice(-8)} titulo=${'PIX — '+pix.nome} onClose=${()=>setPix(null)}/>`}</div>`}

function Fechamentos(ctx){const {db,fechamentos,pedidos,clientes,cfg,pode,me,toast}=ctx;const [st,setSt]=useState('aberto');const [aba,setAba]=useState('fazer');const [preset,setPreset]=useState(null);const [gerando,setGerando]=useState(false);
 const desdeP=addD(diaSP(),-Number(cfg.fechAuto?.dias||45));const pend=useMemo(()=>fechPendentes(clientes,pedidos,fechamentos,desdeP),[clientes,pedidos,fechamentos,desdeP]);

 const demonstrativo=async f=>{const dl=await claude.use('downloads');if(!dl)return toast('Download indisponível',1);const E=cfg.empresa;const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const cli=clientes.find(c=>c.id===f.clienteId);

 const lim=addD(diaSP(),-29);const cli=clientes.filter(x=>Number(x.precoMetro)>0).map(x=>{const ps=pedidos.filter(p=>p.clienteId===x.id&&!p.cancelado&&p.dia>=lim);const m=sum(ps,p=>p.totais?.mt||0);const mg=(x.precoMetro-cm)/x.precoMetro*100;return{...x,m,mg,lucro:m*(x.precoMetro-cm)}}).sort((a,b)=>a.mg-b.mg);

    <div className="row between"><b>Total por metro: ${moeda(cm)}</b>${admin&&html`<button className="btn p" onClick=${()=>salvar({custos:{porMetro:pn(c.porMetro),outros:pn(c.outros),embalagem:pn(c.embalagem)}},'Custos salvos')}>Salvar custos</button>`}</div>
    <div className="sm mut">Produtos com preço de custo próprio usam o valor do produto. Os demais itens de DTF usam este custo por metro.</div></div>
   <div className="card pad"><h2>Custo real de matéria-prima pela ficha</h2><div className="sm mut" style=${{margin:'4px 0 10px'}}>Calculado com o custo médio das entradas de estoque e o consumo por metro de cada perfil.</div>
    ${fichas.length===0?html`<div className="sm mut">Cadastre máquinas e fichas em Produção → Máquinas.</div>`:fichas.map((f,i)=>html`<div key=${i} className="row between" style=${{padding:'8px 0',borderBottom:'1px solid var(--line)'}}><span className="sm">${f.n}</span><span className="row"><b className="tab">${moeda(f.v)}/m</b>${f.falta?html`<${Badge} c="b-warn">falta custo de insumo<//>`:admin&&html`<button className="btn sm" onClick=${()=>setC({...c,porMetro:String(r4(f.v))})}>Usar</button>`}</span></div>`)}</div></div>`}

    ${admin&&html`<button className="btn p" onClick=${()=>salvar({custos:{porMetro:r2(r.mat),outros:r2(r.fixoM),embalagem:pn(c.embalagem)},simulador:s},'Custo por metro atualizado: '+moeda(r.custo))}>Aplicar este custo nos pedidos</button>`}</div></div></div>`}
  ${aba==='clientes'&&html`<div className="card"><div className="pad sm mut">Preço por metro de cada cliente comparado ao custo por metro atual (${moeda(cm)}). Metros e lucro dos últimos 30 dias.</div>

   ${cli.map(x=>html`<tr key=${x.id}><td>${x.nome}</td><td className="r tab">${moeda(x.precoMetro)}</td><td className="r tab b" style=${{color:x.mg<25?'var(--red2)':x.mg<40?'var(--warn)':'var(--ok)'}}>${pct(x.mg)}</td><td className="r tab">${num(x.m)}</td><td className="r tab">${moeda(x.lucro)}</td></tr>`)}</tbody></table></div>`}</div>`}
