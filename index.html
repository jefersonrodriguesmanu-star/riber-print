<style>
/* VOICE: sistema de trabalho sério e rápido, como a mesa de produção de uma gráfica.
   IDEA: a ordem de serviço / ficha de produção DTF — cada pedido é um ticket com rolo, metros e status.
   PICTURE: o próprio trabalho (Kanban, pedido, dashboard) ocupa a tela.
   COLOUR and TYPE: preto, branco e grafite com vermelho RIBER como destaque; Geist.
   LAYOUT: menu lateral recolhível + área de trabalho; empilha abaixo de 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f4f5,#0b0b0d);--card:light-dark(#ffffff,#131316);--ink:light-dark(#0a0a0b,#f4f4f5);--mut:light-dark(#71717a,#a1a1aa);
--line:light-dark(#e4e4e7,#26262b);--soft:light-dark(#f4f4f5,#1b1b1f);--side:#000;--acc:light-dark(#a3089a,#d23fc2);--acc2:light-dark(#86067f,#e35fd5);--grad:linear-gradient(90deg,#0470dc,#6106c4 25%,#ad03a1 48%,#ce0d13 70%,#e6600d 86%,#f8a50a);--red:#e11d2e;--red2:light-dark(#c4111f,#ff3b4c);
--ok:light-dark(#15803d,#4ade80);--warn:light-dark(#b45309,#fbbf24);--info:light-dark(#1d4ed8,#60a5fa);--vio:light-dark(#6d28d9,#a78bfa)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.tab{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);color:#e4e4e7;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s}
.side.min{width:64px}.side .brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid #1f1f23}
.logo{width:34px;height:34px;border-radius:9px;background:#000 center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.5px;color:#fff;flex:none}
.side nav{padding:10px 8px;overflow-y:auto;flex:1}.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#71717a;padding:12px 10px 4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#a1a1aa;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left;min-height:38px}
.nv:hover{background:#18181b;color:#fff}.nv.on{background:#1c1c20;color:#fff}.nv.on svg{color:#e35fd5}.nv.on{box-shadow:inset 3px 0 0 #d23fc2}.nv svg{width:18px;height:18px;flex:none}
.side.min .lbl,.side.min .grp{display:none}.side.min .nv{justify-content:center}
.main{flex:1;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 20px;background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{padding:22px clamp(14px,2.5vw,32px);max-width:1440px;width:100%;margin:0 auto}
h1{font-size:24px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}h2{font-size:16px;margin:0}
.sub{color:var(--mut);font-size:13.5px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 14px;min-height:38px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:var(--acc2)}
.btn.d{color:var(--red2)}.btn.sm{min-height:32px;padding:0 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn svg{width:16px;height:16px}
.in{width:100%;min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in oklab,var(--acc) 20%,transparent)}textarea.in{min-height:70px;resize:vertical}
.lb{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin-bottom:5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.b-ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}.b-warn{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn)}
.b-red{background:color-mix(in oklab,var(--red) 14%,transparent);color:var(--red2)}.b-info{background:color-mix(in oklab,var(--info) 14%,transparent);color:var(--info)}.b-vio{background:color-mix(in oklab,var(--vio) 15%,transparent);color:var(--vio)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr.hov:hover td{background:var(--soft);cursor:pointer}.r{text-align:right}.nw{white-space:nowrap}
.scroll{overflow-x:auto}.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:600}
.kpi{padding:14px 16px}.kpi .v{font-size:clamp(20px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;margin-top:4px}.kpi .t{font-size:12.5px;color:var(--mut);font-weight:500}
.delta{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:6px}
.hero{background:#000;color:#fff;border-color:#1f1f23;position:relative;overflow:hidden}.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}.brandlogo{display:block;width:100%;max-width:190px;height:auto}.side.min .brandlogo{display:none}.side:not(.min) .logo{display:none}.hero .t,.hero .mut{color:#a1a1aa}
.bars{display:flex;align-items:flex-end;gap:3px;height:220px;padding-top:8px}.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bars span{display:block;background:var(--acc);border-radius:4px 4px 1px 1px;min-height:2px}.bars>div:hover span{filter:brightness(1.15)}
.hbar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.hbar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;min-height:calc(100vh - 210px);align-items:flex-start}
.col{width:282px;flex:none;background:var(--soft);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.over{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 6%,var(--soft))}.col .h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13.5px;font-weight:600}
.col .bd{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.tk{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;cursor:grab;position:relative}
.tk:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}.tk.urg{border-left:3px solid var(--red)}.tk.alta{border-left:3px solid var(--warn)}
.dot{width:9px;height:9px;border-radius:9px;flex:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal>.card{width:100%;max-width:760px;animation:up .2s ease-out}.modal>.card.lg{max-width:1100px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--side);color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.25)}.toast .e{background:#7f1d1d}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.itm{border:1px solid var(--line);border-radius:11px;padding:10px;display:grid;gap:8px;grid-template-columns:minmax(0,4fr) minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,1.2fr) auto;align-items:center}
.itm.err{border-color:var(--red2)}
.res{position:absolute;top:44px;left:0;right:0;z-index:30;max-height:360px;overflow-y:auto;padding:6px}
.res button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}.res button:hover{background:var(--soft)}
.empty{padding:48px 16px;text-align:center;color:var(--mut)}
.hide-s{}.burger{display:none}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.side{position:fixed;z-index:50;left:0;transform:translateX(-100%);transition:transform .2s;width:250px}.side.open{transform:none}.side.min{width:250px}
.side.min .lbl,.side.min .grp{display:revert}.burger{display:inline-flex}.g3,.g2{grid-template-columns:minmax(0,1fr)}
.itm{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.itm>:first-child{grid-column:1/-1}.hide-s{display:none}}
@media(max-width:600px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:13px}td,th{padding:9px 8px}}
@media print{.side,.top,.noprint{display:none!important}}
</style>
</head>

const err=(e)=>{if(!e)return e;const m=e.message||String(e);const c=e.code==='42501'||/row-level security|permission/i.test(m)?'permission_denied':e.code==='P0002'||/not_found/.test(m)?'not_found':/fetch|network|Failed to|timeout|503|502|504/i.test(m)?'unavailable':/429|rate/i.test(m)?'resource_exhausted':'internal';const x=new Error(c==='permission_denied'?'Sem permissão para esta ação':m);x.code=c;return x};
const colOf=p=>p.split('/').slice(0,-1).join('/');const idOf=p=>p.split('/').pop();
const snap=(path,data)=>({id:idOf(path),exists:data!=null,data:()=>data==null?undefined:data,metadata:{fromCache:false}});
const clone=v=>v===undefined?null:JSON.parse(JSON.stringify(v));

/* ---- login ---- */
let sessao=null;const prontos=[];
function telaLogin(){
 if(document.getElementById('rp-login'))return;
 const d=document.createElement('div');d.id='rp-login';
 d.innerHTML=`<style>#rp-login{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#0b0b0d;font:16px/1.5 Inter,system-ui,sans-serif;color:#fafafa;padding:16px}
 #rp-login form{width:min(380px,100%);background:#141417;border:1px solid #27272a;border-radius:16px;padding:28px;display:grid;gap:12px}
 #rp-login .lg{width:44px;height:44px;border-radius:12px;background:#e11d2e;display:grid;place-items:center;font-weight:800}
 #rp-login input{min-height:44px;border-radius:10px;border:1px solid #3f3f46;background:#0b0b0d;color:#fafafa;padding:0 12px;font-size:16px}
 #rp-login button{min-height:44px;border-radius:10px;border:0;font-weight:700;font-size:15px;cursor:pointer}
 #rp-login .p{background:#e11d2e;color:#fff}#rp-login .s{background:transparent;color:#a1a1aa}#rp-login .m{font-size:13px;color:#a1a1aa;min-height:20px}</style>
 <form><div style="display:flex;gap:12px;align-items:center"><div class="lg">RP</div><div><b>RIBER PRINT ERP</b><div class="m" style="min-height:0">Entre com seu e-mail</div></div></div>
 <input name="email" type="email" autocomplete="email" placeholder="E-mail" required>
 <input name="senha" type="password" autocomplete="current-password" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required>
 <button class="p" type="submit">Entrar</button><button class="s" type="button" data-a="criar">Primeiro acesso? Criar conta</button><button class="s" type="button" data-a="esqueci">Esqueci a senha</button><div class="m"></div></form>`;
 document.body.appendChild(d);const f=d.querySelector('form'),msg=d.querySelector('.m:last-child');let criar=false;
 const modo=()=>{f.querySelector('.p').textContent=criar?'Criar conta':'Entrar';f.querySelector('[data-a=criar]').textContent=criar?'Já tenho conta: entrar':'Primeiro acesso? Criar conta';f.senha.autocomplete=criar?'new-password':'current-password'};
 f.querySelector('[data-a=criar]').onclick=()=>{criar=!criar;modo();msg.textContent=''};
 f.querySelector('[data-a=esqueci]').onclick=async()=>{if(!f.email.value)return msg.textContent='Digite seu e-mail acima.';const {error}=await sb.auth.resetPasswordForEmail(f.email.value,{redirectTo:location.origin+location.pathname});msg.textContent=error?'Não foi possível enviar: '+error.message:'Enviamos um link para redefinir a senha.'};
 f.onsubmit=async e=>{e.preventDefault();msg.textContent=criar?'Criando conta…':'Entrando…';
  const r=criar?await sb.auth.signUp({email:f.email.value.trim(),password:f.senha.value}):await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.senha.value});
  if(r.error){msg.textContent=/Invalid login/i.test(r.error.message)?'E-mail ou senha incorretos.':/already registered/i.test(r.error.message)?'Este e-mail já tem conta. Use Entrar.':r.error.message;return}
  if(criar&&!r.data.session){msg.textContent='Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.';return}}}
async function entrou(s){if(!s)return;sessao=s;document.getElementById('rp-login')?.remove();
 try{await sb.rpc('rp_claim_owner')}catch(e){}
 try{const u=s.user;await sb.from('rp_docs').upsert({path:'equipe/'+u.id,col:'equipe',data:{desde:u.created_at,email:u.email,nome:(u.user_metadata&&u.user_metadata.nome)||u.email.split('@')[0]}},{onConflict:'path',ignoreDuplicates:true})}catch(e){}
 while(prontos.length)prontos.shift()()}
function novaSenha(){const d=document.createElement('div');d.id='rp-nova';d.style.cssText='position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:rgba(0,0,0,.85);font:16px Inter,system-ui,sans-serif;padding:16px';
 d.innerHTML='<form style="width:min(360px,100%);background:#141417;color:#fafafa;border:1px solid #27272a;border-radius:16px;padding:24px;display:grid;gap:12px"><b>Defina sua nova senha</b><input type="password" minlength="6" required autocomplete="new-password" placeholder="Nova senha" style="min-height:44px;border-radius:10px;border:1px solid #3f3f46;background:#0b0b0d;color:#fafafa;padding:0 12px;font-size:16px"><button style="min-height:44px;border:0;border-radius:10px;background:#a3089a;color:#fff;font-weight:700">Salvar senha</button><div style="font-size:13px;color:#a1a1aa"></div></form>';
 document.body.appendChild(d);const f=d.querySelector('form');f.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:f.querySelector('input').value});if(error)f.querySelector('div').textContent=error.message;else d.remove()}}
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setTimeout(novaSenha,0);if(s&&!sessao)entrou(s);if(ev==='SIGNED_OUT'){sessao=null;location.reload()}});
const iniciar=async()=>{const {data}=await sb.auth.getSession();if(data.session)entrou(data.session);else telaLogin()};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
const logado=()=>sessao?Promise.resolve():new Promise(r=>prontos.push(r));
window.RP_SAIR=()=>sb.auth.signOut();

/* ---- canais em tempo real: um por coleção / documento ---- */
const canais={};
function canal(chave,filtro,fn){
 let c=canais[chave];
 if(!c){c=canais[chave]={ouv:new Set(),rec:new Set(),ch:null};
  const abrir=()=>{c.ch=sb.channel('rp:'+chave+':'+Math.random().toString(36).slice(2,7)).on('postgres_changes',{event:'*',schema:'public',table:'rp_docs',filter:filtro},pl=>{for(const f of c.ouv)f(pl)})
   .subscribe(st=>{if(st==='SUBSCRIBED')for(const f of c.rec)f();if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){setTimeout(()=>{try{sb.removeChannel(c.ch)}catch(e){}if(c.ouv.size)abrir()},3000)}})};
  abrir();c.reabrir=abrir}
 c.ouv.add(fn.ev);c.rec.add(fn.rec);if(c.ch&&c.ch.state==='joined')setTimeout(fn.rec,0);
 return()=>{c.ouv.delete(fn.ev);c.rec.delete(fn.rec);if(!c.ouv.size){try{sb.removeChannel(c.ch)}catch(e){}delete canais[chave]}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)for(const c of Object.values(canais))for(const f of c.rec)f()});

/* ---- documentos ---- */
function docRef(path){return{id:idOf(path),path,
 async get(){await logado();const {data,error}=await sb.from('rp_docs').select('data').eq('path',path).maybeSingle();if(error)throw err(error);return snap(path,data?data.data:null)},
 async set(d){await logado();const {error}=await sb.from('rp_docs').upsert({path,col:colOf(path),data:clone(d)},{onConflict:'path'});if(error)throw err(error)},
 async update(d){await logado();const {error}=await sb.rpc('rp_update',{p_path:path,p_patch:clone(d)});if(error)throw err(error)},
 async delete(){await logado();const {error}=await sb.from('rp_docs').delete().eq('path',path);if(error)throw err(error)},
 async acquire(o){await logado();const {data,error}=await sb.rpc('rp_acquire',{p_path:path,p_holder:String(o&&o.holder||'x'),p_ttl:Number(o&&o.ttlMs||5000)});if(error)throw err(error);return{acquired:!!data}},
 onSnapshot(next,onErr){let vivo=true,un=null;
  const carregar=async()=>{try{const s=await this.get();if(vivo)next(s)}catch(e){onErr&&onErr(err(e))}};
  logado().then(()=>{if(!vivo)return;un=canal('d:'+path,'path=eq.'+path,{ev:pl=>{if(!vivo)return;next(snap(path,pl.eventType==='DELETE'?null:pl.new.data))},rec:carregar});carregar()});
  return()=>{vivo=false;un&&un()}}}}

/* ---- consultas ---- */
function consulta(col,ord,lim,wh){
 const q={path:col,
  orderBy:(f,d)=>consulta(col,[f,d||'asc'],lim,wh),limit:n=>consulta(col,ord,n,wh),where:(f,o,v)=>consulta(col,ord,lim,[...(wh||[]),[f,o,v]]),doc:id=>docRef(col+'/'+(id||Math.random().toString(36).slice(2,12))),
  async get(){await logado();const rows=await buscar();return{docs:rows.map(r=>snap(r.path,r.data)),size:rows.length,empty:!rows.length}},
  onSnapshot(next,onErr){let vivo=true,un=null;const m=new Map();
   const casa=d=>{for(const [f,o,v] of wh||[]){const x=d&&d[f];if(o==='<'&&!(x<v))return false;if(o==='<='&&!(x<=v))return false;if(o==='>'&&!(x>v))return false;if(o==='>='&&!(x>=v))return false;if(o==='=='&&x!==v)return false}return true};
   const emitir=()=>{let a=[...m.entries()].map(([p,d])=>({p,d}));if(ord){const [f,dir]=ord;a.sort((x,y)=>{const u=x.d[f]??'',w=y.d[f]??'';return(u<w?-1:u>w?1:0)*(dir==='desc'?-1:1)})}if(lim)a=a.slice(0,lim);
    const docs=a.map(x=>snap(x.p,x.d));next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},docChanges:()=>[]})};
   let seq=0;const carregar=async()=>{const s=++seq;try{const rows=await buscar();if(!vivo||s!==seq)return;m.clear();for(const r of rows)m.set(r.path,r.data);emitir()}catch(e){onErr&&onErr(err(e))}};
   let t=null;const agenda=()=>{clearTimeout(t);t=setTimeout(emitir,60)};
   logado().then(()=>{if(!vivo)return;un=canal('c:'+col,'col=eq.'+col,{ev:pl=>{if(!vivo)return;
     if(pl.eventType==='DELETE'){const p=pl.old&&pl.old.path;if(p&&m.delete(p)){if(lim&&m.size<lim)carregar();else agenda()}return}
     const r=pl.new;if(casa(r.data))m.set(r.path,r.data);else m.delete(r.path);agenda()},rec:carregar});carregar()});
   return()=>{vivo=false;clearTimeout(t);un&&un()}}};
 async function buscar(){const out=[];const max=lim||1e9;let de=0;
  while(out.length<max){const n=Math.min(1000,max-out.length);let r=sb.from('rp_docs').select('path,data').eq('col',col);
   for(const [f,o,v] of wh||[]){const k='data->>'+f;r=o==='<'?r.lt(k,v):o==='<='?r.lte(k,v):o==='>'?r.gt(k,v):o==='>='?r.gte(k,v):r.eq(k,v)}
   r=ord?r.order('data->>'+ord[0],{ascending:ord[1]!=='desc',nullsFirst:false}).order('path'):r.order('path');
   const {data,error}=await r.range(de,de+n-1);if(error)throw err(error);out.push(...data);if(data.length<n)break;de+=n}
  return out}
 return q}

const db={doc:docRef,collection:p=>consulta(p)};
const user={
 async isOwner(){await logado();const {data}=await sb.rpc('rp_is_owner');return!!data},

 async profiles(ids){await logado();if(!ids||!ids.length)return{};const {data}=await sb.from('rp_docs').select('path,data').in('path',ids.map(i=>'equipe/'+i));
  const o={};for(const r of data||[])o[idOf(r.path)]={name:r.data.nome||r.data.email||''};return o}};
const downloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data],{type:/\.html?$/.test(filename)?'text/html':/\.csv$/.test(filename)?'text/csv':/\.json$/.test(filename)?'application/json':'application/octet-stream'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}};
window.claude={use:async n=>{if(n==='db'){await logado();return db}if(n==='user'){await logado();return user}if(n==='downloads')return downloads;return null}};
})();

/* Recalcula tudo que deriva do pedido (o equivalente aos gatilhos do banco). */
function normalizar(p,quem){

 const fin=p.cancelado?'cancelado':(t.total>0&&pago>=t.total)||(p.cortesia&&t.total===0)?'pago':pago>0?'parcial':p.autorizado?'faturado':'pendente';
 const hist=[...(p.historico||[])];

 const liberado=!p.cancelado&&(fin==='pago'||p.autorizado);

  for(const s of setores)if(!ordens[s])ordens[s]='pendente';
  for(const s of Object.keys(ordens))if(!setores.includes(s)&&ordens[s]==='pendente')delete ordens[s];

/* ---------------- dados: assinatura das coleções ---------------- */
function useCol(db,path,ordem){
 const [st,setSt]=useState({rows:[],ok:false,err:null});
 useEffect(()=>{if(!db)return;let q=db.collection(path);if(ordem)q=q.orderBy(ordem[0],ordem[1]).limit(1000);
  const t=setTimeout(()=>setSt(s=>s.ok?s:{...s,err:'lento'}),10000);
  const un=q.onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(t);setSt({rows:s.docs.map(d=>({...d.data(),id:d.id})),ok:true,err:null})},e=>{clearTimeout(t);setSt(s=>({...s,ok:true,err:e.code}))});
  return()=>{clearTimeout(t);un()}},[db,path]);
 return st}
/* coleções grandes: páginas de 1000 encadeadas pelo campo de ordem */
function useColTudo(db,path,campo){
 const [pg,setPg]=useState([]);const [cur,setCur]=useState([null]);const [ok,setOk]=useState(false);const [err,setErr]=useState(null);const okR=useRef(false);
 useEffect(()=>{if(!db)return;setPg(a=>a.length>cur.length?a.slice(0,cur.length):a);const uns=cur.map((c,k)=>{let q=db.collection(path);if(c)q=q.where(campo,'<',c);q=q.orderBy(campo,'desc').limit(1000);
   return q.onSnapshot(s=>{const rows=s.docs.map(d=>({...d.data(),id:d.id}));setPg(a=>{const b=[...a];b[k]=rows;return b});
    if(k===0)setOk(true);if(rows.length===1000){const u=rows[rows.length-1][campo];if(u&&u!==c)setCur(x=>x[k+1]===u?x:[...x.slice(0,k+1),u])}},e=>{setOk(true);setErr(e.code)})});
  const t=setTimeout(()=>{if(!okR.current)setErr(x=>x||'lento')},10000);return()=>{clearTimeout(t);uns.forEach(u=>u())}},[db,path,cur.join('|')]);
 okR.current=ok;
 const rows=useMemo(()=>{const m=new Map();for(const a of pg)for(const r of a||[])m.set(r.id,r);return[...m.values()].sort((a,b)=>(b[campo]||'').localeCompare(a[campo]||''))},[pg]);
 return{rows,ok,err}}
function useDoc(db,path){
 const [st,setSt]=useState({data:null,ok:false});
 useEffect(()=>{if(!db)return;const un=db.doc(path).onSnapshot(s=>setSt({data:s.exists?s.data():null,ok:true}),()=>setSt(x=>({...x,ok:true})));return un},[db,path]);
 return st}

/* ---------------- busca global ---------------- */
function Busca({clientes,pedidos,produtos,abrir,setForm}){

 const res=useMemo(()=>{const t=norm(q.trim());if(t.length<2)return[];const d=dig(q);const o=[];
  for(const p of pedidos){if(String(p.numero)===d||norm(p.clienteNome).includes(t))o.push(['Pedido #'+p.numero,p.clienteNome+' · '+moeda(p.total),()=>abrir('pedido',p.id)]);if(o.length>6)break}
  for(const c of clientes)if(norm(c.nome).includes(t)||(d.length>=4&&(dig(c.whatsapp).includes(d)||dig(c.doc).includes(d))))o.push([c.nome,fone(c.whatsapp),()=>abrir('cliente',c.id)]);
  for(const p of produtos)if(norm(p.nome).includes(t)||norm(p.sku).includes(t))o.push([p.nome,'Produto · '+moeda(p.preco),()=>setForm({t:'produto',produto:p})]);
  return o.slice(0,14)},[q,clientes,pedidos,produtos]);
 return html`<div style=${{position:'relative',flex:1,maxWidth:520}}>
  <input id="busca" className="in" placeholder="Buscar pedido, cliente ou produto (Ctrl+K)" value=${q} onChange=${e=>setQ(e.target.value)} onFocus=${()=>setF(true)} onBlur=${()=>setTimeout(()=>setF(false),180)}/>
  ${f&&res.length>0&&html`<div className="card res">${res.map((r,i)=>html`<button key=${i} onMouseDown=${()=>{r[2]();setQ('')}}><span className="b">${r[0]}</span><span className="mut sm">${r[1]}</span></button>`)}</div>`}</div>`}

async function proximoNumero(db,pedidos){
 const ref=db.doc('contadores/pedidos');const maxLocal=Math.max(1000,...pedidos.map(p=>p.numero||0));
 for(let t=0;t<6;t++){const r=await ref.acquire({holder:TAB,ttlMs:5000});
  if(r.acquired){const s=await ref.get();const n=Math.max(maxLocal,(s.exists&&s.data().ultimo)||1000)+1;await ref.set({ultimo:n});return n}
  await new Promise(k=>setTimeout(k,350+Math.random()*400))}
 return maxLocal+1}

function CotarFrete({cfg,cli,t,cep,onClose,onEscolher}){const F0={...FRETE_PADRAO,...(cfg.frete||{})};

 const [st,setSt]=useState({load:false,r:null,erro:''});const [end,setEnd]=useState('');
 useEffect(()=>{if(dig(f.cep).length===8)buscaCep(dig(f.cep)).then(r=>setEnd(r?[r.logradouro,r.bairro,r.localidade+'/'+r.uf].filter(Boolean).join(', '):'CEP não encontrado')).catch(()=>{});else setEnd('')},[f.cep]);
 const cotar=async()=>{if(!dig(F0.cepOrigem))return setSt({load:false,r:null,erro:'Cadastre o CEP de origem em Configurações → Empresa → Frete.'});if(dig(f.cep).length!==8)return setSt({load:false,r:null,erro:'CEP de destino inválido'});
  setSt({load:true,r:null,erro:''});

   setSt({load:false,r:(r.opcoes||[]).sort((a,b)=>a.preco-b.preco),erro:''})}catch(e){setSt({load:false,r:null,erro:e.message||'Falha na cotação'})}};

async function moverPedido({db,p,etapa,me,pode,produtos,toast,abrir}){
 if(p.etapaId===etapa.id)return;
 if(!pode('mover'))return toast('Você não tem permissão para mover pedidos.',1);
 if(p.cancelado&&!etapa.cancela)return toast('Pedido #'+p.numero+' está cancelado.',1);
 if(etapa.exigePagamento&&p.statusFin!=='pago')return toast('Pedido #'+p.numero+' não está pago. Registre o pagamento antes de mover para "'+etapa.nome+'".',1);
 if(etapa.exigeLiberacao&&!(p.statusFin==='pago'||p.autorizado))return toast('Pedido #'+p.numero+' não liberado: registre o pagamento ou autorize a produção faturada.',1);
 const agora=new Date().toISOString();let np={...p,etapaId:etapa.id,etapaDesde:agora,historico:[...(p.historico||[]),{em:agora,por:me,tipo:'etapa',de:p.etapaId,para:etapa.id}]};
 if(etapa.cancela){if(!pode('cancelar'))return toast('Sem permissão para cancelar.',1);if(p.pago>0)return toast('Estorne os pagamentos antes de cancelar.',1);np.cancelado={em:agora,por:me,motivo:'Movido para '+etapa.nome}}
 if(etapa.status&&!etapa.cancela)np.statusProd=etapa.status;
 try{
  if(np.statusProd==='entregue'&&!p.baixaEstoque){ // baixa definitiva do vestuário na entrega
   const porProd={};for(const i of p.itens)if(i.varianteId)(porProd[i.produtoId]=porProd[i.produtoId]||[]).push(i);
   for(const pid in porProd){const pr=produtos.find(x=>x.id===pid);if(!pr||!pr.controlaEstoque)continue;
    const variantes=(pr.variantes||[]).map(v=>{const q=sum(porProd[pid].filter(i=>i.varianteId===v.id),i=>i.qtd);return q?{...v,estoque:Number(v.estoque||0)-q}:v});
    const mov=[...(pr.movimentos||[]),...porProd[pid].map(i=>({em:agora,var:i.varianteId,q:-i.qtd,tipo:'venda',ref:'#'+p.numero}))].slice(-200);
    await db.doc('produtos/'+pid).update({variantes,movimentos:mov})}
   np.baixaEstoque=true;np.entregueEm=agora}
  const {id:_x,...c}=normalizar(np,me);await db.doc('pedidos/'+p.id).set(c);toast('#'+p.numero+' → '+etapa.nome);
  if(ONLINE()&&abrir&&np.entrega&&np.entrega!=='retirada'&&!np.cancelado&&['pronto','entregue'].includes(c.statusProd)&&!(p.etiqueta&&p.etiqueta.id))abrir('etiqueta',p.id)}
 catch(e){toast('Erro ao mover: '+(e.message||e.code),1)}}

function Kanban(ctx){
 const {pedidos,cfg,abrir,pode}=ctx;const [vis,setVis]=useState('geral');const [q,setQ]=useState('');const [over,setOver]=useState(null);const drag=useRef(null);
 const limite=Date.now()-7*864e5;
 const ps=pedidos.filter(p=>(!(p.cancelado||p.statusProd==='entregue')||new Date(p.etapaDesde)>limite)&&(!q||String(p.numero).includes(q)||norm(p.clienteNome).includes(norm(q))));
 let cols,cards;
 if(vis==='geral'){cols=cfg.etapas;cards=ps.map(p=>({k:p.id,col:p.etapaId,p}))}
 else if(vis==='financeiro'){cols=[{id:'pendente',nome:'Pendente',cor:'#f59e0b'},{id:'parcial',nome:'Parcial',cor:'#3b82f6'},{id:'faturado',nome:'Faturado (a cobrar)',cor:'#8b5cf6'},{id:'pago',nome:'Pago',cor:'#16a34a'}];cards=ps.filter(p=>!p.cancelado).map(p=>({k:p.id,col:p.statusFin,p}))}
 else{cols=[{id:'pendente',nome:'Pendente',cor:'#a1a1aa'},{id:'na_fila',nome:'Na fila',cor:'#3b82f6'},{id:'em_andamento',nome:'Em andamento',cor:'#6366f1'},{id:'concluida',nome:'Concluída',cor:'#16a34a'}];
  cards=ps.filter(p=>p.ordens&&p.ordens[vis]).map(p=>({k:p.id+vis,col:p.ordens[vis],p}))}
 const soltar=async(colId,card)=>{setOver(null);if(!card||card.col===colId)return;
  if(vis==='geral'){const e=cfg.etapas.find(x=>x.id===colId);return moverPedido({...ctx,p:card.p,etapa:e})}
  if(vis==='financeiro')return ctx.toast('O status financeiro muda pelos pagamentos ou pela autorização da produção (abra o pedido).');
  if(!pode('ops'))return ctx.toast('Sem permissão para alterar ordens de produção.',1);
  const p=card.p;const {id:_x,...c}=normalizar({...p,ordens:{...p.ordens,[vis]:colId},historico:[...p.historico,{em:new Date().toISOString(),por:ctx.me,tipo:'producao',obs:SETORES[vis]+': '+OPS[colId]}]},ctx.me);
  try{await ctx.db.doc('pedidos/'+p.id).set(c);ctx.toast(SETORES[vis]+' #'+p.numero+': '+OPS[colId])}catch(e){ctx.toast('Erro: '+(e.message||e.code),1)}};
 const VIS=[['geral','Geral'],...Object.entries(SETORES),['financeiro','Financeiro']];
 return html`<div>
  <div className="row between" style=${{marginBottom:12}}><div><h1>Kanban</h1><div className="sub">Arraste os cartões entre as colunas. Toda movimentação fica no histórico do pedido.</div></div>
   <input className="in" style=${{width:240}} placeholder="Nº ou cliente" value=${q} onChange=${e=>setQ(e.target.value)}/></div>
  <div className="tabs" style=${{marginBottom:12}}>${VIS.map(([k,l])=>html`<button key=${k} className=${vis===k?'on':''} onClick=${()=>setVis(k)}>${l}</button>`)}</div>
  <div className="kb">${cols.map(c=>{const cs=cards.filter(x=>x.col===c.id);
   return html`<div key=${c.id} className=${'col'+(over===c.id?' over':'')} onDragOver=${e=>{e.preventDefault();over!==c.id&&setOver(c.id)}} onDragLeave=${()=>setOver(o=>o===c.id?null:o)} onDrop=${e=>{e.preventDefault();soltar(c.id,drag.current)}}>
    <div className="h"><span className="dot" style=${{background:c.cor}}></span><span style=${{flex:1}}>${c.nome}</span><span className="badge">${cs.length}</span></div>
    ${pode('fat')&&cs.length>0&&html`<div className="sm mut tab" style=${{padding:'0 12px 8px',marginTop:-6}}>${moeda(sum(cs,x=>x.p.total))}${c.exigePagamento?' · exige pagamento':''}</div>`}
    <div className="bd">${cs.map(x=>html`<${Cartao} key=${x.k} x=${x} vis=${vis} cols=${cols} pode=${pode} abrir=${abrir} onDrag=${()=>drag.current=x} onMover=${id=>soltar(id,x)}/>`)}</div></div>`})}</div></div>`}
function Cartao({x,vis,cols,pode,abrir,onDrag,onMover}){const p=x.p;const ops=Object.values(p.ordens||{});const pc=ops.length?Math.round(ops.filter(o=>o==='concluida').length/ops.length*100):null;
 const at=p.previsao&&new Date(p.previsao)<new Date()&&['aguardando','em_producao'].includes(p.statusProd);const m=(p.totais?.mt||0)+(p.totais?.mu||0);const wa=waLink(p.clienteWhats,'Olá, '+(p.clienteNome||'').split(' ')[0]+'! Sobre o pedido #'+p.numero+':');
 return html`<div className=${'tk'+(p.prioridade==='urgente'?' urg':p.prioridade==='alta'?' alta':'')} draggable="true" onDragStart=${e=>{onDrag();e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',x.k)}catch(_){}}}>
  <div className="row between"><button style=${{border:0,background:'none',padding:0,fontWeight:700,cursor:'pointer'}} onClick=${()=>abrir('pedido',p.id)}>#${p.numero}</button>${pode('fat')&&html`<b className="tab sm">${moeda(p.total)}</b>`}</div>
  <div className="sm" style=${{marginTop:1}}>${p.clienteNome}</div>
  <div className="sm mut" style=${{marginTop:3,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>${(p.itens||[]).map(i=>num(i.qtd)+(UNID[i.unidade][1]==='m'?'m':'×')+' '+i.descricao).join(' · ')}</div>
  <div className="row" style=${{marginTop:7,gap:4}}><${FinB} s=${p.statusFin}/>${m>0&&html`<${Badge}>${num(m)} m<//>`}${p.totais?.pecas>0&&html`<${Badge}>${p.totais.pecas} pç<//>`}${['alta','urgente'].includes(p.prioridade)&&html`<${Badge} c=${PRIOR[p.prioridade][1]}>${PRIOR[p.prioridade][0]}<//>`}</div>
  ${pc!=null&&vis==='geral'&&html`<div className="hbar" style=${{marginTop:8,height:5}}><i style=${{width:pc+'%'}}></i></div>`}
  <div className="row sm mut" style=${{marginTop:7,gap:8}}><span className="row" style=${{gap:3}} title="Tempo na etapa"><${Ic} n="clk" s=${12}/>${decorrido(p.etapaDesde)}</span>
   ${p.previsao&&html`<span style=${{color:at?'var(--red2)':''}} className=${at?'b':''}>${at?'⚠ ':''}${dBR(p.previsao).slice(0,5)}</span>`}
   <select className="in" aria-label="Mover para" style=${{minHeight:26,padding:'0 4px',fontSize:12,width:'auto',marginLeft:'auto',maxWidth:110}} value="" onChange=${e=>e.target.value&&onMover(e.target.value)}><option value="">Mover…</option>${cols.filter(c=>c.id!==x.col).map(c=>html`<option key=${c.id} value=${c.id}>${c.nome}</option>`)}</select>
   ${wa&&html`<a href=${wa} target="_blank" rel="noreferrer" title="WhatsApp" style=${{color:'inherit'}}><${Ic} n="wa" s=${14}/></a>`}</div></div>`}

 const agg=useMemo(()=>{const m={};for(const p of pedidos){if(p.cancelado)continue;const o=m[p.clienteId]||(m[p.clienteId]={q:0,v:0,s:0,u:''});o.q++;o.v+=p.total;o.s+=p.saldo;if(p.criadoEm>o.u)o.u=p.criadoEm}return m},[pedidos]);
 const lista=clientes.filter(c=>{const t=norm(q.trim()),d=dig(q);if(t&&!(norm(c.nome).includes(t)||norm(c.fantasia).includes(t)||(d.length>=3&&(dig(c.whatsapp).includes(d)||dig(c.doc).includes(d)))))return false;
  if(cond&&c.condicao!==cond)return false;if(st==='ativos'&&c.ativo===false)return false;if(st==='inativos'&&c.ativo!==false)return false;return true}).sort((a,b)=>a.nome.localeCompare(b.nome));
 const exportar=async()=>{const dl=await claude.use('downloads');if(!dl)return toast('Download indisponível',1);
  const L=[['Nome','Documento','WhatsApp','E-mail','Cidade','UF','Condição','Pedidos','Faturamento','Saldo']].concat(lista.map(c=>{const a=agg[c.id]||{};return[c.nome,docFmt(c.doc),fone(c.whatsapp),c.email||'',c.cidade||'',c.uf||'',CONDICOES[c.condicao]||'',a.q||0,num(a.v||0),num(a.s||0)]}));
  try{await dl.save({filename:'clientes.csv',data:'﻿'+L.map(r=>r.map(x=>{const s=String(x??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n')})}catch(e){}};
 return html`<div>

   <div className="row">${pode('exportar')&&html`<button className="btn" onClick=${exportar}><${Ic} n="dl"/>Exportar CSV</button>`}${pode('clientes')&&html`<button className="btn p" onClick=${()=>setForm({t:'cliente'})}><${Ic} n="plus"/>Novo cliente</button>`}</div></div>

/* ---------------- matéria-prima, máquinas e central de impressão ---------------- */
const GRUPOS={dtf_textil:'DTF Têxtil',dtf_uv:'DTF UV',geral:'Geral (ambos)'};
const UN_INS=['m','m2','ml','l','g','kg','un'];
const MOTIVOS=['Erro de impressão','Falha de tinta branca','Falha de cabeça de impressão','Problema no filme','Erro no arquivo','Erro operacional','Problema de cura','Problema de aplicação','Testes','Manutenção','Outros'];
const FINALIDADES={producao:'Produção',reimpressao:'Reimpressão',teste:'Teste',interna:'Interna',perda:'Perda'};

const espera=ms=>new Promise(k=>setTimeout(k,ms));
const grupoOk=(tipo,g)=>g==='geral'||(tipo==='textil'&&g==='dtf_textil')||(tipo==='uv'&&g==='dtf_uv');
/* Consumo que o registro DEVE ter lançado: ficha técnica × metros impressos (descartes incluídos); o consumo real informado substitui o estimado. */
/* Baixa pelos pedidos: quando ligada, cada pedido com a produção concluída abate a matéria-prima pela ficha;
   os registros da Central de impressão passam a abater só os metros descartados (perdas), para não contar duas vezes. */
const BAIXA_PADRAO={ativo:true,desde:'2026-11-20T22:44:00.000Z',textil:'',uv:''};
let BAIXA=BAIXA_PADRAO;
function consumoDesejado(reg,maquinas,insumos){if(reg.cancelado)return{};const m=maquinas.find(x=>x.id===reg.maquinaId);const pf=(m&&m.perfis||[]).find(p=>p.id===reg.perfilId);const out={};
 const porPedido=BAIXA&&BAIXA.ativo&&reg.criadoEm>=BAIXA.desde;const base=porPedido?pn(reg.descartados):pn(reg.metros);
 for(const f of (pf&&pf.ficha)||[]){const ins=insumos.find(i=>i.id===f.insumoId);if(!ins||!grupoOk(reg.tipo,ins.grupo))continue;const q=r3(pn(f.qtd)*base);if(q)out[f.insumoId]=q}
 if(!porPedido)for(const [k,v] of Object.entries(reg.consumoReal||{}))if(v!==''&&v!=null){const ins=insumos.find(i=>i.id===k);if(ins&&grupoOk(reg.tipo,ins.grupo))out[k]=r3(pn(v))}
 return out}
function perfilBaixa(tipo,maquinas,cfgB){const sel=(cfgB||{})[tipo];if(sel){const [mi,pi]=sel.split('|');const m=maquinas.find(x=>x.id===mi);const pf=m&&(m.perfis||[]).find(x=>x.id===pi);if(pf)return pf}
 const ms=maquinas.filter(x=>(x.tipo||'textil')===tipo);const m=ms.find(x=>x.id==='mq-scalle')||ms[0];return m&&(m.perfis||[])[0]||null}
function consumoPedido(p,maquinas,insumos,cfgB){const B={...BAIXA_PADRAO,...(cfgB||{})};if(!B.ativo||p.cancelado||!(p.criadoEm>=B.desde)||!['pronto','entregue'].includes(p.statusProd))return{};const out={};
 const mp=p.maquinaId&&maquinas.find(x=>x.id===p.maquinaId);const pfp=mp&&((mp.perfis||[]).find(x=>x.id===p.perfilId)||(mp.perfis||[])[0]);
 for(const [tipo,met] of [['textil',p.totais?.mt||0],['uv',p.totais?.mu||0]]){if(!(met>0))continue;const pf=pfp&&(mp.tipo||'textil')===tipo?pfp:perfilBaixa(tipo,maquinas,B);
  for(const f of (pf&&pf.ficha)||[]){const ins=insumos.find(i=>i.id===f.insumoId);if(!ins||!grupoOk(tipo,ins.grupo))continue;out[f.insumoId]=r3((out[f.insumoId]||0)+pn(f.qtd)*met)}}
 return out}
/* O que já foi impresso não volta ao estoque (o material impresso é descartado): só abate a mais, nunca devolve. */
function alvoPedido(p,ctx){const des=consumoPedido(p,ctx.maquinas,ctx.insumos,ctx.cfgB);const l=p.consumoLancado||{};const out={...l};for(const [k,v] of Object.entries(des))out[k]=Math.max(Number(l[k]||0),v);return out}
async function aplicarConsumoPedido(db,p,ctx){const des=alvoPedido(p,ctx);const lanc={...(p.consumoLancado||{})};let mudou=false;
 for(const id of new Set([...Object.keys(des),...Object.keys(lanc)])){const antes=Number(lanc[id]||0),alvo=Number(des[id]||0);const dif=r3(alvo-antes);if(dif===0)continue;
  await movimentarInsumo(db,id,-dif,{tipo:dif>0?'consumo':'estorno',ref:'Pedido #'+p.numero,lid:'ped:'+p.id+':'+id+':'+antes+'>'+alvo,por:ctx.me});
  if(alvo)lanc[id]=alvo;else delete lanc[id];mudou=true;await db.doc('pedidos/'+p.id).update({consumoLancado:lanc})}
 return mudou}
const precisaBaixa=(p,ctx)=>{const des=alvoPedido(p,ctx);const l=p.consumoLancado||{};for(const k of new Set([...Object.keys(des),...Object.keys(l)]))if(r3(Number(des[k]||0)-Number(l[k]||0))!==0)return true;return false};
/* Movimenta um insumo com trava (lease) e chave de idempotência: o mesmo lançamento nunca é aplicado duas vezes. */
async function movimentarInsumo(db,insId,delta,mov){const ref=db.doc('insumos/'+insId);
 for(let t=0;t<10;t++){const l=await ref.acquire({holder:TAB,ttlMs:6000});
  if(l.acquired){const s=await ref.get();if(!s.exists)throw new Error('Insumo não encontrado');const d=s.data();
   if(mov.lid&&(d.movimentos||[]).some(x=>x.lid===mov.lid))return;
   let custo=Number(d.custoMedio||0);if(mov.tipo==='entrada'&&delta>0&&mov.custo>0){const base=Math.max(0,Number(d.estoque||0));custo=r4((base*custo+delta*mov.custo)/(base+delta))}
   const est=r3(Number(d.estoque||0)+delta);
   await ref.update({estoque:est,custoMedio:custo,ultimoPreco:mov.tipo==='entrada'&&mov.custo>0?mov.custo:(d.ultimoPreco??null),movimentos:[...(d.movimentos||[]),{...mov,q:r3(delta),saldo:est,em:new Date().toISOString()}].slice(-400)});return}
  await espera(250+Math.random()*400)}
 throw new Error('Estoque ocupado por outro usuário. Tente novamente.')}
/* Aplica a baixa automática pela diferença entre o desejado e o já lançado (editar/cancelar só lança o ajuste). */
async function aplicarConsumo(db,reg,ctx){const des=consumoDesejado(reg,ctx.maquinas,ctx.insumos);const lanc={...(reg.lancado||{})};let custo=0;
 for(const id of new Set([...Object.keys(des),...Object.keys(lanc)])){const antes=Number(lanc[id]||0),alvo=Number(des[id]||0);const dif=r3(alvo-antes);
  if(dif!==0){await movimentarInsumo(db,id,-dif,{tipo:dif>0?'consumo':'estorno',ref:'Impressão '+reg.codigo,lid:reg.id+':'+id+':'+antes+'>'+alvo,por:ctx.me});
   if(alvo)lanc[id]=alvo;else delete lanc[id];await db.doc('impressoes/'+reg.id).update({lancado:lanc})}
  const ins=ctx.insumos.find(i=>i.id===id);custo+=alvo*Number(ins&&ins.custoMedio||0)}
 return{lancado:lanc,custoMateriais:r2(custo),custoDescarte:pn(reg.metros)>0?r2(custo*pn(reg.descartados)/pn(reg.metros)):0}}
const horasReg=r=>{if(r.cancelado||!r.inicio||!r.fim)return 0;const [a,b]=[r.inicio,r.fim].map(x=>{const [h,m]=x.split(':').map(Number);return h*60+m});return Math.max(0,(b>=a?b-a:b+1440-a))/60};
function previsaoPerfil(pf,insumos,impressoes){const rec=impressoes.filter(r=>!r.cancelado&&r.perfilId===pf.id&&r.data>=addD(diaSP(),-29));const dias=new Set(rec.map(r=>r.data)).size;const media=dias?sum(rec,r=>r.metros)/dias:0;
 let lim=null,ins=null;for(const f of pf.ficha||[]){const i=insumos.find(x=>x.id===f.insumoId);if(!i||!(pn(f.qtd)>0))continue;const m=Math.max(0,Number(i.estoque||0))/pn(f.qtd);if(lim==null||m<lim){lim=m;ins=i}}
 return{metros:lim,limitante:ins,media,dias:lim!=null&&media>0?lim/media:null}}

/* previsão de duração do estoque pelo consumo médio dos últimos 30 dias */
function previsaoInsumos(insumos){const lim=addD(diaSP(),-29);return insumos.filter(i=>i.ativo!==false).map(i=>{const c30=-sum((i.movimentos||[]).filter(m=>(m.tipo==='consumo'||m.tipo==='estorno')&&diaSP(m.em)>=lim),m=>m.q);const dia=c30>0?c30/30:0;const est=Number(i.estoque||0);
 return{...i,c30,dia,dias:dia>0?Math.max(0,est)/dia:null,baixo:Number(i.minimo)>0&&est<=Number(i.minimo),zerado:est<=0}})}
function ListaCompras({insumos,cfg,toast,onClose}){const [cob,setCob]=useState(String(cfg.cobertura||15));const pv=useMemo(()=>previsaoInsumos(insumos),[insumos]);
 const sug=i=>{const alvo=Math.max(i.dia*pn(cob),Number(i.minimo||0)*1.5);return Math.max(0,alvo-Math.max(0,Number(i.estoque||0)))};
 const base=pv.filter(i=>i.zerado||i.baixo||(i.dias!=null&&i.dias<pn(cob))).sort((a,b)=>(a.dias??-1)-(b.dias??-1));
 const [q,setQ]=useState(()=>Object.fromEntries(base.map(i=>{const v=sug(i);return[i.id,String(v>=10?Math.ceil(v):Math.ceil(v*100)/100).replace('.',',')]})));
 useEffect(()=>{setQ(Object.fromEntries(base.map(i=>{const v=sug(i);return[i.id,String(v>=10?Math.ceil(v):Math.ceil(v*100)/100).replace('.',',')]})))},[cob]);
 const itens=base.filter(i=>pn(q[i.id])>0);const total=sum(itens,i=>pn(q[i.id])*Number(i.ultimoPreco||i.custoMedio||0));
 const texto='*Lista de compras — '+cfg.empresa.nome+'* ('+dBR(diaSP())+')\n\n'+itens.map(i=>'• '+i.nome+': '+num(pn(q[i.id]),2)+' '+i.unidade).join('\n');
 const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 const imprimir=async()=>{const h='<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Lista de compras</title><style>body{font:13px Arial;margin:24px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left}.r{text-align:right}</style><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #a3089a;padding-bottom:8px"><img src="'+LOGO+'" style="height:44px;background:#000;border-radius:6px"><div style="text-align:right"><b style="font-size:17px">Lista de compras</b><div>'+dBR(diaSP())+' · cobertura de '+esc(cob)+' dias</div></div></div><table><tr><th>Insumo</th><th>Fornecedor</th><th class="r">Estoque</th><th class="r">Dura</th><th class="r">Comprar</th><th class="r">Estimado</th></tr>'+itens.map(i=>'<tr><td>'+esc(i.nome)+'</td><td>'+esc(i.fornecedor||'')+'</td><td class="r">'+num(i.estoque,2)+' '+esc(i.unidade)+'</td><td class="r">'+(i.dias==null?'—':num(i.dias,0)+' dias')+'</td><td class="r"><b>'+num(pn(q[i.id]),2)+' '+esc(i.unidade)+'</b></td><td class="r">'+moeda(pn(q[i.id])*Number(i.ultimoPreco||i.custoMedio||0))+'</td></tr>').join('')+'</table><p class="r"><b>Total estimado: '+moeda(total)+'</b></p></html>';
  if(ONLINE()){const fr=document.createElement('iframe');fr.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(fr);fr.srcdoc=h;fr.onload=()=>{try{fr.contentWindow.print()}catch(e){}setTimeout(()=>fr.remove(),60000)};return}
  const dl=await claude.use('downloads');if(dl)await dl.save({filename:'lista-de-compras-'+diaSP()+'.html',data:h})};
 const copiar=async()=>{try{await navigator.clipboard.writeText(texto.replace(/\\n/g,'\n'));toast('Lista copiada')}catch(e){toast('Não foi possível copiar',1)}};
 return html`<${Modal} lg title="Lista de compras" sub="Calculada pelo consumo médio dos últimos 30 dias" onClose=${onClose}>
  <div className="row" style=${{marginBottom:10}}><span className="sm">Comprar para</span><input className="in tab" style=${{width:80}} value=${cob} onChange=${e=>setCob(e.target.value)}/><span className="sm">dias de produção</span></div>

const SIM_PADRAO={filme:'',consFilme:1.02,branca:'',consBranca:0.017,cor:'',consCor:0.012,po:'',consPo:0.025,desgaste:'',energia:'',salario:'',encargos:70,outrosFixos:'',metrosDia:'',dias:22,margem:40,impostos:0,cartao:0};
function calcSim(s){const v=k=>pn(s[k]);
 const mat=v('filme')/100*v('consFilme')+v('branca')*v('consBranca')+v('cor')*v('consCor')+v('po')*v('consPo')+v('desgaste');
 const fixos=v('energia')+v('salario')*(1+v('encargos')/100)+v('outrosFixos');const mm=v('metrosDia')*v('dias');const fixoM=mm>0?fixos/mm:0;const custo=mat+fixoM;
 const tax=(v('impostos')+v('cartao'))/100,mg=v('margem')/100;const ok=1-tax-mg>0&&1-tax>0;
 const preco=ok?custo/(1-tax-mg):null,minimo=1-tax>0?custo/(1-tax):null;const contrib=preco!=null?preco*(1-tax)-mat:null;
 return{mat,fixos,mm,fixoM,custo,preco,minimo,lucroM:preco!=null?preco*(1-tax)-custo:null,pe:contrib>0?fixos/contrib:null,fatMes:preco!=null?preco*mm:null,lucroMes:preco!=null?(preco*(1-tax)-custo)*mm:null,erro:ok?null:'Margem + impostos + taxas somam 100% ou mais'}}
function Custos({db,cfg,clientes,pedidos,insumos,maquinas,owner,papel,pode,toast}){
 const [aba,setAba]=useState('metro');const admin=owner||papel==='admin'||pode('custos');
 const [c,setC]=useState({porMetro:'',outros:'',embalagem:'',...(cfg.custos||{})});const [s,setS]=useState({...SIM_PADRAO,...(cfg.simulador||{})});
 useEffect(()=>{setC({porMetro:'',outros:'',embalagem:'',...(cfg.custos||{})});setS({...SIM_PADRAO,...(cfg.simulador||{})})},[cfg]);
 const salvar=async(patch,msg)=>{try{const ref=db.doc('erp/config');const cur=await ref.get();await ref.set({...(cur.exists?cur.data():{}),...patch});toast(msg||'Salvo')}catch(e){toast('Somente o dono ou editores podem salvar custos.',1)}};
 const cm=pn(c.porMetro)+pn(c.outros);const r=calcSim(s);
 const fichas=maquinas.flatMap(m=>(m.perfis||[]).map(p=>{let v=0,falta=false;for(const f of p.ficha||[]){const i=insumos.find(x=>x.id===f.insumoId);if(!i||!(Number(i.custoMedio)>0))falta=true;else v+=pn(f.qtd)*Number(i.custoMedio)}return{n:m.nome+' · '+p.nome,v,falta}}));
 const lim=addD(diaSP(),-29);const cli=clientes.filter(x=>Number(x.precoMetro)>0).map(x=>{const ps=pedidos.filter(p=>p.clienteId===x.id&&!p.cancelado&&p.dia>=lim);const m=sum(ps,p=>p.totais?.mt||0);const mg=(x.precoMetro-cm)/x.precoMetro*100;return{...x,m,mg,lucro:m*(x.precoMetro-cm)}}).sort((a,b)=>a.mg-b.mg);
 const I=(k,l,h)=>html`<${F} l=${l} hint=${h}><input className="in tab" inputMode="decimal" value=${s[k]} onChange=${e=>setS({...s,[k]:e.target.value})}/><//>`;
 return html`<div><div className="row between" style=${{marginBottom:14}}><div><h1>Custos e precificação</h1><div className="sub">Custo total por metro hoje: <b>${moeda(cm)}</b>${pn(c.embalagem)>0?' + '+moeda(c.embalagem)+' de embalagem por pedido':''}. Usado no lucro de cada pedido.</div></div></div>

    <${F} l="Outros custos por metro (R$)" hint="Energia, manutenção, mão de obra rateada"><input className="in tab" disabled=${!admin} value=${c.outros} onChange=${e=>setC({...c,outros:e.target.value})}/><//>
    <${F} l="Embalagem por pedido (R$)"><input className="in tab" disabled=${!admin} value=${c.embalagem} onChange=${e=>setC({...c,embalagem:e.target.value})}/><//>
    <div className="row between"><b>Total por metro: ${moeda(cm)}</b>${admin&&html`<button className="btn p" onClick=${()=>salvar({custos:{porMetro:pn(c.porMetro),outros:pn(c.outros),embalagem:pn(c.embalagem)}},'Custos salvos')}>Salvar custos</button>`}</div>
    <div className="sm mut">Produtos com preço de custo próprio usam o valor do produto. Os demais itens de DTF usam este custo por metro.</div></div>
   <div className="card pad"><h2>Custo real de matéria-prima pela ficha</h2><div className="sm mut" style=${{margin:'4px 0 10px'}}>Calculado com o custo médio das entradas de estoque e o consumo por metro de cada perfil.</div>
    ${fichas.length===0?html`<div className="sm mut">Cadastre máquinas e fichas em Produção → Máquinas.</div>`:fichas.map((f,i)=>html`<div key=${i} className="row between" style=${{padding:'8px 0',borderBottom:'1px solid var(--line)'}}><span className="sm">${f.n}</span><span className="row"><b className="tab">${moeda(f.v)}/m</b>${f.falta?html`<${Badge} c="b-warn">falta custo de insumo<//>`:admin&&html`<button className="btn sm" onClick=${()=>setC({...c,porMetro:String(r4(f.v))})}>Usar</button>`}</span></div>`)}</div></div>`}
  ${aba==='simulador'&&html`<div className="grid" style=${{gridTemplateColumns:'minmax(0,1.4fr) minmax(0,1fr)',gap:14}}>

    <div><h2>Custos fixos mensais</h2><div className="grid g4" style=${{marginTop:8}}>${I('energia','Energia elétrica (R$)')}${I('salario','Salários (R$)')}${I('encargos','Encargos (%)')}${I('outrosFixos','Aluguel e outros (R$)')}</div></div>
    <div><h2>Produção e venda</h2><div className="grid g4" style=${{marginTop:8}}>${I('metrosDia','Metros por dia')}${I('dias','Dias úteis/mês')}${I('margem','Margem desejada (%)')}${I('impostos','Impostos (%)')}${I('cartao','Taxa de cartão (%)')}</div></div>
    ${admin&&html`<div className="row" style=${{justifyContent:'flex-end'}}><button className="btn" onClick=${()=>salvar({simulador:s},'Simulação salva')}>Salvar simulação</button></div>`}</div>
   <div><div className="card pad hero" style=${{display:'grid',gap:8,position:'sticky',top:70}}>
    <div className="t sm">Custo real por metro</div><div className="tab" style=${{fontSize:34,fontWeight:800}}>${moeda(r.custo)}</div>

    <div className="row between sm"><span className="mut">Fixos rateados (${num(r.mm,0)} m/mês)</span><span className="tab">${moeda(r.fixoM)}/m</span></div>

    ${r.erro&&html`<div className="sm" style=${{color:'#fca5a5'}}>${r.erro}</div>`}

    <div className="sm mut">Preço = custo ÷ (1 − impostos − taxas − margem).</div>
    ${admin&&html`<button className="btn p" onClick=${()=>salvar({custos:{porMetro:r2(r.mat),outros:r2(r.fixoM),embalagem:pn(c.embalagem)},simulador:s},'Custo por metro atualizado: '+moeda(r.custo))}>Aplicar este custo nos pedidos</button>`}</div></div></div>`}
  ${aba==='clientes'&&html`<div className="card"><div className="pad sm mut">Preço por metro de cada cliente comparado ao custo por metro atual (${moeda(cm)}). Metros e lucro dos últimos 30 dias.</div>

   ${cli.map(x=>html`<tr key=${x.id}><td>${x.nome}</td><td className="r tab">${moeda(x.precoMetro)}</td><td className="r tab b" style=${{color:x.mg<25?'var(--red2)':x.mg<40?'var(--warn)':'var(--ok)'}}>${pct(x.mg)}</td><td className="r tab">${num(x.m)}</td><td className="r tab">${moeda(x.lucro)}</td></tr>`)}</tbody></table></div>`}</div>`}

function ImportarScalle({db,cfg,produtos,clientes,pedidos,maquinas,insumos,toast}){
 const [dados,setDados]=useState(null);const [prog,setProg]=useState(null);const [erro,setErro]=useState('');
 const ler=async file=>{setErro('');try{const j=JSON.parse(await file.text());if(!j||!Array.isArray(j.pedidos)||!Array.isArray(j.clientes))throw new Error('Arquivo não é uma exportação do Scalle');setDados(j)}catch(e){setErro(e.message)}};
 const gravar=async(path,data)=>{for(let t=0;t<6;t++){try{await db.doc(path).set(data);return}catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')){await espera(800*(t+1));continue}throw e}}throw new Error('Limite de gravação atingido; tente de novo em instantes')};
 const importar=async()=>{const d=dados;const total=2+d.clientes.length+d.pedidos.length+(d.fechamentos||[]).length+(d.estoque||[]).length;let n=0;const passo=async(p,x)=>{await gravar(p,x);n++;if(n%10===0||n===total)setProg({n,total})};setProg({n:0,total});
  try{const S=d.config||{};const cur=(await db.doc('erp/config').get());const base=cur.exists?cur.data():{};
   await passo('erp/config',{...CONFIG_PADRAO,...base,empresa:{...CONFIG_PADRAO.empresa,...(base.empresa||{}),nome:S.empresa||base.empresa?.nome||'RIBER PRINT',whatsapp:dig(S.telefone)||base.empresa?.whatsapp||'',endereco:S.endereco||base.empresa?.endereco||'',pix:S.pix||base.empresa?.pix||''},
    meta:Number(S.meta||base.meta||0),custos:{porMetro:Number(S.custoMetro||0),outros:Number(S.outros||0),embalagem:Number(S.embalagem||0)}});
   const precoComum=(()=>{const m={};for(const c of d.clientes)if(c.preco>0)m[c.preco]=(m[c.preco]||0)+1;return Number(Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||0)})();
   await passo('produtos/pr-dtf-metro',{nome:'DTF Têxtil (metro)',categoria:'dtf_textil',unidade:'metro_linear',tipoDtf:'textil',sku:'DTF-M',preco:precoComum,atacado:null,custo:null,ativo:true,controlaEstoque:false,variacoes:false,faixas:[],variantes:[],descricao:'Importado do Scalle. O preço de cada cliente vem do cadastro dele.',historicoPrecos:[],movimentos:[],criadoEm:new Date().toISOString()});
   const UN={litros:'l',metros:'m',kg:'kg',gramas:'g',ml:'ml',unidades:'un'};const ficha=[];
   for(const i of d.estoque||[]){const id='i-sc-'+i.id;ficha.push({insumoId:id,qtd:Number(i.consumo||0)});await passo('insumos/'+id,{nome:i.nome,grupo:'dtf_textil',categoria:/tinta/i.test(i.nome)?'Tinta':/filme/i.test(i.nome)?'Filme':/poliamida|pó/i.test(i.nome)?'Pó adesivo':'Outros',unidade:UN[i.unidade]||i.unidade,estoque:Number(i.estoque||0),minimo:Number(i.minimo||0),custoMedio:0,ativo:true,movimentos:[],criadoEm:new Date().toISOString()})}
   if(ficha.length&&!maquinas.some(m=>m.id==='mq-scalle'))await gravar('maquinas/mq-scalle',{nome:'Impressora DTF Têxtil',tipo:'textil',cabeca:'',qtdCabecas:'',largura:'',velocidade:'',status:'operando',intervaloManut:0,horas:0,horasUltimaManut:0,manutencoes:[],perfis:[{id:'pf-scalle',nome:'Padrão (consumo do Scalle)',passCor:'',passBranco:'',ficha:ficha.filter(f=>f.qtd>0)}]});
   const cmap={};for(const c of d.clientes){const id='c-sc-'+c.id;cmap[c.id]=c;await passo('clientes/'+id,{tipo:dig(c.doc).length===14?'PJ':'PF',nome:(c.nome||'').trim(),fantasia:'',doc:dig(c.doc),ie:'',whatsapp:dig(c.whatsapp),telefone:dig(c.telefone),email:c.email||'',cep:dig(c.cep),endereco:c.endereco||'',numero:'',complemento:'',bairro:c.bairro||'',cidade:c.cidade||'',uf:(c.uf||'').slice(0,2),obs:c.obs||'',
    limite:0,classificacao:'',desconto:0,tipoPreco:'varejo',precoMetro:Number(c.preco||0),regras:(c.regras||[]).map(r=>({min:Number(r.min),preco:Number(r.preco)})),condicao:['diario','semanal','quinzenal','mensal'].includes(c.cobranca)?c.cobranca:'antecipado',prazo:'',diaFechamento:'',diaVencimento:'',
    producaoSemPagamento:['semanal','quinzenal','mensal'].includes(c.cobranca),ativo:true,contatos:[],criadoEm:c.criado||new Date().toISOString(),origem:'scalle'})}
   const pagosFech={};for(const f of d.fechamentos||[])if(f.status==='pago')for(const o of f.pedidos||[])pagosFech[o]={fid:'f-sc-'+f.id,data:(f.atualizado||f.fim||'').slice(0,10)};
   const ord=[...d.pedidos].sort((a,b)=>(a.criado||'').localeCompare(b.criado||''));const num0=Math.max(1000,...pedidos.filter(p=>p.origem!=='scalle').map(p=>p.numero||0));const nums=d.pedidos.map(o=>Number(o.numero)).filter(x=>Number.isInteger(x)&&x>0);const locais=new Set(pedidos.filter(p=>p.origem!=='scalle').map(p=>p.numero));const usarNum=nums.length===d.pedidos.length&&new Set(nums).size===nums.length&&!nums.some(x=>locais.has(x));const numMap={};const hoje=diaSP();const ET={};for(const e of cfg.etapas)ET[e.id]=e;
   for(let k=0;k<ord.length;k++){const o=ord[k];const numero=usarNum?Number(o.numero):num0+k+1;numMap[o.id]=numero;const cli=cmap[o.cliente]||{};const quando=o.criado&&(o.criado.slice(0,10)===o.data||!o.data)?new Date(o.criado).toISOString():new Date((o.data||diaSP())+'T12:00:00-03:00').toISOString();const metros=Number(o.metros||0);
    const cort=!!o.cortesia||(Number(o.total||0)===0&&metros>0);const custoU=metros>0?Number(o.custo||0)/metros:0;
    let etapa='recebido',sp='aguardando',aut=false,ordens={},pags=[];const velho=(o.data||'')<addD(hoje,-7);
    if(o.status==='fila'){etapa='fila';aut=true;ordens={dtf_textil:'na_fila'}}

    else if(o.status==='pago'){aut=true;ordens={dtf_textil:'concluida'};etapa='finalizado';sp='entregue'}

    const p={numero,criadoEm:quando,atendente:null,vendedor:o.vendedor||'',operador:o.operador||'',clienteId:'c-sc-'+o.cliente,clienteNome:(o.clienteNome||cli.nome||'').trim(),clienteWhats:dig(cli.whatsapp),prioridade:['alta','urgente'].includes(o.prioridade)?o.prioridade:'normal',previsao:'',forma:'',canal:'balcao',entrega:'retirada',endereco:'',frete:0,desconto:0,cortesia:cort,custoExtra:0,
     obsInterna:[o.obs,(o.lista||[]).length>1?'Metragens: '+o.lista.map(x=>num(x)).join(' + '):''].filter(Boolean).join(' · '),obsCliente:'',
     itens:[{id:'it1',produtoId:'pr-dtf-metro',varianteId:'',qtd:metros,qtdTexto:(o.lista||[]).length>1?o.lista.join('+'):String(metros),preco:Number(o.preco||0),desconto:0,obs:'',nomeProduto:'DTF Têxtil (metro)',descricao:'DTF Têxtil (metro)',unidade:'metro_linear',grupo:'impressao',setor:'dtf_textil',tipoDtf:'textil',custo:r4(custoU)}],
     pagamentos:pags,autorizado:aut,etapaId:ET[etapa]?etapa:cfg.etapas[0].id,etapaDesde:quando,statusProd:sp,ordens,historico:[{em:quando,por:null,tipo:'criacao',para:etapa,obs:'Importado do Scalle'}],cancelado:o.status==='cancelado'?{em:quando,por:null,motivo:'Cancelado no Scalle'}:null,baixaEstoque:true,origem:'scalle',scalleId:o.id};
    const {id:_x,...c}=normalizar(p,null);await passo('pedidos/p-sc-'+o.id,c)}
   {const nomes=new Map();for(const o of d.pedidos){for(const [n,f] of [[o.vendedor,'vendedor'],[o.operador,'operador']]){const t=(n||'').trim();if(!t)continue;const k=norm(t);const x=nomes.get(k)||{nome:t,funcoes:new Set()};x.funcoes.add(f);nomes.set(k,x)}}
    for(const [k,x] of nomes){const id='co-sc-'+k.replace(/[^a-z0-9]+/g,'-');const cur=await db.doc('colaboradores/'+id).get();if(!cur.exists)await gravar('colaboradores/'+id,{nome:x.nome,funcoes:[...x.funcoes],whatsapp:'',doc:'',email:'',comissaoMetro:0,comissaoPct:0,comissaoOperador:0,usuarioId:'',obs:'Importado do Scalle',ativo:true,criadoEm:new Date().toISOString()})}}
   await gravar('contadores/pedidos',{ultimo:Math.max(num0+ord.length*(usarNum?0:1),...Object.values(numMap),...pedidos.filter(p=>p.origem!=='scalle').map(p=>p.numero||0))});
   const fo=[...(d.fechamentos||[])].sort((a,b)=>(a.criado||'').localeCompare(b.criado||''));const pedM=Object.fromEntries(d.pedidos.map(o=>[o.id,o]));
   for(let k=0;k<fo.length;k++){const f=fo[k];const ps=(f.pedidos||[]).filter(id=>numMap[id]).map(id=>{const o=pedM[id];return{id:'p-sc-'+id,numero:numMap[id],data:o.data||'',metros:Number(o.metros||0),valor:Number(o.total||0)}});
    await passo('fechamentos/f-sc-'+f.id,{numero:k+1,clienteId:'c-sc-'+f.cliente,clienteNome:(f.clienteNome||'').trim(),periodicidade:(cmap[f.cliente]||{}).cobranca||'personalizado',inicio:f.inicio,fim:f.fim,vencimento:f.fim,criadoEm:f.criado||new Date().toISOString(),por:null,status:f.status==='pago'?'pago':'aberto',pedidos:ps,metros:Number(f.metros||0),total:Number(f.total||0),origem:'scalle'})}
   setProg({n:total,total,ok:true});toast('Importação concluída')}
  catch(e){setErro('Parou em '+n+' de '+total+': '+(e.message||e.code)+'. Pode importar de novo: os registros são atualizados, nunca duplicados.')}};
 return html`<div className="card pad" style=${{display:'grid',gap:12}}><h2>Importar dados do DTF Scalle</h2>
  <div className="sm mut">Selecione o arquivo de exportação (riber-scalle.json). Clientes (com preço por metro e promoções), pedidos, fechamentos, estoque com consumo por metro, custos, meta e chave PIX entram no sistema. Importar de novo atualiza os mesmos registros, sem duplicar.</div>
  <input type="file" accept=".json,application/json" onChange=${e=>e.target.files[0]&&ler(e.target.files[0])}/>
  ${erro&&html`<div className="sm" style=${{color:'var(--red2)'}}>${erro}</div>`}
  ${dados&&html`<div className="grid g4">${[['Clientes',dados.clientes.length],['Pedidos',dados.pedidos.length],['Fechamentos',(dados.fechamentos||[]).length],['Insumos',(dados.estoque||[]).length]].map(([k,v])=>html`<div key=${k} className="card kpi"><div className="t">${k}</div><div className="v tab">${v}</div></div>`)}</div>
   ${!prog&&html`<button className="btn p" style=${{justifySelf:'start'}} onClick=${importar}>Importar agora</button>`}`}
  ${prog&&html`<div><div className="hbar" style=${{height:10}}><i style=${{width:(prog.n/prog.total*100)+'%'}}></i></div><div className="sm" style=${{marginTop:6}}>${prog.ok?'✓ Concluído: '+prog.total+' registros':'Gravando '+prog.n+' de '+prog.total+'… não feche a página'}</div></div>`}</div>`}

function Config(ctx){const {db,cfg,owner,papel,toast}=ctx;
 const [c,setC]=useState(cfg);const [aba,setAba]=useState('empresa');const admin=owner||papel==='admin';useEffect(()=>setC(cfg),[cfg]);
 const salvar=async()=>{try{const ref=db.doc('erp/config');const cur=await ref.get();await ref.set({...(cur.exists?cur.data():{}),empresa:c.empresa,etapas:c.etapas,categorias:c.categorias,modelos:c.modelos,meta:pn(c.meta),msgFechamento:c.msgFechamento||MSG_FECH,msgCobranca:c.msgCobranca||MSG_COBRANCA,fechPrazo:pn(c.fechPrazo??3),frete:{...FRETE_PADRAO,...(c.frete||{})},baixaPedido:{...BAIXA_PADRAO,...(c.baixaPedido||{})}});toast('Configurações salvas')}catch(e){toast('Somente o dono do sistema ou editores podem alterar as configurações.',1)}};
 const E=k=>e=>setC({...c,empresa:{...c.empresa,[k]:e.target.value}});const upE=(i,k,v)=>setC({...c,etapas:c.etapas.map((x,j)=>j===i?{...x,[k]:v}:x)});
 const mov=(i,d)=>{const a=[...c.etapas];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];setC({...c,etapas:a})};

  <div className="tabs" style=${{marginBottom:14}}>${[['empresa','Empresa'],['etapas','Etapas do Kanban'],['categorias','Categorias'],['modelos','Mensagens WhatsApp'],...(admin?[['importar','Importar do Scalle']]:[])].map(([k,l])=>html`<button key=${k} className=${aba===k?'on':''} onClick=${()=>setAba(k)}>${l}</button>`)}</div>
  <fieldset disabled=${!admin} style=${{border:0,padding:0,margin:0}}>
  ${aba==='empresa'&&html`<div className="card pad grid g3"><${F} l="Nome da empresa"><input className="in" value=${c.empresa.nome} onChange=${E('nome')}/><//><${F} l="CNPJ"><input className="in" value=${c.empresa.cnpj} onChange=${E('cnpj')}/><//>
   <${F} l="WhatsApp"><input className="in" value=${c.empresa.whatsapp} onChange=${E('whatsapp')}/><//><${F} l="Endereço"><input className="in" value=${c.empresa.endereco} onChange=${E('endereco')}/><//>
   <${F} l="Chave PIX" hint="Usada em cobranças, QR Code e comprovantes"><input className="in" value=${c.empresa.pix} onChange=${E('pix')}/><//>
   <${F} l="Tipo da chave PIX"><select className="in" value=${c.empresa.pixTipo||''} onChange=${E('pixTipo')}><option value="">Detectar automaticamente</option><option value="email">E-mail</option><option value="cpf">CPF</option><option value="cnpj">CNPJ</option><option value="telefone">Telefone</option><option value="aleatoria">Chave aleatória</option></select><//>
   <${F} l="Nome do recebedor PIX" hint="Como aparece no banco do cliente"><input className="in" value=${c.empresa.pixNome||''} onChange=${E('pixNome')} placeholder=${c.empresa.nome}/><//>
   <${F} l="Cidade do recebedor PIX"><input className="in" value=${c.empresa.pixCidade||''} onChange=${E('pixCidade')} placeholder="Franca"/><//><${F} l="Horário de funcionamento"><input className="in" value=${c.empresa.horario} onChange=${E('horario')} placeholder="Seg a Sex, 8h às 18h"/><//>
   <${F} l="Meta de faturamento mensal (R$)" hint="Aparece no Dashboard com a projeção do mês"><input className="in tab" value=${c.meta??''} onChange=${e=>setC({...c,meta:e.target.value})}/><//></div>
   <div className="card pad" style=${{marginTop:12,display:'grid',gap:10}}><b>Baixa de matéria-prima pelos pedidos</b>
    <label className="row sm"><input type="checkbox" checked=${!!(c.baixaPedido||BAIXA_PADRAO).ativo} onChange=${e=>setC({...c,baixaPedido:{...BAIXA_PADRAO,...(c.baixaPedido||{}),ativo:e.target.checked,desde:e.target.checked&&!(c.baixaPedido||BAIXA_PADRAO).ativo?new Date().toISOString():(c.baixaPedido||BAIXA_PADRAO).desde}})}/> Abater o estoque automaticamente quando a produção do pedido for concluída (pronto ou entregue)</label>
    <div className="sm mut">Usa a ficha de consumo do perfil escolhido × metros do pedido. O que já foi abatido não volta ao estoque, mesmo se o pedido voltar etapa ou for cancelado (o material impresso é descartado). Se os metros do pedido aumentarem depois, abate a diferença. Vale para pedidos criados a partir de ${dhBR((c.baixaPedido||BAIXA_PADRAO).desde)}. Com isso ligado, a Central de impressão abate só os metros descartados.</div>
    <div className="grid g2">${[['textil','Perfil para DTF Têxtil'],['uv','Perfil para DTF UV']].map(([k,l])=>html`<${F} key=${k} l=${l}><select className="in" value=${(c.baixaPedido||{})[k]||''} onChange=${e=>setC({...c,baixaPedido:{...BAIXA_PADRAO,...(c.baixaPedido||{}),[k]:e.target.value}})}><option value="">Automático (primeira máquina ${k==='uv'?'UV':'têxtil'})</option>
     ${(ctx.maquinas||[]).filter(m=>(m.tipo||'textil')===k).flatMap(m=>(m.perfis||[]).map(pf=>html`<option key=${m.id+pf.id} value=${m.id+'|'+pf.id}>${m.nome} · ${pf.nome}</option>`))}</select><//>`)}</div></div>
   <div className="card pad" style=${{marginTop:12,display:'grid',gap:10}}><b>Frete (Melhor Envio)</b><div className="sm mut">Usado no botão “Cotar frete” dos pedidos com entrega. O peso do pacote é calculado: peso base + metros × peso por metro + peças × peso por peça (dá para ajustar na hora da cotação).</div>
    <div className="grid g4">${[['cepOrigem','CEP de origem'],['pesoBase','Peso base da embalagem (kg)'],['pesoMetro','Peso por metro de DTF (kg)'],['pesoPeca','Peso por peça de roupa (kg)'],['altura','Altura padrão (cm)'],['largura','Largura padrão (cm)'],['comprimento','Comprimento padrão (cm)']].map(([k,l])=>html`<${F} key=${k} l=${l}><input className="in tab" value=${(c.frete||FRETE_PADRAO)[k]??''} onChange=${e=>setC({...c,frete:{...FRETE_PADRAO,...(c.frete||{}),[k]:e.target.value}})}/><//>`)}
     <div className="span" style=${{gridColumn:'1/-1'}}><b className="sm">Remetente das etiquetas</b></div>
     ${[['nome','Nome / razão social'],['documento','CNPJ ou CPF'],['ie','Inscrição estadual (ou ISENTO)'],['telefone','Telefone'],['email','E-mail'],['cep','CEP'],['endereco','Endereço'],['numero','Número'],['complemento','Complemento'],['bairro','Bairro'],['cidade','Cidade'],['uf','UF']].map(([k,l])=>html`<${F} key=${'r'+k} l=${l}><input className="in" value=${((c.frete||{}).remetente||{})[k]??''} onChange=${e=>{const r={...((c.frete||{}).remetente||{}),[k]:e.target.value};setC({...c,frete:{...FRETE_PADRAO,...(c.frete||{}),remetente:r}});
       if(k==='cep'&&dig(e.target.value).length===8)buscaCep(dig(e.target.value)).then(x=>{if(x)setC(cc=>({...cc,frete:{...FRETE_PADRAO,...(cc.frete||{}),remetente:{...((cc.frete||{}).remetente||{}),endereco:x.logradouro,bairro:x.bairro,cidade:x.localidade,uf:x.uf}}}))}).catch(()=>{})}}/><//>`)}
     <label className="row sm" style=${{alignSelf:'end',minHeight:40}}><input type="checkbox" checked=${!!(c.frete||{}).seguro} onChange=${e=>setC({...c,frete:{...FRETE_PADRAO,...(c.frete||{}),seguro:e.target.checked}})}/> Declarar valor por padrão</label></div></div>`}
  ${aba==='etapas'&&html`<div className="card"><div className="pad sm mut">“Exige pagamento” só aceita pedidos pagos. “Exige liberação” aceita pagos ou com produção faturada autorizada. “Status” atualiza a produção ao entrar na etapa.</div><div className="scroll"><table><thead><tr><th></th><th>Nome</th><th>Cor</th><th>Exige pagamento</th><th>Exige liberação</th><th>Status de produção</th></tr></thead><tbody>
   ${c.etapas.map((e,i)=>html`<tr key=${e.id}><td className="nw"><button className="btn sm" onClick=${()=>mov(i,-1)}>↑</button> <button className="btn sm" onClick=${()=>mov(i,1)}>↓</button></td><td><input className="in" value=${e.nome} onChange=${x=>upE(i,'nome',x.target.value)}/></td>
    <td><input type="color" value=${e.cor} onChange=${x=>upE(i,'cor',x.target.value)} style=${{width:44,height:36,border:0,background:'none'}}/></td>
    <td><input type="checkbox" disabled=${e.cancela} checked=${!!e.exigePagamento} onChange=${x=>upE(i,'exigePagamento',x.target.checked)}/></td><td><input type="checkbox" disabled=${e.cancela} checked=${!!e.exigeLiberacao} onChange=${x=>upE(i,'exigeLiberacao',x.target.checked)}/></td>
    <td>${e.cancela?html`<span className="sm mut">Cancela o pedido</span>`:html`<select className="in" value=${e.status||''} onChange=${x=>upE(i,'status',x.target.value)}><option value="">Não altera</option><option value="aguardando">Aguardando</option><option value="em_producao">Em produção</option><option value="pronto">Pronto</option><option value="entregue">Entregue (baixa estoque)</option></select>`}</td></tr>`)}
   </tbody></table></div><div className="pad"><button className="btn" onClick=${()=>{const a=[...c.etapas];a.splice(a.length-1,0,{id:'e'+uid(),nome:'Nova etapa',cor:'#71717a'});setC({...c,etapas:a})}}><${Ic} n="plus" s=${14}/>Nova etapa</button></div></div>`}
  ${aba==='categorias'&&html`<div className="card"><div className="pad sm mut">O setor define qual Kanban de departamento recebe a ordem de produção.</div><div className="scroll"><table><thead><tr><th>Nome</th><th>Grupo</th><th>Setor</th></tr></thead><tbody>
   ${c.categorias.map((x,i)=>html`<tr key=${x.id}><td><input className="in" value=${x.nome} onChange=${e=>setC({...c,categorias:c.categorias.map((y,j)=>j===i?{...y,nome:e.target.value}:y)})}/></td>
    <td><select className="in" value=${x.grupo} onChange=${e=>setC({...c,categorias:c.categorias.map((y,j)=>j===i?{...y,grupo:e.target.value}:y)})}><option value="impressao">Impressão</option><option value="vestuario">Vestuário</option><option value="servico">Serviço</option><option value="outros">Outros</option></select></td>
    <td><select className="in" value=${x.setor||''} onChange=${e=>setC({...c,categorias:c.categorias.map((y,j)=>j===i?{...y,setor:e.target.value}:y)})}><option value="">Nenhum</option>${Object.entries(SETORES).map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></td></tr>`)}
   </tbody></table></div><div className="pad"><button className="btn" onClick=${()=>setC({...c,categorias:[...c.categorias,{id:'cat'+uid(),nome:'Nova categoria',grupo:'outros',setor:''}]})}><${Ic} n="plus" s=${14}/>Nova categoria</button></div></div>`}
  ${aba==='modelos'&&html`<div style=${{display:'grid',gap:10}}><div className="sm mut">Variáveis: {cliente} {pedido} {itens} {valor} {saldo} {status} {pix} {horario}. Use *texto* para negrito.</div>
   <div className="card pad" style=${{display:'grid',gap:8}}><b>Mensagem de cobrança</b><div className="sm mut">Variáveis: {cliente} {empresa} {saldo} {pedidos} {desde} {pix} {pix_copia}</div>
    <textarea className="in" style=${{minHeight:140,fontFamily:'Geist Mono,monospace',fontSize:13}} value=${c.msgCobranca||MSG_COBRANCA} onChange=${e=>setC({...c,msgCobranca:e.target.value})}></textarea></div>
   <div className="card pad" style=${{display:'grid',gap:8}}><b>Mensagem de fechamento</b><div className="sm mut">Variáveis: {periodicidade} {empresa} {cliente} {inicio} {fim} {linhas} {metros} {valor} {saldo_linha} {vencimento} {pix} {pix_copia}</div>

    <textarea className="in" style=${{minHeight:110,fontFamily:'Geist Mono,monospace',fontSize:13}} value=${m.texto} onChange=${e=>setC({...c,modelos:c.modelos.map((y,j)=>j===i?{...y,texto:e.target.value}:y)})}></textarea></div>`)}
   <button className="btn" style=${{justifySelf:'start'}} onClick=${()=>setC({...c,modelos:[...c.modelos,{id:'m'+uid(),nome:'Nova mensagem',texto:'Olá, {cliente}! '}]})}><${Ic} n="plus" s=${14}/>Nova mensagem</button></div>`}
  </fieldset>
  ${aba==='importar'&&admin&&html`<${ImportarScalle} ...${ctx}/>`}</div>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
