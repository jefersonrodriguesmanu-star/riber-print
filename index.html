<style>
/* VOICE: sistema de trabalho sério e rápido, como a mesa de produção de uma gráfica.
   IDEA: a ordem de serviço / ficha de produção DTF — cada pedido é um ticket com rolo, metros e status.
   PICTURE: o próprio trabalho (Kanban, pedido, dashboard) ocupa a tela.
   COLOUR and TYPE: preto, branco e grafite com vermelho RIBER como destaque; Geist.
   LAYOUT: menu lateral recolhível + área de trabalho; empilha abaixo de 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f4f5,#0b0b0d);--card:light-dark(#ffffff,#131316);--ink:light-dark(#0a0a0b,#f4f4f5);--mut:light-dark(#71717a,#a1a1aa);
--line:light-dark(#e4e4e7,#26262b);--soft:light-dark(#f4f4f5,#1b1b1f);--side:light-dark(#ffffff,#000000);--sidetx:light-dark(#52525b,#a1a1aa);--sidehv:light-dark(#f4f4f5,#18181b);--sideon:light-dark(#fbeefa,#1c1c20);--sidebd:light-dark(#e4e4e7,#1f1f23);--sidestrong:light-dark(#18181b,#ffffff);--acc:light-dark(#a3089a,#d23fc2);--acc2:light-dark(#86067f,#e35fd5);--grad:linear-gradient(90deg,#0470dc,#6106c4 25%,#ad03a1 48%,#ce0d13 70%,#e6600d 86%,#f8a50a);--red:#e11d2e;--red2:light-dark(#c4111f,#ff3b4c);
--ok:light-dark(#15803d,#4ade80);--warn:light-dark(#b45309,#fbbf24);--info:light-dark(#1d4ed8,#60a5fa);--vio:light-dark(#6d28d9,#a78bfa)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}:root[data-modo=light]{color-scheme:light}:root[data-modo=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.tab{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);color:var(--sidestrong);border-right:1px solid var(--sidebd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s}
.side.min{width:64px}.side .brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--sidebd)}
.logo{width:34px;height:34px;border-radius:9px;background:#000 center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.5px;color:#fff;flex:none}
.side nav{padding:10px 8px;overflow-y:auto;flex:1;min-height:0}.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#71717a;padding:12px 10px 4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--sidetx);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left;min-height:38px}
.nv:hover{background:var(--sidehv);color:var(--sidestrong)}.nv.on{background:var(--sideon);color:var(--sidestrong)}.nv.on svg{color:var(--acc)}.nv.on{box-shadow:inset 3px 0 0 #d23fc2}.nv svg{width:18px;height:18px;flex:none}
.side.min .lbl,.side.min .grp{display:none}.side.min .nv{justify-content:center}
.main{flex:1;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 20px;background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{padding:22px clamp(14px,2.5vw,32px);max-width:1440px;width:100%;margin:0 auto}
h1{font-size:24px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}h2{font-size:16px;margin:0}
.sub{color:var(--mut);font-size:13.5px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 14px;min-height:38px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:var(--acc2)}
.btn.d{color:var(--red2)}.btn.sm{min-height:32px;padding:0 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn svg{width:16px;height:16px}
.in{width:100%;min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in oklab,var(--acc) 20%,transparent)}textarea.in{min-height:70px;resize:vertical}
.lb{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin-bottom:5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.b-ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}.b-warn{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn)}
.b-red{background:color-mix(in oklab,var(--red) 14%,transparent);color:var(--red2)}.b-info{background:color-mix(in oklab,var(--info) 14%,transparent);color:var(--info)}.b-vio{background:color-mix(in oklab,var(--vio) 15%,transparent);color:var(--vio)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr.hov:hover td{background:var(--soft);cursor:pointer}.r{text-align:right}.nw{white-space:nowrap}
.scroll{overflow-x:auto}.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:600}
.kpi{padding:14px 16px}.kpi .v{font-size:clamp(20px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;margin-top:4px}.kpi .t{font-size:12.5px;color:var(--mut);font-weight:500}
.delta{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:6px}
.hero{background:#000;color:#fff;border-color:#1f1f23;position:relative;overflow:hidden}.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}.brandlogo{display:block;width:100%;max-width:190px;height:auto}.side.min .brandlogo{display:none}.side:not(.min) .logo{display:none}.hero .t,.hero .mut{color:#a1a1aa}
.bars{display:flex;align-items:flex-end;gap:3px;height:220px;padding-top:8px}.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bars span{display:block;background:var(--acc);border-radius:4px 4px 1px 1px;min-height:2px}.bars>div:hover span{filter:brightness(1.15)}
.hbar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.hbar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;min-height:calc(100vh - 210px);align-items:flex-start}
.col{width:282px;flex:none;background:var(--soft);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.over{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 6%,var(--soft))}.col .h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13.5px;font-weight:600}
.col .bd{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.tk{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;cursor:grab;position:relative}
.tk:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}.tk.urg{border-left:3px solid var(--red)}
.kbslot{border-radius:11px;transition:box-shadow .1s}.kbslot.antes{box-shadow:0 -3px 0 0 var(--acc,#d946ef)}.kbslot.depois{box-shadow:0 3px 0 0 var(--acc,#d946ef)}.tk.alta{border-left:3px solid var(--warn)}
.dot{width:9px;height:9px;border-radius:9px;flex:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal>.card{width:100%;max-width:760px;animation:up .2s ease-out}.modal>.card.lg{max-width:1100px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--side);color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.25)}.toast .e{background:#7f1d1d}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.itm{border:1px solid var(--line);border-radius:11px;padding:10px;display:grid;gap:8px;grid-template-columns:minmax(0,4fr) minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,1.2fr) auto;align-items:center}
.itm.err{border-color:var(--red2)}
.res{position:absolute;top:44px;left:0;right:0;z-index:30;max-height:360px;overflow-y:auto;padding:6px}
.res button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}.res button:hover{background:var(--soft)}
.empty{padding:48px 16px;text-align:center;color:var(--mut)}
.hide-s{}.burger{display:none}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.side{position:fixed;z-index:50;left:0;transform:translateX(-100%);transition:transform .2s;width:250px}.side.open{transform:none}.side.min{width:250px}
.side.min .lbl,.side.min .grp{display:revert}.burger{display:inline-flex}.g3,.g2{grid-template-columns:minmax(0,1fr)}
.itm{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.itm>:first-child{grid-column:1/-1}.hide-s{display:none}}
@media(max-width:600px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:13px}td,th{padding:9px 8px}}
@media print{.side,.top,.noprint{display:none!important}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

 let pl=f('00','01')+f('26',conta)+f('52','0000')+f('53','986')+(valor>0?f('54',Number(valor).toFixed(2)):'')+f('58','BR')+f('59',(semAcento(E.pixNome||E.nome)||'RECEBEDOR').slice(0,25))+f('60',(semAcento(E.pixCidade||E.cidade)||'FRANCA').slice(0,15))+f('62',f('05',tx))+'6304';
 return pl+crc16(pl)}
function qrSvg(texto,tam){if(!texto||typeof qrcode!=='function')return'';const q=qrcode(0,'M');q.addData(texto);q.make();const n=q.getModuleCount(),m=4,t=n+m*2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
 return'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+(tam||200)+'" height="'+(tam||200)+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
const qrUri=(t,tam)=>{const s=qrSvg(t,tam);return s?'data:image/svg+xml;base64,'+btoa(s):''};
function PixDlg({cfg,valor,txid,titulo,onClose}){const cc=pixCopiaCola(cfg.empresa,valor,txid);const [ok,setOk]=useState(false);
 const copiar=async()=>{try{await navigator.clipboard.writeText(cc);setOk(true);setTimeout(()=>setOk(false),2000)}catch(e){}};
 return html`<${Modal} title=${titulo||'PIX'} sub=${moeda(valor)+' · chave '+(cfg.empresa.pix||'não cadastrada')} onClose=${onClose}>${!cc?html`<div className="sm">Cadastre a chave PIX em Configurações → Empresa.</div>`:html`<div style=${{display:'grid',gap:12,justifyItems:'center'}}>
  <img src=${qrUri(cc,240)} width="240" height="240" alt="QR Code PIX" style=${{borderRadius:8,border:'1px solid var(--line)'}}/>
  <textarea className="in" readOnly style=${{width:'100%',fontFamily:'Geist Mono,monospace',fontSize:12,minHeight:84}} value=${cc} onFocus=${e=>e.target.select()}></textarea>
  <button className="btn p" onClick=${copiar}>${ok?'Copiado!':'Copiar PIX copia e cola'}</button><div className="sm mut">O cliente paga escaneando o QR ou colando o código no app do banco; o valor já vem preenchido.</div></div>`}<//>`}

const ONLINE=()=>!!window.RP_HOSTED;
const cepCache={};
async function buscaCep(c){if(!ONLINE())return null;if(cepCache[c]!==undefined)return cepCache[c];const r=await fetch('https://viacep.com.br/ws/'+c+'/json/');if(!r.ok)throw new Error('cep');const j=await r.json();return cepCache[c]=j&&!j.erro?j:null}
/* CNPJ: BrasilAPI (Receita Federal) com reserva no CNPJ.ws; devolve os dados já no formato dos cadastros */
const cnpjCache={};
async function buscaCnpj(v){const c=dig(v);if(c.length!==14||!docValido(c))return null;if(cnpjCache[c])return cnpjCache[c];
 const tel=(d,n)=>dig((d||'')+(n||''));let r=null;
 try{const x=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+c);if(x.status===404)return null;if(x.ok){const j=await x.json();
   r={nome:j.razao_social||'',fantasia:j.nome_fantasia||'',cep:dig(j.cep),endereco:[j.descricao_tipo_de_logradouro,j.logradouro].filter(Boolean).join(' ').trim(),numero:j.numero||'',complemento:j.complemento||'',bairro:j.bairro||'',cidade:j.municipio?j.municipio.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()).replace(/ (D[aeo]s?) /gi,m=>m.toLowerCase()):'',uf:j.uf||'',telefone:dig(j.ddd_telefone_1),email:(j.email||'').toLowerCase(),situacao:j.descricao_situacao_cadastral||'',ie:''}}}catch(e){}
 if(!r)try{const x=await fetch('https://publica.cnpj.ws/cnpj/'+c);if(x.status===404)return null;if(x.ok){const j=await x.json();const e=j.estabelecimento||{};const ie=(e.inscricoes_estaduais||[]).find(i=>i.ativo&&(!e.estado||i.estado?.sigla===e.estado.sigla));
   r={nome:j.razao_social||'',fantasia:e.nome_fantasia||'',cep:dig(e.cep),endereco:[e.tipo_logradouro,e.logradouro].filter(Boolean).join(' ').trim(),numero:e.numero||'',complemento:e.complemento||'',bairro:e.bairro||'',cidade:e.cidade?.nome||'',uf:e.estado?.sigla||'',telefone:tel(e.ddd1,e.telefone1),email:(e.email||'').toLowerCase(),situacao:e.situacao_cadastral||'',ie:ie?.inscricao_estadual||''}}}catch(e){}
 if(!r)throw new Error('cnpj');return cnpjCache[c]=r}
/* Hook: quando o CNPJ digitado fica completo e válido, consulta e chama aplicar(dados). */
function useCnpj(doc,inicial,aplicar){const [msg,setMsg]=useState('');const ult=useRef(dig(inicial||''));const [n,setN]=useState(0);const c=dig(doc);
 useEffect(()=>{if(c.length!==14||!docValido(c)||(c===ult.current&&!n))return;ult.current=c;let vivo=true;setMsg('Buscando dados do CNPJ…');
  buscaCnpj(c).then(r=>{if(!vivo)return;if(!r){setMsg('CNPJ não encontrado na Receita. Preencha os dados.');return}aplicar(r);
   setMsg('Dados preenchidos pela Receita Federal'+(r.situacao&&!/ativa/i.test(r.situacao)?' · ATENÇÃO: situação '+r.situacao:''))}).catch(()=>vivo&&setMsg('Não foi possível consultar o CNPJ agora. Tente de novo em instantes.'));return()=>{vivo=false}},[c,n]);
 return [msg,c.length===14&&docValido(c)?()=>setN(x=>x+1):null]}

async function cotarFrete(body){const sb=window.RP_SB;if(!sb)throw new Error('Cotação disponível só na versão hospedada');

const somaQtd=t=>{const s=String(t??'').trim();if(!s.includes('+'))return pn(s);return r3(s.split('+').reduce((a,x)=>a+pn(x),0))};
/* custo de um item: custo do produto/variação, senão custo padrão por metro (Custos) para DTF */
const custoItem=(prod,v,cfg,unidade)=>{const c=Number(v&&v.custo||prod&&prod.custo||0);if(c>0)return c;const k=cfg&&cfg.custos;if(k&&prod&&prod.tipoDtf){const m=(Number(k.porMetro)||0)+(Number(k.outros)||0);return unidade==='centimetro'?m/100:m}return 0};
const metrosItem=i=>i.unidade==='centimetro'?i.qtd/100:(i.unidade==='metro_linear'||i.unidade==='metro_quadrado')?i.qtd:0;
function totais(itens,frete,desconto,extra){
 let p=0,s=0,di=0,c=0,mt=0,mu=0,pc=0;
 for(const i of itens){const st=r2(i.qtd*i.preco-(i.desconto||0));if(i.grupo==='servico')s+=st;else p+=st;di+=Number(i.desconto)||0;c+=r2((i.custo||0)*i.qtd);
  if(i.tipoDtf==='textil')mt+=metrosItem(i);if(i.tipoDtf==='uv')mu+=metrosItem(i);if(i.grupo==='vestuario'&&i.unidade==='unidade')pc+=i.qtd}
 const total=extra&&extra.cortesia?0:Math.max(0,r2(p+s-(+desconto||0)+(+frete||0)));c=r2(c+(Number(extra&&extra.custoExtra)||0));
 return{produtos:r2(p),servicos:r2(s),descItens:r2(di),total,custo:r2(c),lucro:r2(total-c),margem:total>0?r2((total-c)/total*100):0,mt,mu,pecas:pc}}
function erroItem(i,prod,disp){
 if(!i.produtoId)return'Selecione o produto';if(!(i.qtd>0))return'Quantidade inválida';
 if(i.unidade==='unidade'&&!Number.isInteger(i.qtd))return'Peças: quantidade inteira';
 if(i.desconto>r2(i.qtd*i.preco))return'Desconto maior que o item';
 if(prod&&prod.variacoes&&!i.varianteId)return'Escolha cor/tamanho';
 if(disp!=null&&i.qtd>disp)return'Estoque disponível: '+disp;return null}
/* Recalcula tudo que deriva do pedido (o equivalente aos gatilhos do banco). */
const ID_LOJA=['c-loja-propria','c-sc-6a5a342958e9900b29081b0e'];
const ehLojaPropria=(id,nome)=>ID_LOJA.includes(id)||/^riber print\b/.test(norm(nome||''));
function normalizar(p,quem){
 if((p.canal==='mercadolivre'||/mercado ?livre/.test(norm(p.clienteNome||'')))&&(!p.entrega||p.entrega==='retirada'))p={...p,canal:p.canal||'mercadolivre',entrega:'mercado_livre'};
 if(!p.cancelado&&p.origem!=='scalle'&&ehLojaPropria(p.clienteId,p.clienteNome)&&!(p.interno&&p.cortesia))p={...p,interno:true,cortesia:true,autorizado:true,historico:[...(p.historico||[]),{em:new Date().toISOString(),por:quem,tipo:'financeiro',obs:'Pedido da loja própria RIBER PRINT: não fatura, só baixa matéria-prima'}]};
 const t=totais(p.itens||[],p.frete,p.desconto,{cortesia:p.cortesia,custoExtra:p.custoExtra});
 const pago=r2(sum((p.pagamentos||[]).filter(x=>!x.estornado),x=>x.valor));
 const fin=p.cancelado?'cancelado':(t.total>0&&pago>=t.total)||(p.cortesia&&t.total===0)?'pago':pago>0?'parcial':p.autorizado?'faturado':'pendente';
 const hist=[...(p.historico||[])];
 if(p.statusFin&&p.statusFin!==fin)hist.push({em:new Date().toISOString(),por:quem,tipo:'financeiro',de:p.statusFin,para:fin});
 let ordens={...(p.ordens||{})};let statusProd=p.statusProd||'aguardando';
 const liberado=!p.cancelado&&(fin==='pago'||p.autorizado);
 if(liberado){const setores=[...new Set((p.itens||[]).map(i=>i.setor).filter(s=>s&&SETORES[s]))];
  for(const s of setores)if(!ordens[s])ordens[s]='pendente';
  for(const s of Object.keys(ordens))if(!setores.includes(s)&&ordens[s]==='pendente')delete ordens[s];
  const vals=Object.values(ordens);
  if(vals.length&&vals.every(v=>v==='concluida')&&['aguardando','em_producao'].includes(statusProd))statusProd='pronto';
  else if(vals.some(v=>v==='em_andamento'||v==='concluida')&&statusProd==='aguardando')statusProd='em_producao'}
 if(p.cancelado){statusProd='cancelado';for(const s in ordens)if(ordens[s]!=='concluida')delete ordens[s]}
 const producaoEm=p.producaoEm||(EM_PROD.includes(statusProd)&&!EM_PROD.includes(p.statusProd||'aguardando')?new Date().toISOString():undefined);
 return{...p,...(producaoEm?{producaoEm}:{}),totais:t,total:t.total,pago,saldo:r2(t.total-pago),statusFin:fin,ordens,statusProd,historico:hist,dia:diaSP(p.criadoEm)}}
/* Reservas de vestuário: calculadas a partir dos pedidos em aberto (nunca duplicam). */
function reservas(pedidos,excetoId){const m={};for(const p of pedidos){if(p.cancelado||p.baixaEstoque||p.id===excetoId)continue;for(const i of p.itens||[])if(i.varianteId)m[i.varianteId]=(m[i.varianteId]||0)+i.qtd}return m}

/* ---------------- dados: assinatura das coleções ---------------- */
function useCol(db,path,ordem){
 const [st,setSt]=useState({rows:[],ok:false,err:null});
 useEffect(()=>{if(!db)return;let q=db.collection(path);if(ordem)q=q.orderBy(ordem[0],ordem[1]).limit(1000);
  const t=setTimeout(()=>setSt(s=>s.ok?s:{...s,err:'lento'}),10000);
  const un=q.onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(t);setSt({rows:s.docs.map(d=>({...d.data(),id:d.id})),ok:true,err:null})},e=>{clearTimeout(t);setSt(s=>({...s,ok:true,err:e.code}))});
  return()=>{clearTimeout(t);un()}},[db,path]);
 return st}
/* coleções grandes: páginas de 1000 encadeadas pelo campo de ordem */
function useColTudo(db,path,campo){
 const [pg,setPg]=useState([]);const [cur,setCur]=useState([null]);const [ok,setOk]=useState(false);const [err,setErr]=useState(null);const okR=useRef(false);
 useEffect(()=>{if(!db)return;setPg(a=>a.length>cur.length?a.slice(0,cur.length):a);const uns=cur.map((c,k)=>{let q=db.collection(path);if(c)q=q.where(campo,'<',c);q=q.orderBy(campo,'desc').limit(1000);
   return q.onSnapshot(s=>{const rows=s.docs.map(d=>({...d.data(),id:d.id}));setPg(a=>{const b=[...a];b[k]=rows;return b});
    if(k===0)setOk(true);if(rows.length===1000){const u=rows[rows.length-1][campo];if(u&&u!==c)setCur(x=>x[k+1]===u?x:[...x.slice(0,k+1),u])}},e=>{setOk(true);setErr(e.code)})});
  const t=setTimeout(()=>{if(!okR.current)setErr(x=>x||'lento')},10000);return()=>{clearTimeout(t);uns.forEach(u=>u())}},[db,path,cur.join('|')]);
 okR.current=ok;
 const rows=useMemo(()=>{const m=new Map();for(const a of pg)for(const r of a||[])m.set(r.id,r);return[...m.values()].sort((a,b)=>(b[campo]||'').localeCompare(a[campo]||''))},[pg]);
 return{rows,ok,err}}
function useDoc(db,path){
 const [st,setSt]=useState({data:null,ok:false});
 useEffect(()=>{if(!db)return;const un=db.doc(path).onSnapshot(s=>setSt({data:s.exists?s.data():null,ok:true}),()=>setSt(x=>({...x,ok:true})));return un},[db,path]);
 return st}

async function proximoNumero(db,pedidos){
 const ref=db.doc('contadores/pedidos');const maxLocal=Math.max(1000,...pedidos.map(p=>p.numero||0));
 for(let t=0;t<6;t++){const r=await ref.acquire({holder:TAB,ttlMs:5000});
  if(r.acquired){const s=await ref.get();const n=Math.max(maxLocal,(s.exists&&s.data().ultimo)||1000)+1;await ref.set({ultimo:n});return n}
  await new Promise(k=>setTimeout(k,350+Math.random()*400))}
 return maxLocal+1}

async function moverPedido({db,p,etapa,me,pode,produtos,toast,abrir}){
 if(p.etapaId===etapa.id)return;
 if(!pode('mover'))return toast('Você não tem permissão para mover pedidos.',1);
 if(p.cancelado&&!etapa.cancela)return toast('Pedido #'+p.numero+' está cancelado.',1);
 if(etapa.exigePagamento&&p.statusFin!=='pago')return toast('Pedido #'+p.numero+' não está pago. Registre o pagamento antes de mover para "'+etapa.nome+'".',1);
 if(etapa.exigeLiberacao&&!(p.statusFin==='pago'||p.autorizado))return toast('Pedido #'+p.numero+' não liberado: registre o pagamento ou autorize a produção faturada.',1);
 const agora=new Date().toISOString();let np={...p,etapaId:etapa.id,etapaDesde:agora,historico:[...(p.historico||[]),{em:agora,por:me,tipo:'etapa',de:p.etapaId,para:etapa.id}]};
 if(etapa.cancela){if(!pode('cancelar'))return toast('Sem permissão para cancelar.',1);if(p.pago>0)return toast('Estorne os pagamentos antes de cancelar.',1);np.cancelado={em:agora,por:me,motivo:'Movido para '+etapa.nome}}
 if(etapa.status&&!etapa.cancela)np.statusProd=etapa.status;
 if(!p.producaoEm&&EM_PROD.includes(np.statusProd)&&!EM_PROD.includes(p.statusProd||'aguardando'))np.producaoEm=agora;
 try{
  if(np.statusProd==='entregue'&&!p.baixaEstoque){ // baixa definitiva do vestuário na entrega
   const porProd={};for(const i of p.itens)if(i.varianteId)(porProd[i.produtoId]=porProd[i.produtoId]||[]).push(i);
   for(const pid in porProd){const pr=produtos.find(x=>x.id===pid);if(!pr||!pr.controlaEstoque)continue;
    const variantes=(pr.variantes||[]).map(v=>{const q=sum(porProd[pid].filter(i=>i.varianteId===v.id),i=>i.qtd);return q?{...v,estoque:Number(v.estoque||0)-q}:v});
    const mov=[...(pr.movimentos||[]),...porProd[pid].map(i=>({em:agora,var:i.varianteId,q:-i.qtd,tipo:'venda',ref:'#'+p.numero}))].slice(-200);
    await db.doc('produtos/'+pid).update({variantes,movimentos:mov})}
   np.baixaEstoque=true;np.entregueEm=agora}
  const {id:_x,...c}=normalizar(np,me);await db.doc('pedidos/'+p.id).set(c);toast('#'+p.numero+' → '+etapa.nome);
  if(ONLINE()&&abrir&&np.entrega&&np.entrega!=='retirada'&&!np.cancelado&&['pronto','entregue'].includes(c.statusProd)&&!(p.etiqueta&&p.etiqueta.id))abrir('etiqueta',p.id)}
 catch(e){toast('Erro ao mover: '+(e.message||e.code),1)}}

const SET_IMP=['dtf_textil','dtf_uv'];
const impressoP=p=>!!p.impressoEm||(SET_IMP.some(s=>p.ordens&&p.ordens[s])&&SET_IMP.every(s=>!(p.ordens&&p.ordens[s])||p.ordens[s]==='concluida'));
const metrosP=p=>(p.totais?.mt||0)+(p.totais?.mu||0);
const durTxt=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m<60?m+' min':Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
function FilaMaquinas(ctx){
 const {pedidos,maquinas=[],cfg,pode,toast,abrir,db,me}=ctx;
 const [agora,setAgora]=useState(Date.now());useEffect(()=>{const t=setInterval(()=>setAgora(Date.now()),20000);return()=>clearInterval(t)},[]);
 const [alvo,setAlvo]=useState(null);const drag=useRef(null);const [q,setQ]=useState('');const [gerando,setGerando]=useState('');const [rel,setRel]=useState(null);
 const hojeSP=diaSP();const impDia=(m,d0,d1)=>pedidos.filter(p=>p.impressoEm&&!p.cancelado&&(m===undefined||(p.maquinaId||'')===m)&&diaSP(p.impressoEm)>=d0&&diaSP(p.impressoEm)<=d1);
 const maqs=maquinas.filter(m=>m.ativo!==false&&m.status!=='inativa').sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR',{numeric:true}));
 const idsMaq=new Set(maqs.map(m=>m.id));
 const naMaq=p=>!p.cancelado&&p.origem!=='scalle'&&!impressoP(p)&&metrosP(p)>0&&(p.etapaId==='imprimindo'||naFila(p));
 const todos=pedidos.filter(naMaq).filter(p=>!q||String(p.numero).includes(dig(q)||'~')||norm(p.clienteNome).includes(norm(q)));
 const ordem=(a,b)=>(a.etapaId==='imprimindo'?0:1)-(b.etapaId==='imprimindo'?0:1)||ORD_KB(a)-ORD_KB(b)||a.numero-b.numero;
 const colunas=[{id:'',nome:'Fila consolidada',sub:'Pedidos ainda sem máquina',cor:'#71717a'},...maqs.map(m=>({id:m.id,nome:m.nome,sub:[m.fabricante,m.modelo].filter(Boolean).join(' · '),cor:m.status==='operando'?'#16a34a':'#f59e0b',m}))];
 const daCol=id=>todos.filter(p=>(idsMaq.has(p.maquinaId)?p.maquinaId:'')===id).sort(ordem);
 const etapa=id=>cfg.etapas.find(e=>e.id===id);
 const proxEtapa=()=>{const i=cfg.etapas.findIndex(e=>e.id==='imprimindo');const r=cfg.etapas.slice(i+1).find(e=>!e.cancela);return r||null};
 const salvarP=async(np,msg)=>{const {id:_x,...c}=normalizar(np,me);await db.doc('pedidos/'+np.id).set(c);msg&&toast(msg)};
 const mover=async(p,colId,ref,depois)=>{setAlvo(null);if(!pode('mover'))return toast('Você não tem permissão para mexer na fila.',1);
  const lista=daCol(colId).filter(x=>x.id!==p.id);let i=ref?lista.findIndex(x=>x.id===ref.id):lista.length;if(i<0)i=lista.length;if(ref&&depois)i++;lista.splice(i,0,p);
  try{const atualCol=idsMaq.has(p.maquinaId)?p.maquinaId:'';
   if(atualCol!==colId){const m=maqs.find(x=>x.id===colId);if(p.etapaId==='imprimindo'&&!colId)return toast('#'+p.numero+' está imprimindo. Marque como impresso ou volte para a fila antes.',1);
    await db.doc('pedidos/'+p.id).update({maquinaId:colId||null,maquinaNome:m?m.nome:null,historico:[...(p.historico||[]),{em:new Date().toISOString(),por:me,tipo:'producao',obs:colId?'Fila da '+m.nome:'Voltou para a fila consolidada'}]})}
   {const k=lista.indexOf(p);const sem=lista.filter(x=>x.id!==p.id);await db.doc('pedidos/'+p.id).update({ordemKb:chaveEntre(sem,k)})}
   toast('#'+p.numero+' → '+(colunas.find(c=>c.id===colId)?.nome||'')+' ('+(lista.indexOf(p)+1)+'º)')}catch(e){toast('Erro: '+(e.message||e.code),1)}};
 const imprimir=async(p,m)=>{if(!pode('mover'))return toast('Sem permissão.',1);const e=etapa('imprimindo');if(!e)return toast('Crie a etapa "Imprimindo" nas configurações.',1);
  const setor=m&&m.tipo==='uv'?'dtf_uv':'dtf_textil';const ag=new Date().toISOString();
  const np={...p,maquinaId:m.id,maquinaNome:m.nome,imprimindoEm:ag,ordens:{...(p.ordens||{}),...(p.ordens&&p.ordens[setor]?{[setor]:'em_andamento'}:{})}};
  if(p.etapaId==='imprimindo')return salvarP(np,'#'+p.numero+' imprimindo na '+m.nome);

function obsTyped(t){t=String(t||'').trim();if(!t||/^Impressão da loja própria/.test(t))return '';
 return t.split(' · ').map(x=>x.trim()).filter(x=>x&&!/^Pedido com artes montado no sistema$/.test(x)&&!/^Pedido online nº ?\d+$/.test(x)&&!/^artes: /.test(x)&&!/\.(png|jpe?g|pdf) \(/i.test(x)&&!/^Obs\. do cliente:/.test(x)&&!/^FRETE GRÁTIS para o cliente/.test(x)).join(' · ')}
function ObsPed({p,max=3}){const t=String(p.obsCliente||'').trim();if(!t)return null;
 return html`<div className="sm" title=${'Obs. para o cliente: '+t} style=${{marginTop:6,padding:'5px 7px',borderRadius:7,background:'rgba(250,204,21,.14)',border:'1px solid rgba(234,179,8,.35)',display:'-webkit-box',WebkitLineClamp:max,WebkitBoxOrient:'vertical',overflow:'hidden',whiteSpace:'pre-wrap',wordBreak:'break-word'}}>📝 ${t}</div>`}
function Cartao({x,vis,cols,pode,abrir,onDrag,onMover}){const p=x.p;const ops=Object.values(p.ordens||{});const pc=ops.length?Math.round(ops.filter(o=>o==='concluida').length/ops.length*100):null;

  ${pc!=null&&vis==='geral'&&html`<div className="hbar" style=${{marginTop:8,height:5}}><i style=${{width:pc+'%'}}></i></div>`}
  <div className="row sm mut" style=${{marginTop:7,gap:8}}><span className="row" style=${{gap:3}} title="Tempo na etapa"><${Ic} n="clk" s=${12}/>${decorrido(p.etapaDesde)}</span>

  ${lista.length===0?html`<${Empty} t="Nenhum cliente" s=${clientes.length?'Ajuste a busca.':'Cadastre o primeiro cliente.'} a=${pode('clientes')&&!clientes.length&&html`<button className="btn p" onClick=${()=>setForm({t:'cliente'})}>Novo cliente</button>`}/>`:html`

/* Unidade de compra (embalagem): ex. 1 rolo = 100 m. O estoque e o custo continuam na unidade de medida (m); a embalagem só facilita digitar e ler. */
const EMB_UN=['rolo','bobina','galão','frasco','litro','caixa','saco','pacote','balde','kit'];

async function movimentarInsumo(db,insId,delta,mov){const ref=db.doc('insumos/'+insId);

 return html`<div><div className="row between" style=${{marginBottom:14}}><div><h1>Descartes e qualidade</h1><div className="sub">${pct(tot?td/tot*100:null)} de desperdício · ${num(td)} m de ${num(tot)} m impressos</div></div>

/* Encaixe otimizado no rolo (strip packing): skyline "mais baixo primeiro", com rotação, várias ordenações; fica com a menor metragem. */
function encaixar(itens,W,espaco,borda){
 // itens: [{w,h,qtd,girar,ref}] em cm. Cada peça ganha o espaço entre artes; a largura útil ganha o mesmo espaço (a última peça não precisa dele).
 const util=W-2*borda+espaco;const base=[];
 for(const it of itens){for(let k=0;k<Math.min(it.qtd,3000);k++)base.push({w:it.w+espaco,h:it.h+espaco,ow:it.w,oh:it.h,girar:it.girar!==false,ref:it.ref})}

 const ordens=[(a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h,(a,b)=>b.h-a.h||b.w-a.w,(a,b)=>b.w-a.w||b.h-a.h,(a,b)=>b.w*b.h-a.w*a.h,(a,b)=>(b.w+b.h)-(a.w+a.h)];
 let melhor=null;
 for(const ord of ordens)for(const modo of ['livre','deitado','em_pe']){
  const ps=base.map(p=>({...p}));
  // orientação preferida por modo (livre = a que encaixa melhor em cada posição)
  ps.sort(ord);const sky=[{x:0,y:0,w:util}];const out=[];
  for(const p of ps){let best=null;const oris=[];const o1={w:p.w,h:p.h,r:false},o2={w:p.h,h:p.w,r:true};
   if(modo==='livre'){oris.push(o1);if(p.girar)oris.push(o2)}else{const deit=p.w>=p.h?o1:o2,pe=p.w>=p.h?o2:o1;const pref=modo==='deitado'?deit:pe;if(p.girar||pref===o1)oris.push(pref);if(!oris.includes(o1))oris.push(o1)}
   for(const o of oris){if(o.w>util+1e-9)continue;
    for(let i=0;i<sky.length;i++){const x=sky[i].x;if(x+o.w>util+1e-9)break;let y=0,j=i,rest=o.w;while(rest>1e-9&&j<sky.length){y=Math.max(y,sky[j].y);rest-=sky[j].w;j++}
     if(rest>1e-9)continue;const topo=y+o.h;

     let perda=0;rest=o.w;j=i;while(rest>1e-9&&j<sky.length){const ww=Math.min(rest,sky[j].w);perda+=ww*(y-sky[j].y);rest-=ww;j++}
     const c={x,y,o,topo,perda};if(!best||c.topo<best.topo-1e-9||(Math.abs(c.topo-best.topo)<1e-9&&(c.perda<best.perda-1e-9||(Math.abs(c.perda-best.perda)<1e-9&&c.x<best.x))))best=c}}
   if(!best)return{erro:p.ref,comp:0,pecas:[]};
   const {x,y,o}=best;out.push({x,y,w:o.w-espaco,h:o.h-espaco,rot:o.r,ref:p.ref});
   // atualiza o skyline
   const nx=x+o.w,ns=[];for(const s of sky){const sx2=s.x+s.w;if(sx2<=x+1e-9||s.x>=nx-1e-9){ns.push(s);continue}if(s.x<x)ns.push({x:s.x,y:s.y,w:x-s.x});if(sx2>nx)ns.push({x:nx,y:s.y,w:sx2-nx})}
   ns.push({x,y:y+o.h,w:o.w});ns.sort((a,b)=>a.x-b.x);const m=[];for(const s of ns){const l=m[m.length-1];if(l&&Math.abs(l.y-s.y)<1e-9&&Math.abs(l.x+l.w-s.x)<1e-9)l.w+=s.w;else m.push({...s})}sky.length=0;sky.push(...m)}
  const comp=Math.max(0,...out.map(p=>p.y+p.h));if(!melhor||comp<melhor.comp-1e-9)melhor={comp,pecas:out}}
 // uma arte só (o mais comum): testa combinar fileiras em pé e deitadas e fica com a menor
 if(itens.length===1&&base.length>0){const it=itens[0],n=base.length;const A={w:it.w+espaco,h:it.h+espaco,r:false},B={w:it.h+espaco,h:it.w+espaco,r:true};const oris=it.girar===false?[A]:[A,B];

     for(let r=0;r<rb&&k<n;r++){for(let c=0;c<pb&&k<n;c++,k++)out.push({x:c*Q.w,y,w:Q.w-espaco,h:Q.h-espaco,rot:Q.r,ref:it.ref});y+=Q.h}melhor={comp,pecas:out}}}}}

 if(modo==='corte'){const prateleira=orient=>{const its=[];for(const e of todos){const rot=orient(e);for(let k=0;k<e.qtd;k++)its.push({w:rot?e.alt:e.larg,h:rot?e.larg:e.alt,rot,ref:e})}
   its.sort((a,b)=>b.h-a.h||String(a.ref.arquivo).localeCompare(String(b.ref.arquivo)));const pecas=[],cortes=[];let x=0,y=0,rh=0;
   for(const it of its){if(x>0&&x+it.w>W+1e-9){y+=rh+esp;cortes.push(y-esp/2);x=0;rh=0}pecas.push({x,y,w:it.w,h:it.h,rot:it.rot,ref:it.ref});x+=it.w+esp;rh=Math.max(rh,it.h)}return{pecas,comp:y+rh,cortes,blocos:[]}};

    e=>{const n0=cabe(e.larg)?Math.floor((W+esp)/(e.larg+esp)):0,n1=cabe(e.alt)?Math.floor((W+esp)/(e.alt+esp)):0;const l0=n0?Math.ceil(e.qtd/n0)*(e.alt+esp):1e9,l1=n1?Math.ceil(e.qtd/n1)*(e.larg+esp):1e9;return l1<l0})}

   for(const p of r.pecas)pecas.push({...p,y:p.y+y0});blocos.push({y:y0,h:r.comp,nome:g.nome});y0+=r.comp+esp}return{pecas,comp:Math.max(0,y0-esp),cortes:blocos.slice(1).map(b=>b.y-esp/2),blocos}}

 const rotaMaps=lst=>{const ends=lst.slice(0,9).map(p=>{const e=endEntrega(p,cliDe(p));return e.lat&&e.lng?e.lat+','+e.lng:[e.linha,e.bairro,e.cidade].filter(Boolean).join(', ')});if(!ends.length)return '';const orig=cfg.empresa?.endereco?cfg.empresa.endereco+', '+((cfg.portal?.entrega?.cidades||['Franca'])[0]):'';return 'https://www.google.com/maps/dir/?api=1'+(orig?'&origin='+encodeURIComponent(orig):'')+'&destination='+encodeURIComponent(ends[ends.length-1])+(ends.length>1?'&waypoints='+encodeURIComponent(ends.slice(0,-1).join('|')):'')+'&travelmode=driving'};

   <div className="row" style=${{flexWrap:'wrap',gap:6}}>

 const n=waNum(whats||p.clienteWhats||'');const u='https://wa.me/'+(n||'')+'?text='+encodeURIComponent(msgAcomp(p,cfg,link));if(w)w.location=u;else location.href=u;toast('Link de acompanhamento copiado'+(n?' e aberto no WhatsApp':''))}catch(e){if(w)w.close();toast('Erro: '+(e.message||e.code),1)}}

function ContagemEstoque({db,insumos,contagens=[],cfg,pode,me,toast}){const [grp,setGrp]=useState('todos');const [cont,setCont]=useState({});const [obs,setObs]=useState('');const [s,setS]=useState(false);const [conf,setConf]=useState(false);const [ver,setVer]=useState(null);

 const mudou=linhas.filter(l=>l.dif!=null&&Math.abs(l.dif)>0.0005),contados=linhas.filter(l=>l.c!=null);

 const aplicar=async()=>{setConf(false);if(!contados.length)return toast('Digite pelo menos uma contagem',1);setS(true);
  try{const n=Math.max(0,...contagens.map(c=>c.numero||0))+1;const id='ct'+uid();

const ORD_RANK={pendente:0,em_andamento:1,concluida:2};const PROD_RANK={aguardando:0,em_producao:1,pronto:2};
/* Pode entrar na unificação: não cancelado, não unificado, sem etiqueta comprada, não postado/entregue e fora de fechamento ativo. */
function podeUnificar(x,ativos){if(!x||x.cancelado||x.unificadoEm)return 'cancelado ou já unificado';if(x.postadoEm||x.statusProd==='entregue')return 'já enviado/entregue';

function juntarPedidos(main,secs,cfg){const et=(cfg.etapas||[]).map(e=>e.id);const todos=[main,...secs];
 const usados=new Set((main.itens||[]).map(i=>i.id));
 const itens=[...(main.itens||[]).map(i=>i.doPedido?i:{...i,doPedido:main.numero}),...secs.flatMap(s=>(s.itens||[]).map(i=>{let id=i.id||uid();if(usados.has(id))id=id+'-'+s.numero;usados.add(id);return{...i,id,doPedido:s.numero}}))];
 const ordens={};for(const p of todos)for(const [k,v] of Object.entries(p.ordens||{}))ordens[k]=k in ordens?(ORD_RANK[v]<ORD_RANK[ordens[k]]?v:ordens[k]):v;
 const lanc={};for(const p of todos)for(const [k,v] of Object.entries(p.consumoLancado||{}))lanc[k]=r3((lanc[k]||0)+Number(v||0));
 const prods=todos.map(p=>p.statusProd||'aguardando').filter(s=>s in PROD_RANK);const statusProd=prods.sort((a,b)=>PROD_RANK[a]-PROD_RANK[b])[0]||main.statusProd;
 const etapas=todos.map(p=>p.etapaId).filter(Boolean);const etapaId=etapas.sort((a,b)=>et.indexOf(a)-et.indexOf(b))[0]||main.etapaId;
 const txt=(k,sep)=>todos.map(p=>String(p[k]||'').trim()).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(sep);
 const prodEm=todos.map(p=>p.producaoEm).filter(Boolean).sort()[0];const consEm=todos.map(p=>p.consumoEm).filter(Boolean).sort()[0];
 return{...main,itens,ordens,consumoLancado:lanc,statusProd,etapaId,...(prodEm?{producaoEm:prodEm}:{}),...(consEm?{consumoEm:consEm}:{}),
  arquivos:todos.flatMap(p=>p.arquivos||[]),pagamentos:[...(main.pagamentos||[]),...secs.flatMap(s=>(s.pagamentos||[]).map(x=>({...x,obs:[x.obs,'veio do pedido #'+s.numero].filter(Boolean).join(' · ')})))],
  desconto:r2(sum(todos,p=>Number(p.desconto||0))),custoExtra:r2(sum(todos,p=>Number(p.custoExtra||0))),frete:r2(sum(todos,p=>Number(p.frete||0))),
  autorizado:todos.some(p=>p.autorizado),obsInterna:txt('obsInterna',' | '),obsCliente:txt('obsCliente',' | '),
  unificados:[...(main.unificados||[]),...secs.map(s=>({id:s.id,numero:s.numero,em:new Date().toISOString()}))]}}
async function unificarPedidos(db,mainId,secIds,cfg,me){const lerP=async id=>{const x=await db.doc('pedidos/'+id).get();if(!x.exists)throw new Error('Pedido não encontrado');return{id,...x.data()}};
 const main=await lerP(mainId);const secs=[];for(const id of secIds)secs.push(await lerP(id));

   historico:[...(s.historico||[]),{em:ag,por:me,tipo:'cancelamento',obs:'Unificado no pedido #'+main.numero+' (itens, artes e pagamentos foram para lá)'}]},me);await db.doc('pedidos/'+s.id).set(cs)}
 return{...cm,id:mainId}}

function dadosMes(pedidos,clientes,mes,desde){const ped=pedidos.filter(p=>!p.cancelado&&!p.interno&&(p.dia||'').slice(0,7)===mes);const comVend=p=>!desde||p.dia>=desde;const mt=p=>(p.totais?.mt||0)+(p.totais?.mu||0);

/* ---------------- financeiro: contas a pagar e a receber ---------------- */
/* Títulos guardados em "lancamentos" (manuais e parcelas de compras recebidas). Pedidos, fechamentos e compras aprovadas
   entram calculados na hora, a partir dos próprios documentos, para nunca haver valor duplicado ou desatualizado. */
const CAT_PAGAR=['Matéria-prima','Fornecedores','Aluguel','Energia','Água','Internet e telefone','Salários e encargos','Pró-labore','Impostos','Manutenção','Frete','Marketing','Taxas bancárias e cartão','Equipamentos','Outras despesas'];
const CAT_RECEBER=['Vendas','Fechamentos','Serviços','Empréstimos','Outras receitas'];
const ORIG_FIN={manual:'Lançamento manual',compra:'Compra recebida',compra_prev:'Compra aprovada (previsão)',pedido:'Pedido',pedido_prev:'Pedido de fechamento (entra no próximo fechamento)',fechamento:'Fechamento'};
const SIT_FIN={previsto:['Previsto','b-info'],avencer:['A vencer',''],hoje:['Vence hoje','b-warn'],vencido:['Vencido','b-red'],pago:['Pago','b-ok'],cancelado:['Cancelado','']};
const saldoLanc=l=>{const pago=sum((l.pagamentos||[]).filter(x=>!x.estornado),x=>Number(x.valor)||0);return{pago:r2(pago),saldo:r2(Math.max(0,Number(l.valor||0)+Number(l.juros||0)-Number(l.desconto||0)-pago))}};
const addMes=(iso,n)=>{const y=+iso.slice(0,4),m=+iso.slice(5,7)-1+n,d=+iso.slice(8,10);const ult=new Date(Date.UTC(y,m+1,0)).getUTCDate();const x=new Date(Date.UTC(y,m,Math.min(d,ult)));return x.toISOString().slice(0,10)};
function titulosFin({lancamentos=[],compras=[],fornecedores=[],pedidos=[],fechamentos=[],clientes=[],cfg}){const hoje=diaSP();const out=[];
 const sit=(st,venc)=>st!=='aberto'?st:venc<hoje?'vencido':venc===hoje?'hoje':'avencer';
 for(const l of lancamentos){const {pago,saldo}=saldoLanc(l);const pg=(l.pagamentos||[]).filter(x=>!x.estornado);const st=l.cancelado?'cancelado':saldo<=0.009?'pago':'aberto';const venc=l.vencimento||'';
  out.push({key:'l:'+l.id,doc:l,tipo:l.tipo,origem:l.origem||'manual',status:st,sit:sit(st,venc),descricao:l.descricao||'',pessoa:l.pessoa||'',categoria:l.categoria||'',forma:l.forma||'',valor:r2(Number(l.valor||0)+Number(l.juros||0)-Number(l.desconto||0)),pago,saldo:st==='cancelado'?0:saldo,venc,pagoEm:pg.length?pg.map(x=>x.data).sort().pop():'',comp:l.competencia||venc.slice(0,7),parcela:l.parcela||'',ref:l.documento||'',boleto:l.boleto||''})}
 for(const c of compras){if(c.status!=='enviado')continue;const f=fornecedores.find(x=>x.id===c.fornecedorId)||{};const tot=r2(sum(c.itens||[],i=>pn(i.qtd)*pn(i.custo))+pn(c.frete));if(!(tot>0))continue;
  const venc=c.vencimento||addD(c.previsao||diaSP(c.enviadoEm||c.criadoEm),Number(f.prazoPagto??30));
  out.push({key:'c:'+c.id,compra:c,tipo:'pagar',origem:'compra_prev',status:'previsto',sit:'previsto',descricao:'Compra #'+c.numero+' (aguardando recebimento)',pessoa:c.fornecedorNome||'',categoria:'Matéria-prima',forma:'',valor:tot,pago:0,saldo:tot,venc,pagoEm:'',comp:venc.slice(0,7),parcela:'',ref:'',boleto:''})}
 const pm=Object.fromEntries(pedidos.map(p=>[p.id,p]));const ativos=fechAtivos(fechamentos);
 for(const f of fechamentos){if(f.status==='cancelado'||f.status==='pago')continue;const saldo=r2(sum(f.pedidos||[],x=>{const p=pm[x.id];return p&&!p.cancelado?Math.max(0,p.saldo||0):0}));if(saldo<=0.009)continue;const venc=f.vencimento||f.fim;
  out.push({key:'f:'+f.id,fech:f,tipo:'receber',origem:'fechamento',status:'aberto',sit:sit('aberto',venc),descricao:'Fechamento #'+f.numero+' · '+dBR(f.inicio)+' a '+dBR(f.fim),pessoa:f.clienteNome||'',categoria:'Fechamentos',forma:f.forma||'',valor:saldo,pago:0,saldo,venc,pagoEm:'',comp:(f.fim||'').slice(0,7),parcela:'',ref:'',boleto:''})}
 const cm=Object.fromEntries(clientes.map(c=>[c.id,c]));const prazo=Number(cfg?.fechPrazo??3);
 for(const p of pedidos){if(p.cancelado||p.interno||p.cortesia)continue;const dia=p.dia||diaSP(p.criadoEm);const sal=Number(p.saldo||0);
  if(sal>0.009&&!ativos.has(p.id)){const c=respFech(clientes,p.clienteId)||cm[p.clienteId];
   if(c&&PERIODICOS.includes(c.condicao)){const fim=periodoDe(dia,c.condicao)[1];const venc=p.vencimento||addD(fim,prazo);out.push({key:'p:'+p.id,ped:p,tipo:'receber',origem:'pedido_prev',status:'aberto',sit:sit('aberto',venc),descricao:'Pedido #'+p.numero+(c.id!==p.clienteId?' de '+(p.clienteNome||'').split(' ')[0]:'')+' (fechamento de '+dBR(fim)+')',pessoa:c.nome||p.clienteNome||'',categoria:'Vendas',forma:p.forma||'',valor:sal,pago:0,saldo:sal,venc,pagoEm:'',comp:dia.slice(0,7),parcela:'',ref:'',boleto:''})}
   else{const venc=p.vencimento||dia;out.push({key:'p:'+p.id,ped:p,tipo:'receber',origem:'pedido',status:'aberto',sit:sit('aberto',venc),descricao:'Pedido #'+p.numero+(p.pago>0?' (saldo)':''),pessoa:p.clienteNome||'',categoria:'Vendas',forma:p.forma||'',valor:sal,pago:0,saldo:sal,venc,pagoEm:'',comp:dia.slice(0,7),parcela:'',ref:'',boleto:''})}}
  for(const x of p.pagamentos||[]){if(x.estornado||!(Number(x.valor)>0))continue;const d=diaSP(x.data);
   out.push({key:'pp:'+p.id+':'+x.id,ped:p,tipo:'receber',origem:'pedido',status:'pago',sit:'pago',descricao:'Pedido #'+p.numero,pessoa:p.clienteNome||'',categoria:'Vendas',forma:x.forma||'',valor:Number(x.valor),pago:Number(x.valor),saldo:0,venc:d,pagoEm:d,comp:dia.slice(0,7),parcela:'',ref:'',boleto:''})}}

function FluxoCaixa({T,R,de,ate,cfg,db,toast,pode}){const hoje=diaSP();const [g,setG]=useState('dia');const [si,setSi]=useState(String(cfg.finSaldo??'').replace('.',','));

 const rot=k=>g==='mes'?['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+k.slice(5,7)-1]+'/'+k.slice(2,4):g==='semana'?'sem. '+dBR(k):dBR(k);
 const B={};const pega=d=>{const k=chave(d);return B[k]||(B[k]={k,er:0,ep:0,sr:0,sp:0})};
 for(let d=ini;d<=fim;d=addD(d,1))pega(d);
 for(const r of R){const d=diaSP(r.data);if(d<ini||d>fim)continue;const b=pega(d);if(r.tipo==='receber')b.er+=r.valor;else b.sr+=r.valor}
 let atrasoE=0,atrasoS=0;for(const t of T){if(t.status==='pago'||t.status==='cancelado'||!(t.saldo>0))continue;let d=t.venc;if(d<hoje){if(t.tipo==='receber')atrasoE+=t.saldo;else atrasoS+=t.saldo;d=hoje}if(d<ini||d>fim)continue;const b=pega(d);if(t.tipo==='receber')b.ep+=t.saldo;else b.sp+=t.saldo}

function FinCategorias({T,R,de,ate}){const ok=d=>(!de||d>=de)&&(!ate||d<=ate);const C={};const pega=(tipo,c)=>{const k=tipo+'|'+(c||'Sem categoria');return C[k]||(C[k]={tipo,c:c||'Sem categoria',real:0,aberto:0,n:0})};
 for(const r of R){if(!ok(diaSP(r.data)))continue;pega(r.tipo,r.t.categoria).real+=r.valor}
 for(const t of T){if(t.status==='pago'||t.status==='cancelado'||!(t.saldo>0)||!ok(t.venc))continue;const x=pega(t.tipo,t.categoria);x.aberto+=t.saldo;x.n++}
 const L=Object.values(C);const rec=L.filter(x=>x.tipo==='receber').sort((a,b)=>b.real+b.aberto-a.real-a.aberto),des=L.filter(x=>x.tipo==='pagar').sort((a,b)=>b.real+b.aberto-a.real-a.aberto);
 const tR=sum(rec,x=>x.real),tD=sum(des,x=>x.real),tRa=sum(rec,x=>x.aberto),tDa=sum(des,x=>x.aberto);
 const bloco=(tit,arr,tot,cor)=>html`<div className="card"><div className="pad row between" style=${{borderBottom:'1px solid var(--line)'}}><b>${tit}</b><b className="tab" style=${{color:cor}}>${moeda(tot)}</b></div>${arr.length===0?html`<div className="pad sm mut">Nada no período.</div>`:html`<div className="scroll"><table><thead><tr><th>Categoria</th><th className="r">Realizado</th><th className="r">% </th><th className="r">Em aberto</th></tr></thead><tbody>

 return html`<div style=${{display:'grid',gap:12}}><div className="grid g4"><div className="card kpi"><div className="t">Receitas realizadas</div><div className="v tab" style=${{color:'var(--ok)'}}>${moeda(tR)}</div><div className="sm mut">em aberto ${moeda(tRa)}</div></div>

  <div className="card kpi"><div className="t">Resultado projetado</div><div className="v tab">${moeda(tR+tRa-tD-tDa)}</div><div className="sm mut">incluindo o que está em aberto</div></div></div>
  <div className="sm mut">${de||ate?'Período '+dBR(de)+' a '+dBR(ate)+' (realizado pela data do pagamento; em aberto pelo vencimento).':'Todo o período. Escolha um período nos filtros para ver o resultado do mês.'}</div>
  <div className="grid g2">${bloco('Receitas por categoria',rec,tR,'var(--ok)')}${bloco('Despesas por categoria',des,tD,'var(--red2)')}</div></div>`}

function FinPessoas({T,R,de,ate,onVer}){const [tp,setTp]=useState('');const ok=d=>(!de||d>=de)&&(!ate||d<=ate);const P={};const pega=(tipo,p)=>{const k=tipo+'|'+(p||'(sem nome)');return P[k]||(P[k]={tipo,p:p||'(sem nome)',aberto:0,vencido:0,prev:0,real:0,n:0,prox:''})};
 for(const t of T){if(t.status==='pago'||t.status==='cancelado'||!(t.saldo>0))continue;const x=pega(t.tipo,t.pessoa);x.n++;if(t.sit==='previsto')x.prev+=t.saldo;else{x.aberto+=t.saldo;if(t.sit==='vencido')x.vencido+=t.saldo;else if(!x.prox||t.venc<x.prox)x.prox=t.venc}}
 for(const r of R){if(!ok(diaSP(r.data)))continue;pega(r.tipo,r.t.pessoa).real+=r.valor}
 const L=Object.values(P).filter(x=>!tp||x.tipo===tp).sort((a,b)=>b.vencido-a.vencido||b.aberto-a.aberto||b.real-a.real);

function FinVencidos({T,onVer}){const hoje=diaSP();const FX=[['1–15 dias',1,15],['16–30 dias',16,30],['31–60 dias',31,60],['61–90 dias',61,90],['mais de 90',91,1e9]];

 const tab=tipo=>{const L=T.filter(t=>t.tipo===tipo);const P={};for(const t of L){const x=P[t.pessoa||'(sem nome)']||(P[t.pessoa||'(sem nome)']={p:t.pessoa||'(sem nome)',f:FX.map(()=>0),tot:0,max:0});const d=dias(t);const i=FX.findIndex(([,a,b])=>d>=a&&d<=b);x.f[i<0?0:i]+=t.saldo;x.tot+=t.saldo;x.max=Math.max(x.max,d)}
  const A=Object.values(P).sort((a,b)=>b.tot-a.tot);
  return html`<div className="card"><div className="pad row between" style=${{borderBottom:'1px solid var(--line)'}}><b>${tipo==='receber'?'Clientes em atraso (a receber)':'Contas a pagar em atraso'}</b><b className="tab" style=${{color:'var(--red2)'}}>${moeda(sum(A,x=>x.tot))}</b></div>
   ${A.length===0?html`<div className="pad sm mut">Nenhum título vencido.</div>`:html`<div className="scroll"><table><thead><tr><th>Nome</th>${FX.map(([l])=>html`<th key=${l} className="r">${l}</th>`)}<th className="r">Total</th></tr></thead><tbody>
   ${A.map(x=>html`<tr key=${x.p} className="hov" onClick=${()=>onVer(x.p==='(sem nome)'?'':x.p)}><td><b>${x.p}</b><div className="sm mut">maior atraso ${x.max} dia(s)</div></td>${x.f.map((v,i)=>html`<td key=${i} className="r tab">${v?moeda(v):'—'}</td>`)}<td className="r tab b">${moeda(x.tot)}</td></tr>`)}
   <tr><td><b>Total</b></td>${FX.map((_,i)=>html`<td key=${i} className="r tab b">${moeda(sum(A,x=>x.f[i]))}</td>`)}<td className="r tab b">${moeda(sum(A,x=>x.tot))}</td></tr></tbody></table></div>`}</div>`};
 return html`<div style=${{display:'grid',gap:12}}>${tab('receber')}${tab('pagar')}</div>`}

/* arquivos acima do limite do armazenamento (50 MB) são guardados em partes e remontados ao baixar, sem perder qualidade */
const PARTE_ARTE=45*1024*1024;
async function arteBlob(a){const ST=window.RP_SB.storage.from('artes');if(!a.partes){const {data,error}=await ST.download(a.path);if(error||!data)throw error||new Error('Falha ao baixar');return data}
 const bs=[];for(let i=1;i<=a.partes;i++){const {data,error}=await ST.download(a.path+'.parte'+i);if(error||!data)throw error||new Error('Falha ao baixar a parte '+i);bs.push(data)}return new Blob(bs,{type:'image/png'})}
async function enviarArteBlob(path,blob,prog){const ST=window.RP_SB&&window.RP_SB.storage;if(!ST)throw new Error('Armazenamento indisponível');const b=blob.type==='image/png'?blob:new Blob([blob],{type:'image/png'});
 const nP=b.size>PARTE_ARTE?Math.ceil(b.size/PARTE_ARTE):0;
 if(!nP){const {error}=await ST.from('artes').upload(path,b,{contentType:'image/png',upsert:false});if(error)throw new Error(error.message);return {path}}
 for(let k=1;k<=nP;k++){prog&&prog(k,nP);const {error}=await ST.from('artes').upload(path+'.parte'+k,new Blob([b.slice((k-1)*PARTE_ARTE,k*PARTE_ARTE)],{type:'image/png'}),{contentType:'image/png',upsert:false});if(error)throw new Error(error.message+' (parte '+k+')')}
 return {path,partes:nP}}
async function urlArte(a){if(!a.partes){const {data}=await window.RP_SB.storage.from('artes').createSignedUrl(a.path,3600);return data&&data.signedUrl}return URL.createObjectURL(await arteBlob(a))}

 const nome=(nomeForcado||a.nome||a.path.split('/').pop()).replace(/[\\/:*?"<>|]+/g,'_');const url=URL.createObjectURL(data);const el=document.createElement('a');el.href=url;el.download=/\.(png|jpe?g|pdf)$/i.test(nome)?nome:nome+'.png';document.body.appendChild(el);el.click();setTimeout(()=>{URL.revokeObjectURL(url);el.remove()},4000);return true}
 catch(e){toast&&toast('Não foi possível baixar '+(a.nome||'')+': '+(e.message||e.error||e),1);return false}}

/* ---------------- configurações ---------------- */
/* ---------------- fechamentos de clientes ---------------- */
const MSG_FECH='*FECHAMENTO {periodicidade} — {empresa}*\n\nOlá, {cliente}!\n\nSegue o demonstrativo referente ao período de {inicio} até {fim}.\n\n*Pedidos realizados:*\n\n{linhas}\n\n*Total: {metros} metros.*\n\n*Valor total: {valor}.*\n{saldo_linha}\nVencimento: {vencimento}.\n\nChave PIX: {pix}.\n\nAgradecemos pela parceria!\n\n*{empresa} — Impressão e Personalização.*';
const PERIODIC={diario:'DIÁRIO',semanal:'SEMANAL',quinzenal:'QUINZENAL',mensal:'MENSAL',personalizado:'',antecipado:'',na_retirada:''};
function fechAtivos(fechamentos){const s=new Set();for(const f of fechamentos)if(f.status!=='cancelado')for(const p of f.pedidos||[])s.add(p.id);return s}
/* Agrupa os itens do fechamento por cliente do pedido (vinculados). */
function porClienteFech(f,pedidosM){const g={};for(const x of f.pedidos||[]){const p=pedidosM[x.id];const nome=x.clienteNome||p?.clienteNome||f.clienteNome||'';const k=x.clienteId||p?.clienteId||nome;(g[k]||(g[k]={nome,itens:[],metros:0,valor:0})).itens.push(x);g[k].metros+=Number(x.metros||0);g[k].valor+=Number(p?p.total:x.valor)||0}
 return Object.values(g).sort((a,b)=>a.nome.localeCompare(b.nome))}
function textoFechamento(f,cfg,pedidosM){const lin=x=>{const p=pedidosM[x.id];return ddmm(x.data)+' — Pedido #'+x.numero+' — '+num(x.metros)+' m — '+moeda(p?p.total:x.valor)};const G=porClienteFech(f,pedidosM);
 const linhas=(G.length>1?G.map(g=>'*'+g.nome+'*\n'+g.itens.map(lin).join('\n')+'\n_Subtotal '+g.nome.split(' ')[0]+': '+num(g.metros)+' m — '+moeda(g.valor)+'_').join('\n\n')+'\n\n*Resumo por cliente:*\n'+G.map(g=>'• '+g.nome+': '+num(g.metros)+' m — '+moeda(g.valor)).join('\n'):(f.pedidos||[]).map(lin).join('\n\n'))+((f.agrupou||[]).length?'\n\n_Este fechamento junta tudo que está em aberto e substitui o(s) fechamento(s) '+f.agrupou.map(x=>'#'+x.numero).join(', ')+'._':'');
 const saldo=sum(f.pedidos||[],x=>{const p=pedidosM[x.id];return p?p.saldo:x.valor});
 return preencher(cfg.msgFechamento||MSG_FECH,{periodicidade:PERIODIC[f.periodicidade]||'',empresa:cfg.empresa.nome,cliente:(f.clienteNome||'').split(' ')[0],inicio:dBR(f.inicio),fim:dBR(f.fim),linhas,metros:num(f.metros),valor:moeda(f.total),
  saldo_linha:saldo<f.total-0.009?'*Saldo em aberto: '+moeda(saldo)+'.*\n':'',vencimento:dBR(f.vencimento),pix:cfg.empresa.pix,pix_copia:pixCopiaCola(cfg.empresa,saldo,'FECH'+f.numero)})+((cfg.msgFechamento||MSG_FECH).includes('{pix_copia}')||!cfg.empresa.pix||saldo<=0?'':'\n\nPIX copia e cola ('+moeda(saldo)+'):\n'+pixCopiaCola(cfg.empresa,saldo,'FECH'+f.numero))}

/* ---- fechamentos automáticos: períodos já encerrados com pedidos em aberto ---- */
const PERIODICOS=['diario','semanal','quinzenal','mensal'];
const PER_TXT={diario:'diário',semanal:'semanal',quinzenal:'quinzenal',mensal:'mensal'};
/* Cliente com fechamento (diário/semanal/quinzenal/mensal): não recebe cobrança por pedido, só pelo fechamento. */
/* Clientes vinculados: o cliente pode ter o fechamento feito junto com outro (responsável). Ex.: Murilo e Gustavo → fechamento no nome do Wilgner. */
const respFech=(clientes,id)=>{const c=(clientes||[]).find(x=>x.id===id);if(!c)return null;if(c.fechaCom&&c.fechaCom!==c.id){const r=clientes.find(x=>x.id===c.fechaCom);if(r)return r}return c};
const grupoFech=(clientes,id)=>new Set([id,...(clientes||[]).filter(c=>c.fechaCom===id&&c.id!==id).map(c=>c.id)]);
const cliFechamento=(p,clientes)=>{const c=respFech(clientes,p?.clienteId);return c&&PERIODICOS.includes(c.condicao)?c:null};
function periodoDe(dia,cond){if(cond==='diario')return[dia,dia];
 if(cond==='semanal'){const d=new Date(dia+'T12:00:00Z');const w=(d.getUTCDay()+6)%7;const ini=addD(dia,-w);return[ini,addD(ini,6)]}
 const y=+dia.slice(0,4),m=+dia.slice(5,7),dd=+dia.slice(8,10);const ult=new Date(Date.UTC(y,m,0)).getUTCDate();const mm=dia.slice(0,8);
 if(cond==='quinzenal')return dd<=15?[mm+'01',mm+'15']:[mm+'16',mm+String(ult).padStart(2,'0')];
 return[mm+'01',mm+String(ult).padStart(2,'0')]}
function fechPendentes(clientes,pedidos,fechamentos,desde){const ativos=fechAtivos(fechamentos);const hoje=diaSP();const out={};
 for(const p of pedidos){const c=respFech(clientes,p.clienteId);if(!c||!PERIODICOS.includes(c.condicao)||c.ativo===false)continue;if(!c||p.cancelado||!(p.saldo>0.009)||ativos.has(p.id))continue;const [ini,fim]=periodoDe(p.dia,c.condicao);if(fim>=hoje||(desde&&fim<desde))continue;
  const k=c.id+'|'+ini;const o=out[k]||(out[k]={cliente:c,inicio:ini,fim,pedidos:[]});o.pedidos.push(p)}
 return Object.values(out).sort((a,b)=>a.fim.localeCompare(b.fim)||a.cliente.nome.localeCompare(b.cliente.nome))}
async function proximoFech(db,fechamentos){const ref=db.doc('contadores/fechamentos');const maxLocal=Math.max(0,...fechamentos.map(f=>f.numero||0));
 for(let t=0;t<6;t++){const r=await ref.acquire({holder:TAB,ttlMs:5000});if(r.acquired){const x=await ref.get();const n=Math.max(maxLocal,(x.exists&&x.data().ultimo)||0)+1;await ref.set({ultimo:n});return n}await espera(300+Math.random()*400)}
 return maxLocal+1}
async function gerarFechamento(db,{cliente,inicio,fim,pedidos:ps},fechamentos,cfg,me,auto){const n=await proximoFech(db,fechamentos);const prazo=Number(cfg.fechPrazo??3);
 const id='fa-'+cliente.id+'-'+inicio;const ex=await db.doc('fechamentos/'+id).get();if(ex.exists&&ex.data().status!=='cancelado')return null;
 const metros=sum(ps,p=>(p.totais?.mt||0)+(p.totais?.mu||0)),total=sum(ps,p=>p.saldo);
 await db.doc('fechamentos/'+id).set({numero:n,clienteId:cliente.id,clienteNome:cliente.nome,periodicidade:cliente.condicao,inicio,fim,vencimento:addD(fim,prazo),criadoEm:new Date().toISOString(),por:me,status:'aberto',auto:!!auto,
  pedidos:ps.sort((a,b)=>a.dia.localeCompare(b.dia)).map(p=>({id:p.id,numero:p.numero,data:p.dia,metros:r3((p.totais?.mt||0)+(p.totais?.mu||0)),valor:r2(p.saldo),clienteId:p.clienteId,clienteNome:p.clienteNome})),metros:r3(metros),total:r2(total)});return n}

function Cobranca({db,pedidos,clientes,fechamentos=[],cfg,pode,toast}){const [pix,setPix]=useState(null);const [min,setMin]=useState(0);const hoje=diaSP();
 const lista=useMemo(()=>{const m={};const per=new Set(clientes.filter(c=>PERIODICOS.includes(respFech(clientes,c.id)?.condicao)).map(c=>c.id));const vencF=new Set();for(const f of fechamentos)if(f.status==='aberto'&&(f.vencimento||f.fim)<hoje)for(const x of f.pedidos||[])vencF.add(x.id);

 const msg=o=>preencher(cfg.msgCobranca||MSG_COBRANCA,{cliente:(o.nome||'').split(' ')[0],empresa:cfg.empresa.nome,saldo:moeda(o.s),pedidos:o.q,desde:dBR(o.desde),pix:cfg.empresa.pix||'',pix_copia:pixCopiaCola(cfg.empresa,o.s,'COB'+String(o.id).slice(-8))});

 return html`<div className="card"><div className="row pad between" style=${{borderBottom:'1px solid var(--line)'}}><div className="row"><span className="sm">Em aberto há pelo menos</span><select className="in" style=${{width:130}} value=${min} onChange=${e=>setMin(+e.target.value)}>${[0,3,7,15,30,60].map(d=>html`<option key=${d} value=${d}>${d} dias</option>`)}</select></div>

function NovoFechamento({db,clientes,pedidos,fechamentos,cfg,me,toast,onClose,pm}){

function calcSim(s){const v=k=>pn(s[k]);
 const mat=v('filme')/100*v('consFilme')+v('branca')*v('consBranca')+v('cor')*v('consCor')+v('po')*v('consPo')+v('desgaste');
 const fixos=v('energia')+v('salario')*(1+v('encargos')/100)+v('outrosFixos');const mm=v('metrosDia')*v('dias');const fixoM=mm>0?fixos/mm:0;const custo=mat+fixoM;
 const tax=(v('impostos')+v('cartao'))/100,mg=v('margem')/100;const ok=1-tax-mg>0&&1-tax>0;
 const preco=ok?custo/(1-tax-mg):null,minimo=1-tax>0?custo/(1-tax):null;const contrib=preco!=null?preco*(1-tax)-mat:null;
 return{mat,fixos,mm,fixoM,custo,preco,minimo,lucroM:preco!=null?preco*(1-tax)-custo:null,pe:contrib>0?fixos/contrib:null,fatMes:preco!=null?preco*mm:null,lucroMes:preco!=null?(preco*(1-tax)-custo)*mm:null,erro:ok?null:'Margem + impostos + taxas somam 100% ou mais'}}

     <${F} l="Aviso na página (opcional)" className="span"><input className="in" value=${(c.portal||{}).aviso||''} onChange=${e=>setC({...c,portal:{...(c.portal||{}),aviso:e.target.value}})} placeholder="ex.: pedidos até 14h saem no mesmo dia"/><//></div>
    <div className="card pad" style=${{display:'grid',gap:8,background:'rgba(127,127,127,.04)'}}><b>Entrega RIBER PRINT (nós entregamos)</b>
     <label className="row sm"><input type="checkbox" checked=${!!((c.portal||{}).entrega||{}).ativo} onChange=${e=>setC({...c,portal:{...(c.portal||{}),entrega:{...((c.portal||{}).entrega||{}),ativo:e.target.checked}}})}/> Mostrar a opção "Entrega RIBER PRINT" no site de pedidos</label>
     <div className="grid g4">${[['cidades','Cidades atendidas (separe por vírgula)','Franca'],['uf','Estado (UF)','SP'],['gratisAcima','Grátis para pedidos acima de (m)','9,99'],['prazo','Prazo de entrega (aparece para o cliente)','']].map(([k,l,d])=>html`<${F} key=${k} l=${l}><input className="in" value=${(()=>{const v=((c.portal||{}).entrega||{})[k];return v==null?(k==='prazo'?'':d):Array.isArray(v)?v.join(', '):String(v).replace('.',',')})()} placeholder=${k==='prazo'?'ex.: no mesmo dia para pedidos até 14h':''} onChange=${e=>setC({...c,portal:{...(c.portal||{}),entrega:{...((c.portal||{}).entrega||{}),[k]:e.target.value}}})}/><//>`)}</div>
     <div><b className="sm">Taxa por distância da loja (pedidos até o limite de metros)</b><table style=${{marginTop:6,maxWidth:420}}><thead><tr><th>Até (km)</th><th>Taxa (R$)</th><th></th></tr></thead><tbody>
      ${(((c.portal||{}).entrega||{}).faixas||ENT_FAIXAS).map((fx,i,arr)=>{const set=(k,v)=>{const a=arr.map((x,j)=>j===i?{...x,[k]:v}:x);setC({...c,portal:{...(c.portal||{}),entrega:{...((c.portal||{}).entrega||{}),faixas:a}}})};return html`<tr key=${i}><td><input className="in tab" style=${{width:90}} value=${String(fx.ate).replace('.',',')} onChange=${e=>set('ate',e.target.value)}/></td><td><input className="in tab" style=${{width:90}} value=${String(fx.taxa).replace('.',',')} onChange=${e=>set('taxa',e.target.value)}/></td><td><button type="button" className="btn sm" onClick=${()=>setC({...c,portal:{...(c.portal||{}),entrega:{...((c.portal||{}).entrega||{}),faixas:arr.filter((_,j)=>j!==i)}}})}>×</button></td></tr>`})}</tbody></table>
      <button type="button" className="btn sm" style=${{marginTop:6}} onClick=${()=>{const arr=((c.portal||{}).entrega||{}).faixas||ENT_FAIXAS;setC({...c,portal:{...(c.portal||{}),entrega:{...((c.portal||{}).entrega||{}),faixas:[...arr,{ate:'',taxa:''}]}}})}}>+ Faixa</button></div>
     <div className="sm mut">O sistema calcula a distância da loja (endereço em Empresa) até o endereço do cliente pelo caminho de carro. Acima do limite de metros a entrega é grátis; até o limite cobra a taxa da faixa. Além da última faixa, não entregamos.</div></div></div>
   <div className="card pad" style=${{marginTop:12,display:'grid',gap:10}}><b>Baixa de matéria-prima pelos pedidos</b>
    <label className="row sm"><input type="checkbox" checked=${!!(c.baixaPedido||BAIXA_PADRAO).ativo} onChange=${e=>setC({...c,baixaPedido:{...BAIXA_PADRAO,...(c.baixaPedido||{}),ativo:e.target.checked,desde:e.target.checked&&!(c.baixaPedido||BAIXA_PADRAO).ativo?new Date().toISOString():(c.baixaPedido||BAIXA_PADRAO).desde}})}/> Abater o estoque automaticamente quando a produção do pedido for concluída (pronto ou entregue)</label>
    <div className="sm mut">Usa a ficha de consumo do perfil escolhido × metros do pedido. O que já foi abatido não volta ao estoque, mesmo se o pedido voltar etapa ou for cancelado (o material impresso é descartado). Se os metros do pedido aumentarem depois, abate a diferença. Vale para pedidos criados a partir de ${dhBR((c.baixaPedido||BAIXA_PADRAO).desde)}. Com isso ligado, a Central de impressão abate só os metros descartados.</div>
    <div className="grid g2">${[['textil','Perfil para DTF Têxtil'],['uv','Perfil para DTF UV']].map(([k,l])=>html`<${F} key=${k} l=${l}><select className="in" value=${(c.baixaPedido||{})[k]||''} onChange=${e=>setC({...c,baixaPedido:{...BAIXA_PADRAO,...(c.baixaPedido||{}),[k]:e.target.value}})}><option value="">Automático (primeira máquina ${k==='uv'?'UV':'têxtil'})</option>
     ${(ctx.maquinas||[]).filter(m=>(m.tipo||'textil')===k).flatMap(m=>(m.perfis||[]).map(pf=>html`<option key=${m.id+pf.id} value=${m.id+'|'+pf.id}>${m.nome} · ${pf.nome}</option>`))}</select><//>`)}</div></div>
   <div className="card pad" style=${{marginTop:12,display:'grid',gap:10}}><b>Frete (Melhor Envio)</b><div className="sm mut">Usado no botão “Cotar frete” dos pedidos com entrega. O peso do pacote é calculado: peso base + metros × peso por metro + peças × peso por peça (dá para ajustar na hora da cotação).</div>
    <div className="grid g4">${[['cepOrigem','CEP de origem'],['pesoBase','Peso base da embalagem (kg)'],['pesoMetro','Peso por metro de DTF (kg)'],['pesoPeca','Peso por peça de roupa (kg)'],['altura','Altura padrão (cm)'],['largura','Largura padrão (cm)'],['comprimento','Comprimento padrão (cm)']].map(([k,l])=>html`<${F} key=${k} l=${l}><input className="in tab" value=${(c.frete||FRETE_PADRAO)[k]??''} onChange=${e=>setC({...c,frete:{...FRETE_PADRAO,...(c.frete||{}),[k]:e.target.value}})}/><//>`)}
     <div className="span" style=${{gridColumn:'1/-1'}}><b className="sm">Remetente das etiquetas</b></div>
     ${[['nome','Nome / razão social'],['documento','CNPJ ou CPF'],['ie','Inscrição estadual (ou ISENTO)'],['telefone','Telefone'],['email','E-mail'],['cep','CEP'],['endereco','Endereço'],['numero','Número'],['complemento','Complemento'],['bairro','Bairro'],['cidade','Cidade'],['uf','UF']].map(([k,l])=>html`<${F} key=${'r'+k} l=${l}><input className="in" value=${((c.frete||{}).remetente||{})[k]??''} onChange=${e=>{const r={...((c.frete||{}).remetente||{}),[k]:e.target.value};setC({...c,frete:{...FRETE_PADRAO,...(c.frete||{}),remetente:r}});
       if(k==='cep'&&dig(e.target.value).length===8)buscaCep(dig(e.target.value)).then(x=>{if(x)setC(cc=>({...cc,frete:{...FRETE_PADRAO,...(cc.frete||{}),remetente:{...((cc.frete||{}).remetente||{}),endereco:x.logradouro,bairro:x.bairro,cidade:x.localidade,uf:x.uf}}}))}).catch(()=>{})}}/><//>`)}
     <label className="row sm" style=${{alignSelf:'end',minHeight:40}}><input type="checkbox" checked=${!!(c.frete||{}).seguro} onChange=${e=>setC({...c,frete:{...FRETE_PADRAO,...(c.frete||{}),seguro:e.target.checked}})}/> Declarar valor por padrão</label></div></div>`}
  ${aba==='etapas'&&html`<div className="card"><div className="pad sm mut">“Exige pagamento” só aceita pedidos pagos. “Exige liberação” aceita pagos ou com produção faturada autorizada. “Status” atualiza a produção ao entrar na etapa.</div><div className="scroll"><table><thead><tr><th></th><th>Nome</th><th>Cor</th><th>Exige pagamento</th><th>Exige liberação</th><th>Status de produção</th></tr></thead><tbody>
   ${c.etapas.map((e,i)=>html`<tr key=${e.id}><td className="nw"><button className="btn sm" onClick=${()=>mov(i,-1)}>↑</button> <button className="btn sm" onClick=${()=>mov(i,1)}>↓</button></td><td><input className="in" value=${e.nome} onChange=${x=>upE(i,'nome',x.target.value)}/></td>
    <td><input type="color" value=${e.cor} onChange=${x=>upE(i,'cor',x.target.value)} style=${{width:44,height:36,border:0,background:'none'}}/></td>
    <td><input type="checkbox" disabled=${e.cancela} checked=${!!e.exigePagamento} onChange=${x=>upE(i,'exigePagamento',x.target.checked)}/></td><td><input type="checkbox" disabled=${e.cancela} checked=${!!e.exigeLiberacao} onChange=${x=>upE(i,'exigeLiberacao',x.target.checked)}/></td>
    <td>${e.cancela?html`<span className="sm mut">Cancela o pedido</span>`:html`<select className="in" value=${e.status||''} onChange=${x=>upE(i,'status',x.target.value)}><option value="">Não altera</option><option value="aguardando">Aguardando</option><option value="em_producao">Em produção</option><option value="pronto">Pronto</option><option value="entregue">Entregue (baixa estoque)</option></select>`}</td></tr>`)}
   </tbody></table></div><div className="pad"><button className="btn" onClick=${()=>{const a=[...c.etapas];a.splice(a.length-1,0,{id:'e'+uid(),nome:'Nova etapa',cor:'#71717a'});setC({...c,etapas:a})}}><${Ic} n="plus" s=${14}/>Nova etapa</button></div></div>`}
  ${aba==='categorias'&&html`<div className="card"><div className="pad sm mut">O setor define qual Kanban de departamento recebe a ordem de produção.</div><div className="scroll"><table><thead><tr><th>Nome</th><th>Grupo</th><th>Setor</th></tr></thead><tbody>
   ${c.categorias.map((x,i)=>html`<tr key=${x.id}><td><input className="in" value=${x.nome} onChange=${e=>setC({...c,categorias:c.categorias.map((y,j)=>j===i?{...y,nome:e.target.value}:y)})}/></td>
    <td><select className="in" value=${x.grupo} onChange=${e=>setC({...c,categorias:c.categorias.map((y,j)=>j===i?{...y,grupo:e.target.value}:y)})}><option value="impressao">Impressão</option><option value="vestuario">Vestuário</option><option value="servico">Serviço</option><option value="outros">Outros</option></select></td>
    <td><select className="in" value=${x.setor||''} onChange=${e=>setC({...c,categorias:c.categorias.map((y,j)=>j===i?{...y,setor:e.target.value}:y)})}><option value="">Nenhum</option>${Object.entries(SETORES).map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></td></tr>`)}
   </tbody></table></div><div className="pad"><button className="btn" onClick=${()=>setC({...c,categorias:[...c.categorias,{id:'cat'+uid(),nome:'Nova categoria',grupo:'outros',setor:''}]})}><${Ic} n="plus" s=${14}/>Nova categoria</button></div></div>`}
  ${aba==='modelos'&&html`<div style=${{display:'grid',gap:10}}><div className="sm mut">Variáveis: {cliente} {pedido} {itens} {detalhes} (pedido completo: itens, preços, entrega e total) {valor} {saldo} {status} {pix} {horario}. Use *texto* para negrito.</div>
   <div className="card pad" style=${{display:'grid',gap:8}}><b>Mensagem de cobrança</b><div className="sm mut">Variáveis: {cliente} {empresa} {saldo} {pedidos} {desde} {pix} {pix_copia}</div>
    <textarea className="in" style=${{minHeight:140,fontFamily:'Geist Mono,monospace',fontSize:13}} value=${c.msgCobranca||MSG_COBRANCA} onChange=${e=>setC({...c,msgCobranca:e.target.value})}></textarea></div>
   <div className="card pad" style=${{display:'grid',gap:8}}><b>Mensagem de fechamento</b><div className="sm mut">Variáveis: {periodicidade} {empresa} {cliente} {inicio} {fim} {linhas} {metros} {valor} {saldo_linha} {vencimento} {pix} {pix_copia}</div>
    <${F} l="Prazo de vencimento do fechamento (dias após o fim do período)"><input className="in tab" style=${{maxWidth:120}} value=${c.fechPrazo??3} onChange=${e=>setC({...c,fechPrazo:e.target.value})}/><//>
    <textarea className="in" style=${{minHeight:160,fontFamily:'Geist Mono,monospace',fontSize:13}} value=${c.msgFechamento||MSG_FECH} onChange=${e=>setC({...c,msgFechamento:e.target.value})}></textarea></div>
   ${c.modelos.map((m,i)=>html`<div key=${m.id} className="card pad" style=${{display:'grid',gap:8}}><input className="in b" value=${m.nome} onChange=${e=>setC({...c,modelos:c.modelos.map((y,j)=>j===i?{...y,nome:e.target.value}:y)})}/>
    <textarea className="in" style=${{minHeight:110,fontFamily:'Geist Mono,monospace',fontSize:13}} value=${m.texto} onChange=${e=>setC({...c,modelos:c.modelos.map((y,j)=>j===i?{...y,texto:e.target.value}:y)})}></textarea></div>`)}
   <button className="btn" style=${{justifySelf:'start'}} onClick=${()=>setC({...c,modelos:[...c.modelos,{id:'m'+uid(),nome:'Nova mensagem',texto:'Olá, {cliente}! '}]})}><${Ic} n="plus" s=${14}/>Nova mensagem</button></div>`}
  </fieldset>
  ${aba==='aparencia'&&html`<div className="card pad" style=${{display:'grid',gap:16,maxWidth:760}}><div><b>Tema da tela</b><div className="sm mut">Vale só para este aparelho e navegador; cada pessoa escolhe o seu.</div></div>
   <div className="grid g3">${[['auto','Automático','Segue o celular ou computador'],['light','Claro','Fundo branco, logo com RIBER em preto'],['dark','Escuro','Fundo preto, logo original']].map(([k,l,d])=>html`<button key=${k} className="card pad" style=${{textAlign:'left',cursor:'pointer',font:'inherit',color:'inherit',borderColor:ctx.tema.modo===k?'var(--acc)':'',boxShadow:ctx.tema.modo===k?'0 0 0 2px var(--acc)':''}} onClick=${()=>ctx.setTema({...ctx.tema,modo:k})}>
    <div style=${{height:64,borderRadius:8,marginBottom:8,display:'grid',placeItems:'center',background:k==='dark'?'#000':k==='light'?'#fff':'linear-gradient(90deg,#fff 50%,#000 50%)',border:'1px solid var(--line)'}}>${k!=='auto'&&html`<img src=${k==='light'?LOGO_CLARO:LOGO} style=${{height:40}} alt=""/>`}</div><b>${l}</b><div className="sm mut">${d}</div></button>`)}</div>
   <div><b>Cor de destaque</b><div className="sm mut">Botões, abas e seleção. O padrão é o magenta da marca.</div>
    <div className="row" style=${{marginTop:8,flexWrap:'wrap'}}>${[['','Marca (magenta)','#a3089a'],['#6106c4','Roxo','#6106c4'],['#0470dc','Azul','#0470dc'],['#ce0d13','Vermelho','#ce0d13'],['#e6600d','Laranja','#e6600d'],['#15803d','Verde','#15803d'],['#18181b','Grafite','#18181b']].map(([v,l,c])=>html`<button key=${l} className="btn" style=${{borderColor:(ctx.tema.cor||'')===v?'var(--acc)':'',boxShadow:(ctx.tema.cor||'')===v?'0 0 0 2px var(--acc)':''}} onClick=${()=>ctx.setTema({...ctx.tema,cor:v})}><span style=${{width:16,height:16,borderRadius:9,background:c,display:'inline-block'}}></span>${l}</button>`)}
     <label className="btn" style=${{cursor:'pointer'}}>Personalizar <input type="color" value=${ctx.tema.cor||'#a3089a'} onChange=${e=>ctx.setTema({...ctx.tema,cor:e.target.value})} style=${{width:28,height:22,border:0,background:'none',padding:0}}/></label></div></div></div>`}
  ${aba==='importar'&&admin&&html`<${ImportarScalle} ...${ctx}/>`}</div>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>
</body>
</html>
